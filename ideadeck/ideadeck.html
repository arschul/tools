<meta charset="UTF-8">

<title>IdeaDeck</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== IdeaDeck — letterpress print shop after hours =====
     Material world: slate linoleum desk, cut cardstock cards with category ink stripes,
     a brass card-catalog box (hero), manila index folder (detail), press-bed sheets (present). */
  :root {
    --lino: #22302D;
    --lino-2: #1A2523;
    --card: #EDE3CC;
    --card-2: #E2D6BA;
    --card-edge: #C7B892;
    --brass: #B88A3B;
    --brass-hi: #E6C47A;
    --brass-lo: #6E4F1C;
    --ink: #1B1F2A;
    --ink-2: #3B4152;
    --verm: #E04A2C;
    --sage: #5E9F6A;
    --manila: #E3C98E;
    --manila-2: #D3B472;
    --kraft: #C9A574;
    --scene-text: #EDE3CC;
    --scene-dim: #A9B5AE;
    --beg: #5E9F6A;
    --int: #3F7FC0;
    --adv: #B5487C;
    --focus: #F2C14E;
    --display: 'Alfa Slab One', 'Rockwell', Georgia, serif;
    --ui: 'Figtree', system-ui, sans-serif;
  }
  :root[data-theme="light"] {
    --lino: #CDB48E;
    --lino-2: #B99C72;
    --scene-text: #1B1F2A;
    --scene-dim: #4C4232;
    --focus: #1B1F2A;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    font-family: var(--ui);
    color: var(--scene-text);
    background-color: var(--lino);
    /* linoleum: fine speckle + lamp pool + edge falloff */
    background-image:
      radial-gradient(ellipse 70% 55% at 50% 18%, rgba(255,236,190,.09), transparent 70%),
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.035) 0 1px, transparent 1.5px),
      radial-gradient(circle at 70% 60%, rgba(0,0,0,.18) 0 1px, transparent 1.6px),
      radial-gradient(ellipse 120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.35) 100%);
    background-size: auto, 7px 7px, 11px 11px, auto;
    background-attachment: fixed;
  }
  :root[data-theme="light"] body {
    /* daylight maple workbench */
    background-image:
      radial-gradient(ellipse 70% 55% at 50% 10%, rgba(255,250,235,.35), transparent 70%),
      repeating-linear-gradient(91deg, rgba(120,80,30,.07) 0 2px, transparent 2px 9px),
      repeating-linear-gradient(89.3deg, rgba(90,60,20,.05) 0 1px, transparent 1px 23px),
      linear-gradient(180deg, #D6BE98, #C3A67B);
    background-size: auto;
  }

  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .back-link {
    position: fixed; top: 14px; left: 16px; z-index: 40;
    font: 600 15px var(--ui); color: var(--scene-text); text-decoration: none;
    padding: 8px 12px; border-radius: 8px;
    background: rgba(0,0,0,.28); backdrop-filter: blur(4px);
  }
  :root[data-theme="light"] .back-link { background: rgba(255,250,235,.55); }
  .back-link:hover { text-decoration: underline; }

  /* ===== Header ===== */
  header { padding: 64px 24px 8px; }
  .header-inner {
    max-width: 1440px; margin: 0 auto;
    display: grid; grid-template-columns: 1fr auto; gap: 18px 32px; align-items: end;
  }
  .title-block h1 {
    font: 400 clamp(52px, 7vw, 96px)/.92 var(--display);
    letter-spacing: .5px; color: var(--card);
    /* letterpress impression: debossed into the desk */
    text-shadow: 0 -1px 0 rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.08);
  }
  :root[data-theme="light"] .title-block h1 { color: var(--ink); text-shadow: 0 1px 0 rgba(255,250,235,.6), 0 -1px 0 rgba(0,0,0,.25); }
  .title-block h1 span { color: var(--brass-hi); }
  :root[data-theme="light"] .title-block h1 span { color: var(--brass-lo); }
  .title-block p { margin-top: 10px; font: 500 19px var(--ui); color: var(--scene-dim); }

  .tools-row { display: flex; gap: 12px; align-items: center; }
  .icon-btn {
    width: 56px; height: 56px; border-radius: 14px; border: 0; cursor: pointer;
    display: grid; place-items: center; color: var(--ink);
    background: linear-gradient(180deg, var(--card), var(--card-2));
    box-shadow: 0 5px 0 var(--card-edge), 0 10px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.7);
    transition: transform .12s, box-shadow .12s;
  }
  .icon-btn svg { width: 24px; height: 24px; }
  .icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--card-edge), 0 4px 8px rgba(0,0,0,.3); }
  .icon-btn[aria-pressed="true"] { background: linear-gradient(180deg, #d9cdb0, #c9bb98); }

  /* ===== Hero: the brass card box ===== */
  .deck-box {
    position: relative; width: 210px; height: 112px; border: 0; cursor: pointer;
    background: none; padding: 0; color: var(--ink);
  }
  .deck-box .peek {
    position: absolute; left: 22px; right: 22px; height: 56px; top: 0;
    border-radius: 4px 4px 0 0;
    background: linear-gradient(180deg, var(--card), var(--card-2));
    box-shadow: 0 -1px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.7);
    transition: transform .25s cubic-bezier(.3,1.4,.5,1);
  }
  .deck-box .peek::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 7px; border-radius: 4px 4px 0 0; background: var(--pk); }
  .deck-box .peek:nth-child(1) { --pk: #60c4a0; transform: translate(-10px, 2px) rotate(-4deg); }
  .deck-box .peek:nth-child(2) { --pk: #f0c040; transform: translate(8px, -2px) rotate(3deg); }
  .deck-box .peek:nth-child(3) { --pk: #e040a0; transform: translate(0, 6px) rotate(-1deg); }
  .deck-box:hover .peek:nth-child(3) { transform: translate(0, -6px) rotate(-1deg); }
  .deck-box .front {
    position: absolute; left: 0; right: 0; bottom: 0; height: 74px; border-radius: 10px 10px 14px 14px;
    background:
      radial-gradient(ellipse 60% 120% at 30% 0%, rgba(255,240,200,.55), transparent 60%),
      linear-gradient(180deg, var(--brass-hi), var(--brass) 45%, #8E6625);
    box-shadow: 0 6px 0 var(--brass-lo), 0 16px 24px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,250,225,.6), inset 0 -3px 6px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .12s, box-shadow .12s;
  }
  .deck-box .plate {
    font: 400 24px var(--display); color: #2A1C06; letter-spacing: .5px;
    padding: 6px 16px 5px; border-radius: 6px;
    background: linear-gradient(180deg, #F4DFA5, #D6B266);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.35), 0 1px 0 rgba(255,250,225,.6);
  }
  .deck-box .key { font: 700 13px var(--ui); color: #3A2708; opacity: .8; }
  .deck-box:active .front { transform: translateY(5px); box-shadow: 0 1px 0 var(--brass-lo), 0 6px 10px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,250,225,.6); }
  .deck-box.rattle { animation: rattle .42s ease-out; }
  @keyframes rattle {
    0%,100% { transform: none; } 15% { transform: translate(-4px,1px) rotate(-2deg); }
    35% { transform: translate(4px,-1px) rotate(2deg); } 55% { transform: translate(-3px,0) rotate(-1deg); }
    75% { transform: translate(2px,0) rotate(.6deg); }
  }
  .deck-box.rattle .peek:nth-child(1) { animation: riffle .4s ease-out; }
  .deck-box.rattle .peek:nth-child(2) { animation: riffle .4s .07s ease-out; }
  .deck-box.rattle .peek:nth-child(3) { animation: riffle .4s .14s ease-out; }
  @keyframes riffle { 40% { margin-top: -22px; } 100% { margin-top: 0; } }

  /* ===== Search ===== */
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 16px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
  #search {
    width: min(360px, 100%); height: 56px; padding: 0 16px 0 46px;
    font: 500 17px var(--ui); color: var(--ink);
    border: 0; border-radius: 10px;
    background: linear-gradient(180deg, #F6EFDD, var(--card));
    box-shadow: inset 0 3px 6px rgba(0,0,0,.22), 0 1px 0 rgba(255,255,255,.12);
  }
  #search::placeholder { color: #7C7360; }

  /* ===== Category filters: rubber-stamp labels ===== */
  .refine-bar, .count-bar { max-width: 1488px; margin: 0 auto; }
  .cat-filters { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; }
  .cat-btn {
    min-height: 48px; padding: 0 16px 0 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 9px;
    font: 600 16px var(--ui); color: var(--ink);
    border: 0; border-radius: 6px;
    background: linear-gradient(180deg, var(--card), var(--card-2));
    box-shadow: 0 3px 0 var(--card-edge), 0 6px 10px rgba(0,0,0,.25);
    transition: transform .12s, box-shadow .12s, background .2s;
  }
  .cat-btn .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c, var(--ink)); box-shadow: inset 0 -2px 3px rgba(0,0,0,.25); }
  .cat-btn .cnt { font: 700 13px var(--ui); padding: 2px 7px; border-radius: 4px; background: rgba(27,31,42,.1); }
  .cat-btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--card-edge), 0 3px 5px rgba(0,0,0,.2); }
  .cat-btn.active { background: var(--c, var(--ink)); color: var(--on, #fff); box-shadow: 0 3px 0 rgba(0,0,0,.35), 0 6px 10px rgba(0,0,0,.25), inset 0 0 0 2px rgba(0,0,0,.15); }
  .cat-btn.active .dot { background: currentColor; }
  .cat-btn.active .cnt { background: rgba(0,0,0,.15); }

  /* ===== Quick refinements: kraft tags with a punched hole ===== */
  .refine-bar { display: flex; flex-wrap: wrap; gap: 10px; padding: 18px 24px 0; }
  .ref-btn {
    position: relative; min-height: 44px; padding: 0 16px 0 30px; cursor: pointer;
    font: 600 15px var(--ui); color: #3A2A12; border: 0;
    border-radius: 4px 12px 12px 4px;
    background: linear-gradient(180deg, #D8B887, var(--kraft));
    box-shadow: 0 2px 0 #9C7C4C, 0 5px 8px rgba(0,0,0,.25);
    transition: transform .12s, background .2s;
  }
  .ref-btn::before { content: ''; position: absolute; left: 11px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--lino-2); box-shadow: inset 0 1px 2px rgba(0,0,0,.7); }
  .ref-btn.active { background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: #2A1C06; box-shadow: 0 2px 0 var(--brass-lo), 0 5px 8px rgba(0,0,0,.3); }
  .ref-btn:active { transform: translateY(2px); }

  .count-bar { padding: 16px 24px 4px; font: 600 17px var(--ui); color: var(--scene-dim); }

  /* ===== Grid of cardstock cards ===== */
  #view-grid { padding: 8px 24px 80px; }
  .grid { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 26px 22px; }
  .card {
    position: relative; display: flex; flex-direction: column; padding: 26px 22px 18px;
    color: var(--ink); border-radius: 3px;
    transform: rotate(var(--tilt, 0deg));
    background:
      repeating-linear-gradient(91deg, rgba(120,95,50,.035) 0 1px, transparent 1px 4px),
      radial-gradient(ellipse 80% 60% at 30% 0%, rgba(255,255,255,.55), transparent 70%),
      linear-gradient(180deg, var(--card), var(--card-2));
    box-shadow: 0 1px 0 var(--card-edge), 0 2px 0 rgba(0,0,0,.08), 0 12px 20px rgba(0,0,0,.32);
    transition: transform .22s cubic-bezier(.3,1.3,.5,1), box-shadow .22s;
  }
  .card::before { /* inked category stripe, slightly uneven like a hand-inked block */
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 12px;
    background: var(--card-accent);
    -webkit-mask: linear-gradient(90deg, #000 0 97%, rgba(0,0,0,.75) 100%);
            mask: linear-gradient(90deg, #000 0 97%, rgba(0,0,0,.75) 100%);
    opacity: .95; border-radius: 3px 3px 0 0;
  }
  .card:hover, .card:focus-within { transform: translateY(-6px) rotate(0deg); box-shadow: 0 1px 0 var(--card-edge), 0 22px 30px rgba(0,0,0,.38); }
  .card[hidden] { display: none; }
  .card-icon { font-size: 40px; line-height: 1; margin-bottom: 12px; }
  .card-title { font: 400 25px/1.12 var(--display); letter-spacing: .2px; margin-bottom: 8px; padding-right: 44px; }
  .card-link { color: inherit; text-decoration: none; }
  .card-link::after { content: ''; position: absolute; inset: 0; z-index: 1; }
  .card-link:focus-visible { outline: none; }
  .card:has(.card-link:focus-visible) { outline: 3px solid var(--focus); outline-offset: 4px; }
  .card-subtitle { font: 400 16px/1.45 var(--ui); color: var(--ink-2); flex: 1; }

  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .card-meta span { font: 600 13px var(--ui); padding: 3px 8px; border-radius: 3px; border: 1.5px solid rgba(27,31,42,.28); color: var(--ink-2); }

  .card-footer { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1.5px dashed rgba(27,31,42,.22); }
  .tag { font: 700 13px var(--ui); padding: 5px 9px; border-radius: 4px; text-decoration: none; }
  .tag-cat { color: var(--ink-2); padding-left: 0; margin-right: auto; }
  .tag-beg, .tag-int, .tag-adv { color: #fff; min-height: 30px; display: inline-flex; align-items: center; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.18); }
  .tag-beg { background: var(--beg); } .tag-int { background: var(--int); } .tag-adv { background: var(--adv); }
  .tag:hover { filter: brightness(1.08); }
  .tag:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* brass rivet favorite */
  .fav {
    position: absolute; top: 22px; right: 16px; z-index: 2;
    width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; font: 400 22px/1 var(--ui); color: rgba(27,31,42,.4);
    background: radial-gradient(circle at 50% 45%, #CFC2A2, #B8AA86);
    box-shadow: inset 0 3px 5px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.6);
  }
  .fav.on {
    color: #3A2708;
    background: radial-gradient(circle at 35% 30%, #FFF0C0, transparent 32%), radial-gradient(circle at 50% 55%, var(--brass-hi), var(--brass) 70%, #7C5A20);
    box-shadow: 0 3px 0 var(--brass-lo), 0 5px 8px rgba(0,0,0,.35), inset 0 -2px 3px rgba(0,0,0,.25);
  }
  .fav.punch { animation: punch .34s cubic-bezier(.3,1.6,.5,1); }
  @keyframes punch { 0% { transform: scale(.6); } 60% { transform: scale(1.22, .86); } 100% { transform: none; } }

  .card-open { position: relative; z-index: 0; margin-top: 12px; font: 700 15px var(--ui); color: var(--ink-2); opacity: 0; transform: translateY(4px); transition: .2s; }
  .card:hover .card-open, .card:focus-within .card-open { opacity: 1; transform: none; }

  .no-results {
    grid-column: 1 / -1; justify-self: center; max-width: 560px; margin-top: 30px; padding: 30px 32px;
    text-align: center; color: var(--ink); border-radius: 3px;
    background: linear-gradient(180deg, var(--card), var(--card-2)); box-shadow: 0 12px 20px rgba(0,0,0,.3);
    transform: rotate(-.8deg);
  }
  .no-results b { display: block; font: 400 30px var(--display); margin-bottom: 8px; }
  .no-results p { font: 500 17px/1.45 var(--ui); color: var(--ink-2); }
  .no-results button { margin-top: 16px; min-height: 52px; padding: 0 20px; border: 0; border-radius: 12px; cursor: pointer; font: 700 16px var(--ui); color: #2A1C06; background: linear-gradient(180deg, var(--brass-hi), var(--brass)); box-shadow: 0 4px 0 var(--brass-lo); }
  .no-results button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brass-lo); }

  /* ===== Manila index folder (detail drawer) ===== */
  .scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10,14,13,.55); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; z-index: 60; top: 28px; right: 0; bottom: 0; width: min(760px, 100vw);
    display: flex; flex-direction: column; color: var(--ink);
    border-radius: 14px 0 0 0;
    background:
      repeating-linear-gradient(90.5deg, rgba(120,85,25,.05) 0 1px, transparent 1px 5px),
      radial-gradient(ellipse 90% 40% at 40% 0%, rgba(255,245,215,.45), transparent 70%),
      linear-gradient(180deg, var(--manila), var(--manila-2));
    box-shadow: -8px 0 0 -2px #B9984F, -20px 0 40px rgba(0,0,0,.45);
    transform: translateY(40px) scale(.96); opacity: 0; visibility: hidden;
    transition: transform .42s cubic-bezier(.25,1.35,.45,1), opacity .2s, visibility 0s .42s;
    outline: none;
  }
  .drawer.show { transform: none; opacity: 1; visibility: visible; transition: transform .42s cubic-bezier(.25,1.35,.45,1), opacity .2s; }
  .dw-tab {
    position: absolute; top: -26px; left: 26px; height: 30px; padding: 4px 18px 0;
    font: 700 14px var(--ui); color: var(--ink); border-radius: 10px 10px 0 0;
    background: linear-gradient(180deg, #EBD49C, var(--manila));
    display: flex; align-items: center; gap: 8px;
  }
  .dw-tab i { width: 11px; height: 11px; border-radius: 50%; background: var(--tab-c); }
  .dw-head { position: relative; padding: 24px 28px 18px; }
  .dw-close {
    position: absolute; top: 18px; right: 18px; width: 56px; height: 56px; border: 0; border-radius: 50%; cursor: pointer;
    font: 700 22px var(--ui); color: var(--ink);
    background: radial-gradient(circle at 40% 35%, #F7E6B8, #D7BC80); box-shadow: 0 3px 0 #A9884A, 0 6px 10px rgba(0,0,0,.25);
  }
  .dw-close:active { transform: translateY(2px); box-shadow: 0 1px 0 #A9884A; }
  .dw-actions { display: flex; gap: 10px; margin-top: 18px; }
  .dw-act {
    min-height: 56px; padding: 0 22px; border: 0; border-radius: 14px; cursor: pointer;
    font: 700 17px var(--ui);
    transition: transform .12s, box-shadow .12s;
  }
  .dw-act.go-present { color: #2A1C06; background: linear-gradient(180deg, var(--brass-hi), var(--brass)); box-shadow: 0 5px 0 var(--brass-lo), 0 10px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,250,225,.5); }
  .dw-act.go-print { color: var(--ink); background: linear-gradient(180deg, var(--card), var(--card-2)); box-shadow: 0 5px 0 var(--card-edge), 0 10px 14px rgba(0,0,0,.2); }
  .dw-act:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .dw-hero { display: flex; gap: 18px; align-items: flex-start; padding-right: 64px; }
  .dw-icon { font-size: 56px; line-height: 1; }
  .dw-title { font: 400 clamp(30px, 4vw, 42px)/1.05 var(--display); }
  .dw-tagline { margin-top: 8px; font: 500 18px/1.4 var(--ui); color: var(--ink-2); }
  .dw-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .dw-meta span { font: 700 13px var(--ui); padding: 4px 9px; border-radius: 3px; border: 1.5px solid rgba(27,31,42,.35); transform: rotate(-.6deg); }
  .dw-meta span:nth-child(even) { transform: rotate(.5deg); }

  /* level index tabs */
  .seg { display: flex; gap: 4px; padding: 0 28px; margin-top: 4px; }
  .seg-btn {
    flex: 1; min-height: 64px; padding: 8px 10px; cursor: pointer; border: 0;
    border-radius: 10px 10px 0 0; color: var(--ink);
    background: rgba(255,250,230,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transform: translateY(6px); transition: transform .18s, background .18s;
  }
  .seg-name { font: 700 16px var(--ui); }
  .seg-cefr { font: 700 13px var(--ui); color: var(--ink-2); }
  .seg-btn.active { transform: none; background: #FBF5E4; box-shadow: inset 0 4px 0 var(--lc); }
  .seg-btn.beg { --lc: var(--beg); } .seg-btn.int { --lc: var(--int); } .seg-btn.adv { --lc: var(--adv); }

  .lvl-body {

  .step { display: grid; grid-template-columns: 44px 1fr; gap: 20px; padding: 12px 0; }
  .step-num {

  .lvl-tip::before { content: 'Teacher tip'; display: block; font: 800 14px var(--ui); color: #2F5E38; margin-bottom: 4px; }

  /* ===== Present mode: the press bed ===== */
  .present {

      radial-gradient(ellipse 80% 60% at 50% 45%, rgba(255,236,190,.08), transparent 70%),

  .present.show { display: flex; }
  .pr-shaker { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .pr-top { display: flex; align-items: center; gap: 16px; padding: 18px 28px 0; }
  .pr-band {
    flex: 1; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 28px;
    background: var(--band); color: var(--band-ink, #fff);
    transform: skewX(-12deg); box-shadow: 0 6px 0 rgba(0,0,0,.25);
  }
  .pr-band > * { transform: skewX(12deg); }
  .pr-icon { font-size: 34px; }
  .pr-name { font: 400 clamp(22px, 2.4vw, 34px) var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-badge { margin-left: auto; font: 800 18px var(--ui); padding: 6px 12px; border-radius: 6px; background: var(--lvl); color: #fff; }
  .pr-exit, .pr-mute {
    width: 64px; height: 64px; flex: none; border: 0; border-radius: 16px; cursor: pointer;
    display: grid; place-items: center; font: 700 24px var(--ui); color: var(--ink);
    background: linear-gradient(180deg, var(--card), var(--card-2)); box-shadow: 0 5px 0 var(--card-edge), 0 10px 14px rgba(0,0,0,.4);
  }
  .pr-mute svg { width: 26px; height: 26px; }
  .pr-exit:active, .pr-mute:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--card-edge); }

  .pr-stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; padding: 26px 28px; cursor: pointer; overflow: hidden; }
  .sheet {
    grid-area: 1 / 1; width: min(1500px, 100%); max-height: 100%; overflow-y: auto;
    padding: clamp(28px, 4vw, 64px) clamp(28px, 5vw, 88px);
    border-radius: 3px;
    background:
      repeating-linear-gradient(91deg, rgba(120,95,50,.035) 0 1px, transparent 1px 4px),

  .sheet::before { content: ''; display: block; height: 14px; margin: calc(-1 * clamp(28px, 4vw, 64px)) calc(-1 * clamp(28px, 5vw, 88px)) clamp(22px, 3vw, 44px); background: var(--band); border-radius: 3px 3px 0 0; }
  .pr-num { font: 800 clamp(18px, 1.6vw, 24px) var(--ui); color: var(--lvl); margin-bottom: 10px; }
  .pr-title { font: 400 clamp(40px, 5.2vw, 84px)/1.04 var(--display); color: var(--ink); }
  .pr-tagline, .pr-desc { margin-top: 20px; font: 500 clamp(24px, 2.5vw, 40px)/1.35 var(--ui); color: var(--ink-2); max-width: 30ch; }
  .pr-desc { max-width: 42ch; }
  .pr-tip { margin-top: 26px; padding: 16px 20px; font: 500 clamp(18px, 1.6vw, 26px)/1.45 var(--ui); background: #EAF2E1; border-left: 8px solid var(--sage); max-width: 60ch; }
  .pr-tip::before { content: 'Teacher tip'; display: block; font: 800 .75em var(--ui); color: #2F5E38; margin-bottom: 4px; }
  .pr-tip[hidden] { display: none; }

  .pr-foot { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 0 28px 14px; }
  .pr-dots { display: flex; gap: 8px; }
  .pr-dot { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; background: rgba(237,227,204,.25); box-shadow: inset 0 2px 3px rgba(0,0,0,.5); transition: background .2s, transform .2s; }
  .pr-dot.on { background: radial-gradient(circle at 35% 30%, #FFF0C0, var(--brass) 70%); transform: scale(1.25); box-shadow: 0 2px 0 var(--brass-lo); }

  .pr-timer { display: flex; align-items: center; gap: 8px; margin-left: auto; }

    min-width: 60px; height: 60px; padding: 0 10px; border: 0; border-radius: 12px; cursor: pointer;

  }
  .pr-tset:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--card-edge); }
  .pr-clock {
    position: relative; width: 96px; height: 96px; border-radius: 50%; cursor: pointer; flex: none;

  .pr-clock.paused span { opacity: .55; }
  .pr-clock.done::before { background: var(--verm); }
  .pr-clock[hidden], .pr-tclear[hidden] { display: none; }

  .pr-nav { display: flex; gap: 10px; }
  .pr-btn {
    min-height: 72px; min-width: 72px; padding: 0 26px; border: 0; border-radius: 18px; cursor: pointer;
    font: 800 22px var(--ui);

  }
  .pr-btn.next { min-width: 170px; color: #2A1C06; background: linear-gradient(180deg, var(--brass-hi), var(--brass)); box-shadow: 0 7px 0 var(--brass-lo), 0 16px 24px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,250,225,.5); }
  .pr-btn.prev, .pr-btn.ghost { color: var(--ink); background: linear-gradient(180deg, var(--card), var(--card-2)); box-shadow: 0 7px 0 var(--card-edge), 0 16px 24px rgba(0,0,0,.4); }
  .pr-btn.ghost[aria-pressed="true"] { background: linear-gradient(180deg, #DDEBD2, #BFD6AE); box-shadow: 0 7px 0 #7FA672, 0 16px 24px rgba(0,0,0,.4); }
  .pr-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 1px 0 rgba(0,0,0,.35), 0 6px 10px rgba(0,0,0,.35); }
  .pr-btn:disabled { opacity: .4; cursor: default; }

  .pr-hint { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; padding: 0 0 12px; font: 500 14px var(--ui); color: rgba(237,227,204,.6); }
  :root[data-theme="light"] .pr-hint { color: rgba(27,31,42,.65); }
  .pr-hint kbd { font: 700 13px var(--ui); padding: 2px 7px; margin-right: 4px; border-radius: 4px; background: rgba(237,227,204,.14); border-bottom: 2px solid rgba(0,0,0,.4); }

  /* stamp + vignette */
  .stamp {
    position: absolute; z-index: 5; top: 5%; right: 5%;
    font: 400 clamp(64px, 8vw, 128px)/1 var(--display); color: var(--verm);
    padding: 6px 26px 2px; border: 7px double var(--verm); border-radius: 10px;
    transform: rotate(-8deg); pointer-events: none;
    background: rgba(27,31,42,.55); text-shadow: 0 2px 0 rgba(0,0,0,.35);

  }
  .stamp small { display: block; font: 800 clamp(16px, 1.4vw, 22px)/1.2 var(--ui); text-align: center; padding-bottom: 6px; }
  .stamp.slam { animation: slam .38s cubic-bezier(.2,.9,.3,1.2) both; }

  .vignette { position: fixed; inset: 0; z-index: 95; pointer-events: none; background: radial-gradient(ellipse at center, transparent 35%, rgba(224,74,44,.75) 100%); animation: vig .9s ease-out forwards; }

  /* flying card for the draw */
  .fly-card {

  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 100; pointer-events: none; }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .header-inner { grid-template-columns: minmax(0, 1fr); }

  /* ===== Reduced motion ===== */
  @media (prefers-reduced-motion: reduce) {

    fx.ps.push({ kind, x: x + (Math.random() - .5) * (o.w || 0), y: y + (Math.random() - .5) * (o.h || 0),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: o.g != null ? o.g : .15,
      r: (o.size || 3) * (.6 + Math.random() * .8), life: 1, decay: (o.decay || .02) * (.7 + Math.random() * .6),
      c: colors[(Math.random() * colors.length) | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .3 });
  }
  if (!fx.raf) fx.raf = requestAnimationFrame(fxLoop);
}
function fxLoop() {
  const { cx, dpr } = fx;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  fx.ps = fx.ps.filter(p => p.life > 0);
  fx.ps.forEach(p => {
    p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.rot += p.vr;
    cx.globalAlpha = Math.max(0, p.life);
    cx.fillStyle = p.c;
    if (p.kind === 'puff') {
      const r = Math.max(.1, p.r * (1 + (1 - p.life) * 2.2));
      cx.globalAlpha = Math.max(0, p.life) * .45;
      cx.beginPath(); cx.arc(p.x, p.y, r, 0, Math.PI * 2); cx.fill();
    } else if (p.kind === 'splat') {
      cx.beginPath(); cx.ellipse(p.x, p.y, Math.max(.1, p.r), Math.max(.1, p.r * .7), p.rot, 0, Math.PI * 2); cx.fill();
    } else {
      cx.beginPath(); cx.arc(p.x, p.y, Math.max(.1, p.r * p.life), 0, Math.PI * 2); cx.fill();
    }
  });
  cx.globalAlpha = 1;
  if (fx.ps.length) fx.raf = requestAnimationFrame(fxLoop);
  else { fx.raf = 0; cx.clearRect(0, 0, window.innerWidth, window.innerHeight); }
}
function centerOf(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r }; }

// ---------------- Screen shake (decaying random offset) ----------------
function shake(el, px, ms) {
  if (reduced || !el) return;
  const t0 = performance.now();
  (function step(t) {
    const k = 1 - (t - t0) / ms;
    if (k <= 0) { el.style.transform = ''; return; }
    const a = px * k * k;
    el.style.transform = 'translate(' + ((Math.random() * 2 - 1) * a) + 'px,' + ((Math.random() * 2 - 1) * a) + 'px) rotate(' + ((Math.random() * 2 - 1) * a * .03) + 'deg)';
    requestAnimationFrame(step);
  })(t0);
}

// ---------------- Search index, favorites, refinements ----------------
function normText(t) { return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
const SEARCH_INDEX = {};

  });

});

let activeFilter = 'All';

let currentLevel = (function () { const v = store('ideadeck-level'); return ['beg', 'int', 'adv'].includes(v) ? v : 'beg'; })();
let drawerOpen = false;
let lastFocus = null;
const FOCUSABLE = 'a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])';

function trapTab(e, root) {
  const items = Array.from(root.querySelectorAll(FOCUSABLE)).filter(x => !x.closest('[hidden]'));
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
function restoreFocus() {
  if (lastFocus && lastFocus.isConnected) { try { lastFocus.focus(); } catch (e) {} }
  lastFocus = null;
}

function getCat(title) { return itemToCategory[title] || 'Other'; }
function getColor(title) { return itemToColor[title] || '#a0a0c0'; }

function buildFilters() {

}

function getFiltered() {
  const query = normText($('search').value.trim());
  return DATA.filter(d => {
    const matchCat = activeFilter === 'All' || getCat(d.title) === activeFilter;
    const matchQuery = !query || (SEARCH_INDEX[d.title] || '').includes(query);
    const matchRefine = [...activeRefine].every(k => REFINE[k].test(d));
    return matchCat && matchQuery && matchRefine;
  });
}

// ---------------- Cards: persistent DOM + FLIP reflow ----------------
const cardEls = {};
function metaChips(d) {

function buildCards() {

let firstRender = true;
function renderCards() {
  const filtered = getFiltered();
  const show = new Set(filtered.map(d => slug(d.title)));
  const anim = canAnimate() && !firstRender;
  const before = {};
  if (anim) Object.keys(cardEls).forEach(sl => { const c = cardEls[sl]; if (!c.hidden) before[sl] = c.getBoundingClientRect(); });

  Object.keys(cardEls).forEach(sl => { cardEls[sl].hidden = !show.has(sl); });
  $('noResults').hidden = filtered.length > 0;
  $('countBar').textContent = filtered.length + (filtered.length === 1 ? ' activity' : ' activities');

  if (firstRender) {
    firstRender = false;
    if (canAnimate()) filtered.forEach((d, i) => {
      const c = cardEls[slug(d.title)], rot = 'rotate(' + c.dataset.tilt + 'deg)';
      c.animate([{ opacity: 0, transform: 'translateY(-26px) rotate(' + (i % 2 ? 3 : -3) + 'deg)' }, { opacity: 1, transform: rot }],
        { duration: 380, delay: Math.min(i, 24) * 22, easing: 'cubic-bezier(.3,1.3,.5,1)', fill: 'backwards' });
    });
    return;
  }
  if (!anim) return;
  let k = 0;
  filtered.forEach(d => {
    const sl = slug(d.title), c = cardEls[sl], r = c.getBoundingClientRect(), b = before[sl], rot = 'rotate(' + c.dataset.tilt + 'deg)';
    if (b) {
      const dx = b.left - r.left, dy = b.top - r.top;
      if (dx || dy) c.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px) ' + rot }, { transform: rot }],
        { duration: 340, easing: 'cubic-bezier(.3,1.1,.4,1)' });
    } else {
      c.animate([{ opacity: 0, transform: 'translateY(-18px) scale(.94)' }, { opacity: 1, transform: rot }],
        { duration: 300, delay: Math.min(k++, 12) * 30, easing: 'cubic-bezier(.3,1.3,.5,1)', fill: 'backwards' });
    }
  });
}

function toggleFav(e, sl) {
  e.preventDefault(); e.stopPropagation();
  const on = !favs.has(sl);
  if (on) favs.add(sl); else favs.delete(sl);
  saveFavs();
  const d = DATA.find(x => slug(x.title) === sl);
  const btn = document.querySelector('.fav[data-sl="' + sl + '"]');
  if (btn) {
    btn.classList.toggle('on', on);
    btn.textContent = on ? '★' : '☆';
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', favLabel(d, on));
    if (on) {
      btn.classList.remove('punch'); void btn.offsetWidth; btn.classList.add('punch');
      const p = centerOf(btn);
      emit(14, p.x, p.y, { colors: ['#E6C47A', '#FFF0C0', '#B88A3B'], speed: 4.5, g: .12, size: 2.6, decay: .035 });
      SFX.tick();
    } else SFX.unpunch();
  }
  if (activeRefine.has('fav')) renderCards();
}

// ---------------- The draw: a card riffles out of the brass box ----------------
const drawn = new Set();
let drawing = false;
function dealRandom() {
  if (drawing) return;
  const pool = getFiltered();
  const box = $('diceBtn');
  if (!pool.length) {
    if (canAnimate()) box.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 260 });
    return;
  }
  let candidates = pool.filter(d => !drawn.has(slug(d.title)));
  if (!candidates.length) { drawn.clear(); candidates = pool; }
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  const sl = slug(pick.title);
  drawn.add(sl);
  SFX.riffle();
  if (!canAnimate()) { go(null, sl, LEVEL2CODE[currentLevel]); return; }

  drawing = true;
  box.classList.remove('rattle'); void box.offsetWidth; box.classList.add('rattle');
  const from = centerOf(box);
  const fly = document.createElement('div');
  fly.className = 'fly-card';
  fly.style.setProperty('--card-accent', getColor(pick.title));
  fly.innerHTML = '<div class="card-icon" aria-hidden="true">' + pick.icon + '</div><div class="card-title">' + pick.title + '</div><p class="card-subtitle">' + pick.tagline + '</p>';
  fly.setAttribute('aria-hidden', 'true');
  document.body.appendChild(fly);
  const tx = window.innerWidth / 2, ty = window.innerHeight / 2;
  const sx = from.x, sy = from.r.top + 10;
  const dist = Math.hypot(tx - sx, ty - sy), lift = Math.min(220, 80 + dist * .35);
  const mx = (sx + tx) / 2, my = Math.min(sy, ty) - lift;
  const T = (x, y, s, r) => 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) scale(' + s + ') rotate(' + r + 'deg)';
  const flight = fly.animate([
    { transform: T(sx, sy + 20, .35, -8), opacity: 0 },
    { transform: T(sx, sy - 40, .5, -4), opacity: 1, offset: .2 },
    { transform: T(mx, my, 1.15, 10), offset: .6 },
    { transform: T(tx, ty, 1.3, -2) },
  ], { duration: 760, delay: 260, easing: 'cubic-bezier(.35,.1,.3,1)', fill: 'both' });
  flight.onfinish = () => {
    SFX.thud();
    emit(7, tx, ty + 110, { kind: 'puff', colors: ['#EDE3CC', '#C7B892'], speed: 2, g: -.02, size: 12, decay: .025, spread: Math.PI, angle: 0 });
    const land = fly.animate([
      { transform: T(tx, ty, 1.3, -2) },
      { transform: 'translate(' + tx + 'px,' + ty + 'px) translate(-50%,-50%) scale(1.5,1.02) rotate(-2deg)' },
      { transform: 'translate(' + tx + 'px,' + ty + 'px) translate(-50%,-50%) scale(1.22,1.36) rotate(-2deg)' },
      { transform: T(tx, ty, 1.3, -2) },
    ], { duration: 260, easing: 'ease-out', fill: 'both' });
    land.onfinish = () => {
      setTimeout(() => {
        fly.remove(); drawing = false;
        lastFocus = box;
        go(null, sl, LEVEL2CODE[currentLevel]);
      }, 140);
    };
  };
}

  }
  SFX.whoosh();
  if (!lastFocus) lastFocus = document.activeElement;
  el.focus();
}

function sheetHTML(sl, tip) {
  const tipHTML = tip ? '<div class="pr-tip" id="prTip"' + (prTipShown ? '' : ' hidden') + '>' + tip + '</div>' : '';
  return sl.kind === 'title'
    ? '<div class="pr-title">' + sl.title + '</div><div class="pr-tagline">' + sl.desc + '</div>' + tipHTML
    : '<div class="pr-num">Step ' + sl.n + ' of ' + sl.of + '</div><div class="pr-title">' + sl.title + '</div><div class="pr-desc">' + sl.desc + '</div>' + tipHTML;
}

// dir: 0 = first sheet, 1 = forward, -1 = back
function prRender(dir) {
  const s = prSlides[prIndex];
  const d = DATA.find(x => slug(x.title) === currentSlug);
  const tip = d && d[currentLevel] ? d[currentLevel].tip : '';
  const stage = $('prStage');
  if (!stage) return;

  const old = stage.querySelector('.sheet:not(.leaving)');
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  const tilt = prIndex % 2 ? .35 : -.4;
  sheet.dataset.tilt = tilt;
  sheet.style.setProperty('--tilt', tilt + 'deg');
  sheet.innerHTML = sheetHTML(s, tip);

  if (old) {
    old.classList.add('leaving');
    old.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    if (canAnimate() && dir) {
      old.style.pointerEvents = 'none';
      const a = old.animate([{ transform: 'rotate(' + old.dataset.tilt + 'deg)', opacity: 1 },
        { opacity: .25, offset: .35 },
        { transform: 'translateX(' + (dir > 0 ? -70 : 70) + 'vw) rotate(' + (dir > 0 ? -7 : 7) + 'deg)', opacity: 0 }],
        { duration: 380, easing: 'cubic-bezier(.5,0,.75,.4)', fill: 'forwards' });
      a.onfinish = () => old.remove();
    } else old.remove();
  }
  stage.appendChild(sheet);
  if (canAnimate()) {
    sheet.animate([
      { transform: 'translateY(-60px) scale(1.04) rotate(' + tilt + 'deg)', opacity: 0 },
      { transform: 'translateY(4px) scale(1.012,.985) rotate(' + tilt + 'deg)', opacity: 1, offset: .7 },
      { transform: 'rotate(' + tilt + 'deg)' },
    ], { duration: 420, delay: dir ? 120 : 0, easing: 'cubic-bezier(.3,1.1,.4,1)', fill: 'backwards' });
  }
  if (dir) SFX.roller();

  $('prDots').innerHTML = prSlides.map((_, i) =>
    '<div class="pr-dot ' + (i === prIndex ? 'on' : '') + '" onclick="prJump(event,' + i + ')" title="Slide ' + (i + 1) + '"></div>').join('');
  $('prCount').textContent = (prIndex + 1) + ' / ' + prSlides.length;
  $('prPrev').disabled = prIndex === 0;
  const next = $('prNext');
  next.disabled = prIndex === prSlides.length - 1;
  next.textContent = prIndex === prSlides.length - 1 ? 'End' : 'Next';
}

function prGo(delta) {
  const i = prIndex + delta;
  if (i < 0 || i >= prSlides.length) return;
  prIndex = i;
  prRender(delta > 0 ? 1 : -1);
}
function prJump(e, i) { e.stopPropagation(); if (i === prIndex) return; const dir = i > prIndex ? 1 : -1; prIndex = i; prRender(dir); }
function prAdvanceFromClick(e) {
  if (e.target.closest('.pr-tip, .stamp')) return;
  const mid = window.innerWidth / 2;
  prGo(e.clientX < mid * 0.4 ? -1 : 1);
}
function prToggleTip() {
  prTipShown = !prTipShown;
  const t = $('prTip');
  if (t) t.hidden = !prTipShown;
  const b = $('prTipBtn');
  if (b) b.setAttribute('aria-pressed', String(prTipShown));
}

function closePresent() {
  presentOn = false;
  prTimerStop();
  $('present').classList.remove('show');
  $('present').innerHTML = '';
  document.body.style.overflow = drawerOpen ? 'hidden' : '';
  const dw = $('drawer');
  if (drawerOpen && dw) dw.focus();
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}
function prFullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen().catch(() => {}); }
  else if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); }
}

// ---------------- Brass dial timer ----------------
let tEnd = null, tInt = null, tLeft = 0, tTotal = 0, tPaused = false;

function prTimerPaint() {
  const c = $('prClock');
  if (!c) return;
  const left = Math.max(tLeft, 0), m = Math.floor(left / 60), sec = left % 60;
  c.querySelector('span').textContent = m + ':' + String(sec).padStart(2, '0');
  c.style.setProperty('--frac', tTotal ? (left / tTotal).toFixed(4) : 0);
  c.setAttribute('aria-label', m + ' minutes ' + sec + ' seconds left' + (tPaused ? ', paused' : ''));
  c.classList.toggle('paused', tPaused);
  c.classList.toggle('done', tLeft <= 0);
}
function prTimer(mins) {
  prTimerStop();
  tTotal = tLeft = mins * 60;
  tPaused = false;
  tEnd = Date.now() + tLeft * 1000;
  $('prClock').hidden = false;
  $('prClear').hidden = false;
  prTimerPaint();
  SFX.tick();
  tInt = setInterval(() => {
    if (tPaused) return;
    tLeft = Math.round((tEnd - Date.now()) / 1000);
    prTimerPaint();
    if (tLeft <= 0) { clearInterval(tInt); tInt = null; timeUp(); }
  }, 250);
}
function timeUp() {
  const stage = $('prStage');
  if (!stage) return;
  const old = stage.querySelector('.stamp'); if (old) old.remove();
  const st = document.createElement('div');
  st.className = 'stamp slam';
  st.setAttribute('role', 'status');
  st.innerHTML = 'TIME!<small>Pens down, please.</small>';
  stage.appendChild(st);
  SFX.timeUp();
  if (reduced) return;
  const v = document.createElement('div');
  v.className = 'vignette';
  document.body.appendChild(v);
  setTimeout(() => v.remove(), 1000);
  setTimeout(() => {
    shake($('prShaker'), 14, 500);
    const p = centerOf(st);
    emit(36, p.x, p.y, { kind: 'splat', colors: ['#E04A2C', '#B8331A', '#F06A4A'], speed: 7, g: .22, size: 4, decay: .022 });
    emit(10, p.x, p.y + p.r.height / 2, { kind: 'puff', colors: ['#E04A2C'], speed: 1.6, g: -.02, size: 8, decay: .03, spread: Math.PI, angle: 0 });
  }, 220);
}
function prTimerToggle() {
  if (!tInt) return;
  tPaused = !tPaused;
  if (!tPaused) tEnd = Date.now() + tLeft * 1000;
  prTimerPaint();
}
function prTimerStop() {
  if (tInt) { clearInterval(tInt); tInt = null; }
  tEnd = null; tLeft = 0; tTotal = 0; tPaused = false;
  const c = $('prClock'), x = $('prClear');
  if (c) { c.hidden = true; c.classList.remove('done', 'paused'); }
  if (x) x.hidden = true;
  const st = document.querySelector('#prStage .stamp'); if (st) st.remove();
}

// ---------------- Folder close + routing ----------------
function closeDrawer(fromRoute) {
  if (presentOn) closePresent();
  drawerOpen = false;
  currentSlug = null;
  $('scrim').classList.remove('show');
  $('drawer').classList.remove('show');
  document.body.style.overflow = '';
  restoreFocus();
  if (!fromRoute && location.hash) {
    // Overwrites the '#slug' entry rather than stacking a new one, so Back never
    // lands back on the activity the teacher just closed.
    history.replaceState(null, '', location.pathname + location.search);
  }
}

function route() {
  const raw = decodeURIComponent(location.hash.slice(1));
  if (!raw) { closeDrawer(true); return; }
  const [slPart, code] = raw.split('=');
  const d = DATA.find(x => slug(x.title) === slPart);
  if (!d) { closeDrawer(true); return; }
  const level = CODE2LEVEL[code] || 'beg';
  if (drawerOpen && currentSlug === slPart) setLevel(d, level);
  else openDrawer(d, level);
}

$('grid').addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  lastFocus = a;
  if (location.hash === a.getAttribute('href')) { e.preventDefault(); route(); }
});

// ---------------- Theme + sound toggles ----------------
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  store('theme', next);
  store('arschul:theme', next);
  syncThemeIcon();
}
function syncThemeIcon() {
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  const b = $('themeToggle');
  b.innerHTML = light ? ICON.sun : ICON.moon;
  b.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
}
function toggleMute() {
  muted = !muted;
  store('ideadeck-muted', muted ? '1' : '0');
  if (!muted) { audio(); SFX.tick(); }
  syncMute();
}
function syncMute() {
  [$('muteToggle'), $('prMute')].forEach(b => {
    if (!b) return;
    b.innerHTML = muted ? ICON.mute : ICON.sound;
    b.setAttribute('aria-pressed', String(muted));
    b.setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
  });
}

window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    if (presentOn) return trapTab(e, $('present'));
    if (drawerOpen) return trapTab(e, $('drawer'));
  }
  if (presentOn) {
    if (e.key === 'Escape') { closePresent(); return; }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter') {
      if (e.key === 'Enter' && e.target && e.target.tagName === 'BUTTON') return;
      e.preventDefault(); prGo(1); return;
    }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); prGo(-1); return; }
    if (e.key === 'Home') { e.preventDefault(); if (prIndex) { prIndex = 0; prRender(-1); } return; }
    if (e.key === 'End') { e.preventDefault(); if (prIndex < prSlides.length - 1) { prIndex = prSlides.length - 1; prRender(1); } return; }
    if (e.key === 't' || e.key === 'T') { prToggleTip(); return; }
    if (e.key === 'f' || e.key === 'F') { prFullscreen(); return; }
    if (e.key === 'm' || e.key === 'M') { toggleMute(); return; }
    return;
  }
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'Escape' && drawerOpen) closeDrawer();
  if ((e.key === 'r' || e.key === 'R') && !drawerOpen) dealRandom();
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === '/' && !drawerOpen) { e.preventDefault(); $('search').focus(); }
});

fxInit();
buildFilters();
buildRefine();
buildCards();
renderCards();
syncThemeIcon();
syncMute();
route(); // honor deep links on load
</script>
</body>
</html>
