<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IdeaDeck</title>
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: #2e2e3e;
    --text: #e8e8f0;
    --muted: #7878a0;
    --accent: #f0c040;
    --accent2: #60c4a0;
    --accent3: #c078f0;
    --danger: #f07060;
    --radius: 12px;
    --header-bg-start: #16161f;
  }

  [data-theme="light"] {
    --bg: #f4f4f0;
    --surface: #ffffff;
    --surface2: #ededea;
    --border: #d8d8d0;
    --text: #1a1a22;
    --muted: #7878a0;
    --accent: #c49a00;
    --accent2: #2a9a78;
    --accent3: #8040c8;
    --danger: #d04030;
    --header-bg-start: #e8e8e2;
  }

  [data-theme="light"] header {
    background: linear-gradient(180deg, var(--header-bg-start) 0%, var(--bg) 100%);
  }

  [data-theme="light"] .card:hover {
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }

  [data-theme="light"] .step-content strong { color: var(--text); }
  [data-theme="light"] .title-block h1 { color: var(--text); }
  [data-theme="light"] .detail-title { color: var(--text); }

  /* THEME TOGGLE */
  .theme-toggle {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
    height: 36px;
    width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--accent); transform: rotate(20deg); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 48px 40px 32px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #16161f 0%, var(--bg) 100%);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 32px;
    flex-wrap: wrap;
  }

  .title-block h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 900;
    letter-spacing: -0.5px;
    line-height: 1;
    color: #fff;
  }

  .title-block h1 span {
    color: var(--accent);
  }

  .title-block p {
    margin-top: 6px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-left: auto;
    align-items: center;
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 9px 14px 9px 36px;
    outline: none;
    width: 220px;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 15px;
    pointer-events: none;
  }

  .cat-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .cat-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.5px;
    padding: 6px 12px;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cat-btn.active { background: var(--accent); border-color: var(--accent); color: #111; }

  /* COUNT BAR */
  .count-bar {
    max-width: 1200px;
    margin: 20px auto 0;
    padding: 0 40px;
    color: var(--muted);
    font-size: 13px;
  }

  /* GRID */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 40px 60px;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 20px;
    position: relative;
    transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--card-accent, var(--accent));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s;
  }

  .card:hover {
    border-color: var(--card-accent, var(--accent));
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transform: translateY(-3px);
  }

  .card:hover::before { transform: scaleX(1); }

  .card-icon {
    font-size: 28px;
    line-height: 1;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }

  .card-subtitle {
    color: var(--muted);
    font-size: 12px;
    font-weight: 300;
    line-height: 1.4;
  }

  .card-footer {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .tag {
    border-radius: 4px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.4px;
    padding: 3px 7px;
    text-transform: uppercase;
  }

  .tag-cat {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .tag-beg { background: rgba(96,196,160,0.15); color: var(--accent2); border: 1px solid rgba(96,196,160,0.3); }
  .tag-int { background: rgba(240,192,64,0.15); color: var(--accent); border: 1px solid rgba(240,192,64,0.3); }
  .tag-adv { background: rgba(192,120,240,0.15); color: var(--accent3); border: 1px solid rgba(192,120,240,0.3); }

  [data-theme="light"] .detail-title { color: var(--text); }
  [data-theme="light"] .card-title { color: var(--text); }

  /* CARD CTA */
  .card-open {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: var(--card-accent, var(--accent));
    opacity: 0.75;
    transition: opacity 0.18s, gap 0.18s;
  }
  .card:hover .card-open { opacity: 1; gap: 10px; }
  .card-open .arr { transition: transform 0.18s; }
  .card:hover .card-open .arr { transform: translateX(3px); }

  .card-footer .tag { cursor: pointer; transition: filter 0.15s, transform 0.12s; }
  .card-footer .tag:hover { filter: brightness(1.35); transform: translateY(-1px); }
  .card-footer .tag-cat { cursor: default; }
  .card-footer .tag-cat:hover { filter: none; transform: none; }


  /* DICE + DRAWER ACTION BUTTONS */
  .dice-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text);
    cursor: pointer;
    font-size: 17px;
    height: 36px;
    width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .dice-btn:hover { border-color: var(--accent3); transform: rotate(-18deg) scale(1.06); }
  .dice-btn:active { transform: rotate(-40deg) scale(0.94); }

  .dw-actions {
    position: absolute;
    top: 18px;
    right: 62px;
    display: flex;
    gap: 8px;
  }
  .dw-act {
    height: 34px;
    padding: 0 12px;
    border-radius: 999px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .dw-act:hover { border-color: var(--accent); color: var(--text); }
  @media (max-width: 600px) { .dw-act span { display: none; } .dw-actions { right: 56px; } }

  /* SCRIM + DRAWER */
  .scrim {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    z-index: 900;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: min(760px, 94vw);
    background: var(--surface);
    border-left: 1px solid var(--border);
    box-shadow: -24px 0 70px rgba(0,0,0,0.5);
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
    z-index: 1000;
    display: flex;
    flex-direction: column;
  }
  .drawer.show { transform: translateX(0); }

  /* Drawer header (fixed) */
  .dw-head {
    position: relative;
    padding: 26px 32px 22px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .dw-close {
    position: absolute;
    top: 18px;
    right: 20px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .dw-close:hover { border-color: var(--danger); color: var(--danger); transform: rotate(90deg); }

  .dw-hero { display: flex; align-items: flex-start; gap: 18px; padding-right: 44px; }
  .dw-icon { font-size: 44px; line-height: 1; flex-shrink: 0; }
  .dw-eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .dw-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(24px, 3vw, 34px);
    font-weight: 900;
    color: var(--text);
    line-height: 1.05;
    margin-bottom: 8px;
  }
  .dw-tagline { color: var(--muted); font-size: 14px; font-weight: 300; line-height: 1.5; }

  /* Segmented level switcher (primary CTA) */
  .seg {
    display: flex;
    gap: 10px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .seg-btn {
    flex: 1;
    padding: 12px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    text-align: center;
    line-height: 1.2;
    transition: all 0.18s;
  }
  .seg-btn:hover { color: var(--text); }
  .seg-name { display: block; font-size: 14px; font-weight: 500; }
  .seg-cefr { display: block; font-size: 11px; margin-top: 3px; opacity: 0.85; }

  .seg-btn.beg.active  { background: rgba(96,196,160,0.16); border-color: var(--accent2); color: var(--accent2); }
  .seg-btn.int.active  { background: rgba(240,192,64,0.16); border-color: var(--accent);  color: var(--accent);  }
  .seg-btn.adv.active  { background: rgba(192,120,240,0.16); border-color: var(--accent3); color: var(--accent3); }
  .seg-btn.active .seg-name { font-weight: 700; }

  /* Level body (scrolls, fills drawer) */
  .lvl-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 32px 44px;
  }
  .lvl-body.beg { --lvl: var(--accent2); }
  .lvl-body.int { --lvl: var(--accent); }
  .lvl-body.adv { --lvl: var(--accent3); }

  .step {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .step:last-of-type { border-bottom: none; }

  .step-num {
    border-radius: 50%;
    background: var(--lvl);
    color: #111;
    font-size: 14px;
    font-weight: 700;
    height: 30px;
    min-width: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    flex-shrink: 0;
  }
  .step h4 {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 5px;
  }
  .step p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    font-weight: 300;
  }

  .lvl-tip {
    margin-top: 22px;
    padding: 16px 18px;
    border-radius: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--lvl);
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.65;
  }
  .lvl-tip::before { content: '💡 Teacher tip'; display: block; font-weight: 700; font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--lvl); margin-bottom: 6px; }

  @media (max-width: 600px) {
    .drawer { width: 100vw; }
    .dw-head { padding: 20px 20px 18px; }
    .seg { padding: 14px 20px; gap: 6px; }
    .seg-btn { padding: 10px 4px; }
    .lvl-body { padding: 4px 20px 40px; }
  }


  /* ================= PRINT: one-page group handout ================= */
  @media print {
    @page { size: A4 portrait; margin: 14mm 15mm; }

    html, body {
      background: #fff !important;
      color: #000 !important;
      font-family: 'DM Sans', Arial, sans-serif;
      font-size: 11pt;
    }

    header, .count-bar, #view-grid, .scrim, .back-link,
    .dw-close, .theme-toggle, .dice-btn, .seg-btn:not(.active),
    .print-btn, .present-btn, .refine-bar, .fav, .card-meta { display: none !important; }

    .drawer {
      position: static !important;
      transform: none !important;
      width: 100% !important;
      height: auto !important;
      max-height: none !important;
      overflow: visible !important;
      border: none !important;
      box-shadow: none !important;
      background: #fff !important;
      display: block !important;
    }

    .dw-head { padding: 0 0 10pt !important; border-bottom: 1.5pt solid #000 !important; }
    .dw-icon { font-size: 24pt !important; }
    .dw-eyebrow { color: #444 !important; font-size: 8pt !important; }
    .dw-title { font-size: 22pt !important; color: #000 !important; }
    .dw-tagline { color: #333 !important; font-size: 10.5pt !important; }
    .dw-meta { color: #333 !important; font-size: 9pt !important; margin-top: 6pt !important; }
    .dw-meta .sk { border-color: #666 !important; }

    .seg { padding: 8pt 0 !important; border-bottom: none !important; display: block !important; }
    .seg-btn.active {
      background: none !important;
      border: none !important;
      color: #000 !important;
      padding: 0 !important;
      font-weight: 700 !important;
      text-align: left !important;
    }
    .seg-btn.active .seg-name { display: inline !important; font-size: 11pt !important; }
    .seg-btn.active .seg-cefr {
      display: inline !important;
      margin: 0 0 0 8pt !important;
      border: 1pt solid #000; border-radius: 3pt; padding: 1pt 5pt; font-size: 9pt !important;
    }

    .lvl-body { padding: 0 !important; overflow: visible !important; }

    .step {
      page-break-inside: avoid;
      break-inside: avoid;
      padding: 7pt 0 !important;
      border-bottom: 0.5pt solid #bbb !important;
      gap: 10pt !important;
    }
    .step-num {
      background: #fff !important;
      color: #000 !important;
      border: 1.2pt solid #000;
      height: 20pt !important; min-width: 20pt !important;
      font-size: 10pt !important;
    }
    .step h4 { font-size: 11.5pt !important; color: #000 !important; font-weight: 700 !important; }
    .step p  { font-size: 10.5pt !important; color: #222 !important; line-height: 1.45 !important; }

    .lvl-tip {
      page-break-inside: avoid;
      break-inside: avoid;
      margin-top: 12pt !important;
      background: #fff !important;
      border: 1pt solid #000 !important;
      border-left: 3pt solid #000 !important;
      border-radius: 0 !important;
      color: #000 !important;
      font-size: 10pt !important;
    }
    .lvl-tip::before { color: #000 !important; }
  }


  /* ================= PRESENT MODE (projection) ================= */
  .present {
    position: fixed;
    inset: 0;
    z-index: 3000;
    background: var(--bg);
    display: none;
    flex-direction: column;
    padding: clamp(20px, 3vh, 44px) clamp(24px, 5vw, 90px);
  }
  .present.show { display: flex; }

  .pr-top {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    padding-bottom: clamp(10px, 2vh, 22px);
    border-bottom: 1px solid var(--border);
  }
  .pr-icon { font-size: clamp(22px, 2.6vw, 34px); line-height: 1; }
  .pr-name {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(16px, 2vw, 26px);
    color: var(--text);
  }
  .pr-badge {
    margin-left: auto;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: clamp(11px, 1.1vw, 15px);
    font-weight: 700;
    letter-spacing: 0.6px;
    background: color-mix(in srgb, var(--lvl) 18%, transparent);
    color: var(--lvl);
    border: 1px solid color-mix(in srgb, var(--lvl) 40%, transparent);
    white-space: nowrap;
  }
  .pr-exit {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 50%;
    width: 38px; height: 38px;
    font-size: 18px; line-height: 1;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .pr-exit:hover { border-color: var(--danger); color: var(--danger); }

  .pr-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(14px, 2.4vh, 30px);
    min-height: 0;
    overflow-y: auto;
  }
  .pr-num {
    font-size: clamp(13px, 1.3vw, 18px);
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--lvl);
  }
  .pr-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(32px, 5vw, 64px);
    line-height: 1.1;
    color: var(--text);
  }
  .pr-desc {
    font-size: clamp(20px, 2.5vw, 30px);
    line-height: 1.5;
    font-weight: 300;
    color: var(--text);
    opacity: 0.88;
    max-width: 46ch;
  }
  .pr-tagline { font-size: clamp(18px, 2.2vw, 28px); color: var(--muted); font-weight: 300; line-height: 1.5; max-width: 40ch; }

  .pr-tip {
    margin-top: clamp(10px, 2vh, 20px);
    padding: 16px 20px;
    border-radius: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--lvl);
    font-size: clamp(15px, 1.5vw, 20px);
    line-height: 1.55;
    max-width: 60ch;
  }
  .pr-tip::before { content: '💡 Teacher tip'; display: block; font-weight: 700; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--lvl); margin-bottom: 6px; }
  .pr-tip[hidden] { display: none; }

  .pr-foot {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: clamp(10px, 2vh, 20px);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .pr-dots { display: flex; gap: 7px; }
  .pr-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--border);
    cursor: pointer;
    transition: all 0.18s;
  }
  .pr-dot.on { background: var(--lvl); transform: scale(1.35); }
  .pr-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .pr-nav { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .pr-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 9px 18px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

// Build category lookup
const itemToCategory = {};
const itemToColor = {};
Object.entries(CATEGORIES).forEach(([cat, { items, color }]) => {
  items.forEach(item => {
    itemToCategory[item] = cat;
    itemToColor[item] = color;
  });
});

const GROUP_LABEL = { pairs: 'Pairs', groups: 'Small groups', class: 'Whole class' };
const PREP_LABEL  = { none: 'No prep', board: 'Board', print: 'Printout' };
const PREP_ICON   = { none: '✅', board: '🖊️', print: '📄' };

function metaChips(d) {
  const m = d.meta;
  if (!m) return '';
  return '<div class="card-meta">' +
    '<span title="Typical running time">⏱ ' + m.mins + ' min</span>' +
    '<span title="Grouping">👥 ' + GROUP_LABEL[m.group] + '</span>' +
    '<span title="Preparation">' + PREP_ICON[m.prep] + ' ' + PREP_LABEL[m.prep] + '</span>' +
  '</div>';
}

function normText(t) {
  return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// Flat searchable blob per activity so teachers can find "conditionals", "debate",
// "comparatives" etc. even when the word only appears inside a step or a teacher tip.
const SEARCH_INDEX = {};
const CAT_COUNT = {};
DATA.forEach(d => {
  const cat = itemToCategory[d.title] || 'Other';
  CAT_COUNT[cat] = (CAT_COUNT[cat] || 0) + 1;
  const parts = [d.title, d.tagline, cat];
  if (d.meta) parts.push(d.meta.mins + ' min', GROUP_LABEL[d.meta.group], PREP_LABEL[d.meta.prep], d.meta.skills.join(' '));
  ['beg', 'int', 'adv'].forEach(L => {
    ((d[L] && d[L].steps) || []).forEach(st => { parts.push(st.title, st.desc); });
    if (d[L] && d[L].tip) parts.push(d[L].tip);
  });
  SEARCH_INDEX[d.title] = normText(parts.join(' '));
});

const FAV_KEY = 'ideadeck-favs';
let favs = (function () {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }
  catch (e) { return new Set(); }
})();
function saveFavs() { try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch (e) {} }

function toggleFav(e, sl) {
  e.preventDefault();
  e.stopPropagation();
  if (favs.has(sl)) favs.delete(sl); else favs.add(sl);
  saveFavs();
  renderCards();
  const btn = document.querySelector('.fav[data-sl="' + sl + '"]');
  if (btn) btn.focus();
}

// Quick refinements a teacher actually needs mid-lesson
const REFINE = {
  fav:   { label: '★ Favourites', test: d => favs.has(slug(d.title)) },
  quick: { label: '⏱ 30 min or less', test: d => d.meta && d.meta.mins <= 30 },
  pairs: { label: '👥 Pairs', test: d => d.meta && d.meta.group === 'pairs' },
  noprep:{ label: '✅ No prep', test: d => d.meta && d.meta.prep === 'none' },
};
const activeRefine = new Set();

function buildRefine() {
  const wrap = document.getElementById('refineBar');
  wrap.innerHTML = Object.entries(REFINE).map(([k, r]) =>
    '<button class="ref-btn" data-k="' + k + '" onclick="toggleRefine(\'' + k + '\')" aria-pressed="false">' + r.label + '</button>'
  ).join('');
}

function toggleRefine(k) {
  if (activeRefine.has(k)) activeRefine.delete(k); else activeRefine.add(k);
  document.querySelectorAll('.ref-btn').forEach(b => {
    const on = activeRefine.has(b.dataset.k);
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  });
  renderCards();
}

let activeFilter = 'All';
let currentSlug = null;
let currentLevel = (function () {
  try { const v = localStorage.getItem('ideadeck-level'); return ['beg','int','adv'].includes(v) ? v : 'beg'; }
  catch (e) { return 'beg'; }
})();
let drawerOpen = false;
let lastFocus = null;     // element to hand focus back to when a dialog closes

const FOCUSABLE = 'a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])';

function trapTab(e, root) {
  const items = Array.from(root.querySelectorAll(FOCUSABLE));
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

function restoreFocus() {
  if (lastFocus && lastFocus.isConnected) { try { lastFocus.focus(); } catch (e) {} }
  lastFocus = null;
}

function getCat(title) { return itemToCategory[title] || 'Other'; }
function getColor(title) { return itemToColor[title] || '#a0a0c0'; }

function buildFilters() {
  const wrap = document.getElementById('catFilters');
  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn active';
  allBtn.innerHTML = 'All <b class="cnt">' + DATA.length + '</b>';
  allBtn.onclick = () => setFilter('All', allBtn);
  wrap.appendChild(allBtn);

  Object.entries(CATEGORIES).forEach(([cat, { icon }]) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.innerHTML = icon + ' ' + cat + ' <b class="cnt">' + (CAT_COUNT[cat] || 0) + '</b>';
    btn.onclick = () => setFilter(cat, btn);
    wrap.appendChild(btn);
  });
}

function setFilter(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function filterCards() {
  renderCards();
}

function getFiltered() {
  const query = normText(document.getElementById('search').value.trim());
  return DATA.filter(d => {
    const matchCat = activeFilter === 'All' || getCat(d.title) === activeFilter;
    const matchQuery = !query || (SEARCH_INDEX[d.title] || '').includes(query);
    const matchRefine = [...activeRefine].every(k => REFINE[k].test(d));
    return matchCat && matchQuery && matchRefine;
  });
}

function renderCards() {
  const grid = document.getElementById('grid');
  const bar = document.getElementById('countBar');
  grid.innerHTML = '';

  const filtered = getFiltered();

  bar.textContent = filtered.length + ' activit' + (filtered.length === 1 ? 'y' : 'ies');

  if (filtered.length === 0) {
    const el = document.createElement('div');
    el.className = 'no-results';
    el.textContent = 'No activities match your search.';
    grid.appendChild(el);
    return;
  }

  filtered.forEach((d, i) => {
    const cat = getCat(d.title);
    const color = getColor(d.title);
    const card = document.createElement('article');
    card.className = 'card';
    card.style.setProperty('--card-accent', color);
    card.style.animationDelay = (i * 30) + 'ms';
    const sl = slug(d.title);
    card.innerHTML = `
      <button class="fav ${favs.has(sl) ? 'on' : ''}" data-sl="${sl}" onclick="toggleFav(event,'${sl}')"
              aria-label="${favs.has(sl) ? 'Remove' : 'Add'} ${d.title} ${favs.has(sl) ? 'from' : 'to'} favourites"
              aria-pressed="${favs.has(sl)}" title="Favourite">${favs.has(sl) ? '★' : '☆'}</button>
      <div class="card-icon" aria-hidden="true">${d.icon}</div>
      <h3 class="card-title"><a class="card-link" href="#${sl}">${d.title}</a></h3>
      <p class="card-subtitle">${d.tagline}</p>
      ${metaChips(d)}
      <div class="card-footer">
        <span class="tag tag-cat">${cat}</span>
        <a class="tag tag-beg" href="#${sl}" title="Open ${d.title} at A1–A2">A1–A2</a>
        <a class="tag tag-int" href="#${sl}=b1" title="Open ${d.title} at B1">B1</a>
        <a class="tag tag-adv" href="#${sl}=b2" title="Open ${d.title} at B2">B2</a>
      </div>
      <div class="card-open" aria-hidden="true"><span>Open activity</span><span class="arr">→</span></div>
    `;
    grid.appendChild(card);
  });
}

// ---- Randomizer: deals from the current filter, no repeats until the pool empties ----
const drawn = new Set();

function dealRandom() {
  const pool = getFiltered();
  if (!pool.length) return;
  let candidates = pool.filter(d => !drawn.has(slug(d.title)));
  if (!candidates.length) { drawn.clear(); candidates = pool; }
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  drawn.add(slug(pick.title));
  const btn = document.getElementById('diceBtn');
  if (btn && btn.animate) btn.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }], { duration: 380, easing: 'ease-out' });
  go(null, slug(pick.title), LEVEL2CODE[currentLevel]);
}

// Render segmented switcher + the selected level's steps (fills the drawer)
function setLevel(d, level) {
  currentLevel = level;

// Switch level inside an open drawer: update URL (shareable) without a new history entry
function selectLevel(sl, level) {
  const code = LEVEL2CODE[level];
  history.replaceState(null, '', location.pathname + location.search + '#' + sl + (code ? '=' + code : ''));
  const d = DATA.find(x => slug(x.title) === sl);
  if (d) setLevel(d, level);
}


// ================= PRESENT MODE =================
// Teacher-driven only: never auto-advances. Arrows / Space / click to move.
let presentOn = false;
let prIndex = 0;
let prSlides = [];
let prTipShown = false;

const LVLVAR = { beg: '--accent2', int: '--accent', adv: '--accent3' };

function openPresent() {
  const d = DATA.find(x => slug(x.title) === currentSlug);
  if (!d) return;
  const ld = d[currentLevel];
  const L = LEVELS.find(x => x.key === currentLevel);

  // Slide 0 is the title card, then one slide per step.
  prSlides = [{ kind: 'title', title: d.title, desc: d.tagline, icon: d.icon }]
    .concat(ld.steps.map((st, i) => ({ kind: 'step', n: i + 1, of: ld.steps.length, title: st.title, desc: st.desc })));
  prIndex = 0;
  prTipShown = false;

  const el = document.getElementById('present');
  el.style.setProperty('--lvl', 'var(' + LVLVAR[currentLevel] + ')');
  el.innerHTML =
    '<div class="pr-top">' +
      '<div class="pr-icon">' + d.icon + '</div>' +
      '<div class="pr-name">' + d.title + '</div>' +
      '<div class="pr-badge">' + L.cefr + '</div>' +
      '<button class="pr-exit" onclick="closePresent()" aria-label="Exit present mode">✕</button>' +
    '</div>' +
    '<div class="pr-stage" id="prStage" onclick="prAdvanceFromClick(event)"></div>' +
    '<div class="pr-foot">' +
      '<div class="pr-dots" id="prDots"></div>' +
      '<div class="pr-count" id="prCount"></div>' +
      '<div class="pr-timer">' +
        '<button class="pr-tset" onclick="prTimer(1)" title="1 minute">1′</button>' +
        '<button class="pr-tset" onclick="prTimer(3)" title="3 minutes">3′</button>' +
        '<button class="pr-tset" onclick="prTimer(5)" title="5 minutes">5′</button>' +
        '<button class="pr-tset" onclick="prTimer(10)" title="10 minutes">10′</button>' +
        '<div class="pr-clock" id="prClock" hidden onclick="prTimerToggle()" title="Click to pause / resume"></div>' +
        '<button class="pr-tset pr-tclear" id="prClear" hidden onclick="prTimerStop()" title="Clear timer">✕</button>' +
      '</div>' +
      '<div class="pr-nav">' +
        '<button class="pr-btn ghost" onclick="prToggleTip()" title="Show / hide the teacher tip (T)">💡 Tip</button>' +
        '<button class="pr-btn" id="prPrev" onclick="prGo(-1)">←</button>' +
        '<button class="pr-btn" id="prNext" onclick="prGo(1)">Next →</button>' +
      '</div>' +
    '</div>' +
    '<div class="pr-hint">← → or Space to move · T for tip · F fullscreen · Esc to exit</div>';

  el.classList.add('show');
  presentOn = true;
  document.body.style.overflow = 'hidden';
  prRender();
  if (!lastFocus) lastFocus = document.activeElement;
  el.focus();
}

function prRender() {
  const sl = prSlides[prIndex];
  const d = DATA.find(x => slug(x.title) === currentSlug);
  const tip = d && d[currentLevel] ? d[currentLevel].tip : '';
  const stage = document.getElementById('prStage');
  if (!stage) return;

  stage.innerHTML = sl.kind === 'title'
    ? '<div class="pr-title">' + sl.title + '</div>' +
      '<div class="pr-tagline">' + sl.desc + '</div>' +
      '<div class="pr-tip" id="prTip"' + (prTipShown ? '' : ' hidden') + '>' + tip + '</div>'
    : '<div class="pr-num">Step ' + sl.n + ' of ' + sl.of + '</div>' +
      '<div class="pr-title">' + sl.title + '</div>' +
      '<div class="pr-desc">' + sl.desc + '</div>' +
      '<div class="pr-tip" id="prTip"' + (prTipShown ? '' : ' hidden') + '>' + tip + '</div>';

  document.getElementById('prDots').innerHTML = prSlides
    .map((_, i) => '<div class="pr-dot ' + (i === prIndex ? 'on' : '') + '" onclick="prJump(event,' + i + ')"></div>').join('');
  document.getElementById('prCount').textContent = (prIndex + 1) + ' / ' + prSlides.length;
  document.getElementById('prPrev').disabled = prIndex === 0;
  const next = document.getElementById('prNext');
  next.disabled = prIndex === prSlides.length - 1;
  next.textContent = prIndex === prSlides.length - 1 ? 'End' : 'Next →';
  stage.scrollTop = 0;
}

function prGo(delta) {
  const i = prIndex + delta;
  if (i < 0 || i >= prSlides.length) return;
  prIndex = i;
  prRender();
}

function prJump(e, i) { e.stopPropagation(); prIndex = i; prRender(); }

function prAdvanceFromClick(e) {
  if (e.target.closest('.pr-tip')) return;
  const mid = window.innerWidth / 2;
  prGo(e.clientX < mid * 0.4 ? -1 : 1);
}

function prToggleTip() {
  prTipShown = !prTipShown;
  const t = document.getElementById('prTip');
  if (t) t.hidden = !prTipShown;
}

function closePresent() {
  presentOn = false;
  prTimerStop();
  document.getElementById('present').classList.remove('show');
  document.body.style.overflow = drawerOpen ? 'hidden' : '';
  const dw = document.getElementById('drawer');
  if (drawerOpen && dw) dw.focus();
  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
}

function prFullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement) { document.exitFullscreen && document.exitFullscreen().catch(() => {}); }
  else if (el.requestFullscreen) { el.requestFullscreen().catch(() => {}); }
}

// ---- Classroom timer (Web Audio, no external files) ----
let tEnd = null, tInt = null, tLeft = 0, tPaused = false;

function prBeep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    [0, 0.35, 0.7].forEach(off => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type = 'sine';
      o.frequency.value = 880;
      const t0 = ac.currentTime + off;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
      o.start(t0); o.stop(t0 + 0.3);
    });
  } catch (e) {}
}

function prTimerPaint() {
  const c = document.getElementById('prClock');
  if (!c) return;
  const m = Math.floor(Math.max(tLeft, 0) / 60), sec = Math.max(tLeft, 0) % 60;
  c.textContent = m + ':' + String(sec).padStart(2, '0');
  c.classList.toggle('paused', tPaused);
  c.classList.toggle('done', tLeft <= 0);
}

function prTimer(mins) {
  prTimerStop();
  tLeft = mins * 60;
  tPaused = false;
  tEnd = Date.now() + tLeft * 1000;
  document.getElementById('prClock').hidden = false;
  document.getElementById('prClear').hidden = false;
  prTimerPaint();
  tInt = setInterval(() => {
    if (tPaused) return;
    tLeft = Math.round((tEnd - Date.now()) / 1000);
    prTimerPaint();
    if (tLeft <= 0) { clearInterval(tInt); tInt = null; prBeep(); }
  }, 250);
}

function prTimerToggle() {
  if (!tInt) return;
  tPaused = !tPaused;
  if (!tPaused) tEnd = Date.now() + tLeft * 1000;
  prTimerPaint();
}

function prTimerStop() {
  if (tInt) { clearInterval(tInt); tInt = null; }
  tEnd = null; tLeft = 0; tPaused = false;
  const c = document.getElementById('prClock'), x = document.getElementById('prClear');
  if (c) { c.hidden = true; c.classList.remove('done', 'paused'); }
  if (x) x.hidden = true;
}

function closeDrawer(fromRoute) {
  if (presentOn) closePresent();
  drawerOpen = false;
  currentSlug = null;
  document.getElementById('scrim').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  document.body.style.overflow = '';
  restoreFocus();
  if (!fromRoute && location.hash) {
    // Overwrites the '#slug' entry rather than stacking a new one, so Back never
    // lands back on the activity the teacher just closed.
    history.replaceState(null, '', location.pathname + location.search);
  }
}

// Single source of truth: the URL hash drives the drawer (Back / refresh / share all work)
function route() {
  const raw = decodeURIComponent(location.hash.slice(1));
  if (!raw) { closeDrawer(true); return; }
  const [slPart, code] = raw.split('=');
  const d = DATA.find(x => slug(x.title) === slPart);
  if (!d) { closeDrawer(true); return; }
  const level = CODE2LEVEL[code] || 'beg';
  if (drawerOpen && currentSlug === slPart) setLevel(d, level);
  else openDrawer(d, level);
}

document.getElementById('grid').addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  lastFocus = a;
  // Re-open when the target hash is already current (nothing else would fire).
  if (location.hash === a.getAttribute('href')) { e.preventDefault(); route(); }
});

window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    if (presentOn) return trapTab(e, document.getElementById('present'));
    if (drawerOpen) return trapTab(e, document.getElementById('drawer'));
  }
  if (presentOn) {
    if (e.key === 'Escape') { closePresent(); return; }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'Enter') { e.preventDefault(); prGo(1); return; }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace') { e.preventDefault(); prGo(-1); return; }
    if (e.key === 'Home') { e.preventDefault(); prIndex = 0; prRender(); return; }
    if (e.key === 'End') { e.preventDefault(); prIndex = prSlides.length - 1; prRender(); return; }
    if (e.key === 't' || e.key === 'T') { prToggleTip(); return; }
    if (e.key === 'f' || e.key === 'F') { prFullscreen(); return; }
    return;
  }
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'Escape' && drawerOpen) closeDrawer();
  if ((e.key === 'r' || e.key === 'R') && !drawerOpen) dealRandom();
  if (e.key === '/' && !drawerOpen) { e.preventDefault(); document.getElementById('search').focus(); }
});

buildFilters();
buildRefine();
renderCards();
route(); // honor deep links on load

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch (e) {}
  syncThemeIcon();
}

function syncThemeIcon() {
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  document.getElementById('themeToggle').textContent = light ? '☀️' : '🌙';
  document.getElementById('themeToggle').setAttribute('aria-label',
    light ? 'Switch to dark mode' : 'Switch to light mode');
}
syncThemeIcon();
</script>
