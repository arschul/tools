// Gather every dated entry for a class: any date that has a session record,
// lesson note, homework, or promise. Returns rows newest-first with an
// attendance summary computed from completed sessions only.
/* The log's row set is the UNION of dates that have a session, lesson note,
   homework or class plan — so a date prepared in advance (homework/plan set
   from the previous class's "next class" section, or a focus point sent
   forward) appears before any roll call exists for it. Those rows are real,
   not missing data; hasSession distinguishes them so the UI can say so.
   onlyTaken filters them out for a pure attendance history. */
function classLogRows(classId, fromVal, toVal, onlyTaken){
  const dates = new Set();
  for(const key of Object.keys(state.sessions)){
    const [cid, date] = splitSessionKey(key);
    if(cid===classId) dates.add(date);
  }
  for(const store of [state.lessonNotes, state.homework, state.promises]){
    if(!store) continue;
    for(const key of Object.keys(store)){
      const [cid, date] = splitSessionKey(key);
      if(cid===classId) dates.add(date);
    }
  }
  const rows = [...dates]
    .filter(d => (!fromVal || d>=fromVal) && (!toVal || d<=toVal))
    .sort((a,b)=>b.localeCompare(a))
    .map(date=>{
      const completed = isSessionCompleted(classId, date);
      const counts = sessionCounts(classId, date);
      const happened = sessionHappened(classId, date);
      return {
        date,
        content: getLessonNote(classId, date),
        hw: getHomework(classId, date),
        promise: getPromise(classId, date),
        completed,
        present: counts.present, absent: counts.absent, roster: counts.roster,
        // hasSession = this class actually ran that day (so attendance applies),
        // recorded = how many students were explicitly ticked. Untouched
        // students count as present, matching what Roll Call shows.
        hasSession: happened,
        recorded: counts.recorded,
        future: date > todayStr(),
        holiday: isHoliday(date)
      };
    })
    .filter(r => !onlyTaken || r.hasSession);
  return rows;
}

function exportClassLogCsv(){
  const c = classById(clLogClassId);

  const data = [header].concat(

      r.hasSession?r.present:'', r.hasSession?r.absent:'', r.hasSession?r.roster:'',
      r.completed?'yes':'no', r.holiday?'yes':'no'])
  );
  downloadCsv(`class-log-${slugify(c.name)}-${todayStr()}.csv`, data);
}

function cmDurRow(i, e, c){
  const isFirst = i===0;
  const fromVal = (e.from && e.from!=='1900-01-01') ? e.from : (isFirst ? (c?.startDate||'') : '');
  return `<div class="field-row cm-dur-row" style="align-items:center;margin-bottom:6px;">
    ${isFirst
      ? `<div style="flex:1;font-size:12px;color:var(--muted);align-self:center;">From the start</div>`
      : `<div style="flex:1;"><input class="cm-dur-from" type="date" value="${fromVal}" placeholder="From" style="width:100%;"></div>`}
    <input class="cm-dur-min" type="number" min="1" step="5" value="${e.duration||150}" style="width:100px;" title="minutes">
    <span style="font-size:12px;color:var(--muted);">min</span>
    ${isFirst?'<span style="width:34px;"></span>':`<button type="button" class="icon-btn danger" aria-label="Remove this duration period" onclick="this.closest('.cm-dur-row').remove()">×</button>`}
  </div>`;
}
function cmAddDurRow(){
  const rows = document.getElementById('cm-dur-rows');
  const last = rows.querySelector('.cm-dur-row:last-child .cm-dur-min')?.value || 150;
  rows.insertAdjacentHTML('beforeend', cmDurRow(rows.children.length, {from: todayStr(), duration: last}, null));
}
function updateDayLabel(d){
  const cb = document.getElementById('cm-day-'+d);

function selectSwatch(el, color){
  el.parentElement.querySelectorAll('.swatch').forEach(s=>{ s.classList.remove('on'); s.setAttribute('aria-pressed','false'); });
  el.classList.add('on');
  el.setAttribute('aria-pressed','true');
  document.getElementById('cm-color').value = color;
}
function saveClass(classId){
  const name = document.getElementById('cm-name').value.trim();
  if(!name) return;
  const days = [1,2,3,4,5,6,0].filter(d=>document.getElementById('cm-day-'+d)?.checked);
  if(!days.length){ alert('Please select at least one day.'); return; }
  const time = document.getElementById('cm-time').value;
  const level = document.getElementById('cm-level')?.value || '';
  const color = document.getElementById('cm-color').value;
  const startDate = document.getElementById('cm-start').value || null;
  const endDate = document.getElementById('cm-end').value || null;
  const pointsEnabled = !!document.getElementById('cm-points')?.checked;

  // Build duration history
  const rows = [...document.querySelectorAll('.cm-dur-row')];
  let durationHistory = rows.map((r,i)=>({
    from: (i===0 ? (r.querySelector('.cm-dur-from')?.value || '1900-01-01') : r.querySelector('.cm-dur-from')?.value),
    duration: parseInt(r.querySelector('.cm-dur-min').value) || 150
  })).filter(e=>e.from);
  if(!durationHistory.length) durationHistory = [{from:'1900-01-01', duration:150}];
  durationHistory.sort((a,b)=>a.from.localeCompare(b.from));
  // dedupe identical from-dates (last wins)
  const seen = {};
  durationHistory.forEach(e=>{ seen[e.from]=e; });
  durationHistory = Object.values(seen).sort((a,b)=>a.from.localeCompare(b.from));
  const duration = durationHistory[durationHistory.length-1].duration; // compat field = current/latest

  if(classId){
    const c = classById(classId);
    c.name=name; c.days=days; c.time=time; c.level=level; c.color=color; c.startDate=startDate; c.endDate=endDate;
    c.duration=duration; c.durationHistory=durationHistory; c.pointsEnabled=pointsEnabled;
  }else{
    state.classes.push({id:uid(), name, days, time, level, color, startDate, endDate, duration, durationHistory, pointsEnabled});
  }
  scheduleSave('classes', state.classes);
  closeModal();
  refreshView();
}
function deleteClass(classId){
  if(!confirm('Delete this class, its students, and all roll call records for it? This cannot be undone.')) return;
  state.classes = state.classes.filter(c=>c.id!==classId);
  state.students = state.students.filter(s=>s.classId!==classId);
  Object.keys(state.sessions).forEach(k=>{ if(splitSessionKey(k)[0]===classId) delete state.sessions[k]; });
  state.events = state.events.filter(e=>e.classId!==classId);
  if((state.pointsLog||[]).some(e=>e.classId===classId)){
    state.pointsLog = state.pointsLog.filter(e=>e.classId!==classId);
    scheduleSave('pointsLog', state.pointsLog);
  }
  if((state.activities||[]).some(a=>a.classId===classId)){
    state.activities = state.activities.filter(a=>a.classId!==classId);
    scheduleSave('activities', state.activities);
  }
  if(state.grades[classId]){ delete state.grades[classId]; scheduleSave('grades', state.grades); }
  if(state.expandedClassId===classId) state.expandedClassId=null;
  scheduleSave('classes', state.classes);
  scheduleSave('students', state.students);
  scheduleSave('sessions', state.sessions);
  scheduleSave('events', state.events);
  refreshView();
}
function archiveClass(classId){
  const c = classById(classId);
  if(!c) return;
  // Contact Parents must be resolved before archiving (per spec Q1)
  const pending = sortByName(state.students.filter(s=>s.classId===classId && s.contactParents?.reason));
  if(pending.length){
    alert(`Cannot archive: ${pending.length} student(s) still have an unresolved Contact Parents flag (${pending.map(s=>s.name).join(', ')}). Mark those as done first.`);
    return;
  }
  if(!confirm(`Archive "${c.name}"? It will be removed from Roll Call, Calendar and the Dashboard, but all its data and reports are kept. You can unarchive anytime.`)) return;
  c.archived = true;
  c.archivedAt = todayStr();
  // Clear English Club flags for this class's students (per spec Q1)
  state.students.forEach(s=>{ if(s.classId===classId && s.englishClub) s.englishClub=false; });
  if(state.expandedClassId===classId) state.expandedClassId=null;
  scheduleSave('classes', state.classes);
  scheduleSave('students', state.students);
  refreshView();
}
function unarchiveClass(classId){
  const c = classById(classId);
  if(!c) return;
  c.archived = false;
  delete c.archivedAt;
  scheduleSave('classes', state.classes);
  refreshView();
}

/* Attendance alerts are derived from the register, not raised by hand, so
   there is no flag to clear once the call is made. The logged call carries an
   alertKey instead, and any alert whose key is already in the student's call
   history stops being shown. A fresh pair of absences produces a new key, so
   the alert comes back when it should. */
function attendanceAlertKey(kind){
  return [kind].concat(Array.prototype.slice.call(arguments, 1)).join(':');
}
function alertHandled(student, key){
  return ((student && student.contactParentsHistory) || []).some(h => h.alertKey === key);
}

let _pendingCallCtx = null;   // set when logging a call for a derived alert
function openAttendanceCallModal(studentId, alertKey, reason){
  const s = anyStudent(studentId);
  if(!s) return;
  _pendingCallCtx = { alertKey: alertKey, category: 'Attendance', reason: reason };
  showModal(`${sizeModal('md')}
    <h3>☎️ Log Call — ${esc(s.name)}</h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 14px;">${esc(reason)} — write a brief summary of the conversation. It appears on the student's report and clears this alert.</p>
    <div class="field"><label>Call date</label><input id="cp-call-date" type="date" value="${todayStr()}"></div>
    <div class="field"><label>Summary of conversation</label>
      <textarea id="cp-summary" rows="4" autofocus style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-family:inherit;font-size:13px;" placeholder="e.g. Spoke with mother about the absences. She was unaware and committed to improving attendance."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="cancelPendingCall()">Cancel</button>
      <button class="btn-accent" onclick="confirmCallDone('${studentId}')">Save &amp; Mark Done</button>
    </div>
  `);
}
function cancelPendingCall(){ _pendingCallCtx = null; closeModal(); }

function confirmCallDone(studentId){
  const s = anyStudent(studentId);
  if(!s) return;
  const ctx = _pendingCallCtx;
  const flag = s.contactParents;
  if(!ctx && !flag) return;
  const summary = document.getElementById('cp-summary').value.trim();
  const callDate = document.getElementById('cp-call-date').value;
  const isPrivDone = !!privStudent(studentId);
  if(!summary && !isPrivDone){ alert('Please enter a summary of the conversation.'); return; }
  if(!s.contactParentsHistory) s.contactParentsHistory = [];
  const entry = {
    id: uid(),
    date: callDate,
    category: ctx ? ctx.category : flag.category,
    reason: ctx ? ctx.reason : flag.reason,
    summary: summary
  };
  if(ctx && ctx.alertKey) entry.alertKey = ctx.alertKey;
  s.contactParentsHistory.unshift(entry);
  _pendingCallCtx = null;
  // A hand-raised flag is cleared; a derived alert has none to clear.
  if(flag) s.contactParents = null;
  const isPriv = !!privStudent(studentId);
  if(isPriv) persistPrivate(); else scheduleSave('students', state.students);
  closeModal();
  refreshView();
}

function toggleEnglishClub(studentId){
  const s = state.students.find(s=>s.id===studentId);
  if(!s) return;
  s.englishClub = !s.englishClub;
  scheduleSave('students', state.students);
  refreshView();
}

/* ================= PARENT MESSAGE (WhatsApp) =================
   One place that turns everything the Dashboard already knows about a student
   — test scores, TOEFL diagnostic vs target, absences, lates, homework,
   participation — into a short message a teacher can paste straight into
   WhatsApp. Built for the English Club invitation, but the same generator
   handles a plain performance update.

   Design notes:
   · The teacher never types data twice. Every figure is read live from state.
   · Portuguese is the default: the message goes to parents, not to students.
   · Gender is a real problem in Portuguese ("do João" / "da Ana", "ele" /
     "ela"). It is guessed from the first name and stored on the student the
     moment the teacher corrects it, so it is only ever fixed once.
   · Manual edits in the textarea are the teacher's; regenerating is explicit.  */

const CLUB_DEFAULTS = {
  date: '', from: '14:00', to: '15:00',
  place: 'na escola', teacher: '', role: 'professor',
  kind: 'club', lang: 'pt',
  times: {},          // {eventId: {from,to}} — overrides for Club sessions
  pick: {},           // {studentId: [eventId,...]} — which sessions each student is called to
  inc: { grades:true, attendance:true, late:true, hw:true, part:true, norecovery:true }
};
function clubSettings(){
  const c = state.clubSettings || {};
  return Object.assign({}, CLUB_DEFAULTS, c, {
    inc: Object.assign({}, CLUB_DEFAULTS.inc, c.inc||{}),
    times: Object.assign({}, c.times||{}),
    pick: Object.assign({}, c.pick||{})
  });
}
function setClubSetting(k, v){
  const c = clubSettings();
  c[k] = v;
  state.clubSettings = c;
  scheduleSave('clubSettings', c);
  pmRegenerate(k==='lang' || k==='kind');
}
function setClubInc(k, v){
  const c = clubSettings();
  c.inc[k] = !!v;
  state.clubSettings = c;
  scheduleSave('clubSettings', c);
  pmRegenerate();
}

/* --- Portuguese gender: guess, then let the teacher fix it once. --- */
const PM_MALE_A = ['luca','joshua','nicola','elias','tobias','matias','mathias','isaias','josias','ariel','gabriel','rafael','noah','jonas','dinha'];
const PM_FEMALE_NOT_A = ['beatriz','ines','inês','isis','carmen','ester','esther','raquel','rute','ruth','isabel','miriam','mariel','jasmin','jasmim','yasmin','nicole','michele','michelle','danielle','gabrielle','elis','iris','íris','doris','lais','laís','luz','mercedes','solange','madalen'];
function pmFirstName(name){ return String(name||'').trim().split(/\s+/)[0] || ''; }
function pmGenderOf(student){
  if(student.gender === 'f' || student.gender === 'm') return student.gender;
  const f = pmFirstName(student.name).toLowerCase();
  if(!f) return 'm';
  if(PM_FEMALE_NOT_A.includes(f)) return 'f';
  if(PM_MALE_A.includes(f)) return 'm';
  return /a$/.test(f) ? 'f' : 'm';
}
function pmSetGender(studentId, g){
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return;
  s.gender = g;
  scheduleSave('students', state.students);
  pmRegenerate();
}

/* --- Every figure that could belong in a message, gathered once. --- */
function parentMsgStats(student){
  const cls = classById(student.classId);
  const records = studentAttendanceRecords(student);
  const total = records.length;
  const absent = records.filter(r=>r.attendance==='absent').length;
  const attended = records.filter(r=>r.attendance!=='absent');
  const present = total - absent;
  const late = attended.filter(r=>(r.lateMin||0)>0).length;
  const lateMin = attended.reduce((s,r)=>s+(r.lateMin||0),0);

  /* Expected sessions across every enrollment window, never running past today
     — a rate that counts classes which have not happened yet is not a rate. */
  const today = todayStr();
  const expected = (()=>{
    let sum = 0, any = false;
    for(const w of enrollmentsOf(student)){
      const c = classById(w.classId);
      if(!c) continue;
      const wFrom = w.from || c.startDate;
      const wTo = [w.to, c.endDate, today].filter(Boolean).sort()[0];
      if(!wFrom || !wTo || wFrom > wTo) continue;
      const n = expectedSessionsForClass(c, wFrom, wTo);
      if(n!=null){ sum += n; any = true; }
    }
    return any ? sum : null;
  })();
  const attRate = attendanceRate(expected, absent, present, late).rate;

  const hwRecords = attended.filter(r=>hwEffOf(r)!=null);
  const hwAvg = hwRecords.length ? Math.round(hwRecords.reduce((s,r)=>s+hwEffOf(r),0)/hwRecords.length) : null;
  const hwMissing = records.filter(r=>r._hwLate==='no_hw').length;

  const partRecords = attended.filter(r=>partEffOf(r));
  const partLow = partRecords.filter(r=>partEffOf(r)==='low').length;
  const partScore = partRecords.length
    ? Math.round(100*(partRecords.filter(r=>partEffOf(r)==='great').length
                    + partRecords.filter(r=>partEffOf(r)==='good').length*0.5)/partRecords.length)
    : null;

  // Grades — always the class's current (most recent) cycle.
  let st = null, cycle = null, labels = [];
  if(cls){
    const g = classGrades(cls.id);
    cycle = g.cycles[g.cycles.length-1];
    st = gradeStatus(cls, cycle, student.id);
    const n = testCountFor(cls);
    for(let i=0;i<n;i++) labels.push(testLabelFor(cls, i));
  }
  let need = null, remaining = 0, missingPts = null;
  if(st && !st.advanced){
    remaining = st.of - st.entered;
    missingPts = Math.max(0, CYCLE_TOTAL_TARGET - st.total);
    if(remaining > 0) need = Math.ceil(missingPts / remaining);
  }
  const nextTestDate = (cls && cycle && Array.isArray(cycle.testDates))
    ? cycle.testDates.filter(d=>d && d >= today).sort()[0] || null : null;

  return { cls, cycle, st, labels, need, remaining, missingPts, nextTestDate,
           expected, total, absent, present, late, lateMin, attRate,
           hwAvg, hwMissing, partScore, partLow,
           essays: (cls && cycle) ? studentEssays(cycle, student.id, essayCountFor(cls)) : [] };
}

/* --- A one-line data digest shown above each message, so the teacher can see
       at a glance what the generator is working from. --- */
function pmFactsLine(d){
  const bits = [];
  if(d.st){
    bits.push(d.st.advanced
      ? `TOEFL ${d.st.diagnostic??'—'}→${d.st.final??'—'} (meta ${d.st.target})`
      : `${d.st.scores.map(v=>(v==null||v==='')?'—':v).join('/')} · média ${d.st.avg}`);
  }
  if(d.attRate!=null) bits.push(`${d.attRate}% presença`);
  if(d.absent) bits.push(`${d.absent} falta${d.absent>1?'s':''}`);
  if(d.late) bits.push(`${d.late} atraso${d.late>1?'s':''} (${d.lateMin} min)`);
  if(d.hwAvg!=null) bits.push(`dever ${d.hwAvg}%`);
  if(d.hwMissing) bits.push(`${d.hwMissing} sem entregar`);
  return bits.join(' · ') || 'sem dados registados ainda';
}

function pmDatePt(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  return `${dias[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
}
function pmDateEn(dateStr){
  if(!dateStr) return '';
  return new Date(dateStr+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long'});
}
function pmHour(t){ return String(t||'').replace(':00','h').replace(':','h'); }

/* --- The message itself. Short, warm, factual. Only sections that carry a
       real finding are written, so a student with perfect attendance doesn't
       get a paragraph about attendance. --- */
function buildParentMessage(student){
  const cfg = clubSettings();
  if(cfg.kind === 'club') return cfg.lang === 'en' ? pmClubInviteEn(student, cfg) : pmClubInvitePt(student, cfg);
  return cfg.lang === 'en' ? pmTextEn(student, cfg) : pmTextPt(student, cfg);
}
/* ================= ENGLISH CLUB INVITATION =================
   A separate message from the performance update, because it does a different
   job: it states plainly where the student stands, says that the invitation is
   not to the whole class, gives the dates and the student's own time, and asks
   the family for one specific thing — getting them there. The work itself is
   the student's, and the message says so: a parent who reads that the teacher
   will fix it has been told the wrong thing. */
function pmInviteFacts(d, inc, f, g, pt){
  const F = [];
  if(inc.grades && d.st){
    if(d.st.advanced){
      if(d.st.final != null && d.st.under){
        F.push(pt ? `No TOEFL, ${g.ela} fez ${d.st.final} pontos, ${d.st.target - d.st.final} abaixo da meta da turma, que é ${d.st.target}.`
                  : `In the TOEFL, ${f} scored ${d.st.final}, ${d.st.target - d.st.final} points below the class target of ${d.st.target}.`);
      } else if(d.st.diagnostic != null && (d.st.target - d.st.diagnostic) > 0){
        const gap = d.st.target - d.st.diagnostic;
        F.push(pt ? `No diagnóstico, ${g.ela} fez ${d.st.diagnostic} pontos no TOEFL e a meta da turma é ${d.st.target}: faltam ${gap} pontos, e a prova oficial é uma só, na última aula do curso.`
                  : `In the diagnostic, ${f} scored ${d.st.diagnostic} and the class target is ${d.st.target}: ${gap} points short, and the official test is sat once, in the last lesson of the course.`);
      }
    } else {
      const r = d.remaining;
      if(r > 0 && d.need != null){
        F.push(pt ? `${g.Ela} está com ${d.st.total} dos ${CYCLE_TOTAL_TARGET} pontos necessários e resta${r===1?' uma única avaliação':`m ${r} avaliações`}, ou seja, precisa de ${d.need} pontos ${r===1?'nela':'em cada uma'}.`
                  : `${f} has ${d.st.total} of the ${CYCLE_TOTAL_TARGET} points needed, with ${r===1?'a single assessment':`${r} assessments`} left — that means ${d.need} points ${r===1?'in it':'in each one'}.`);
      } else if(d.st.entered > 0){
        F.push(pt ? `${g.Ela} está com ${d.st.total} dos ${CYCLE_TOTAL_TARGET} pontos necessários.`
                  : `${f} has ${d.st.total} of the ${CYCLE_TOTAL_TARGET} points needed.`);
      }
    }
  }
  const rot = [];
  if(inc.attendance && d.absent > 0){
    rot.push(pt ? `${d.absent} falta${d.absent>1?'s':''}` : `${d.absent} absence${d.absent>1?'s':''}`);
  }
  if(inc.hw && d.hwMissing > 0){
    rot.push(pt ? `${d.hwMissing} dever${d.hwMissing>1?'es':''} não entregue${d.hwMissing>1?'s':''}`
                : `${d.hwMissing} ${d.hwMissing>1?'pieces':'piece'} of homework not handed in`);
  }
  if(rot.length){
    const first = !F.length;
    F.push(pt
      ? (first ? `${g.Ela} está com ${pmJoin(rot, 'e')} no período, com conteúdo que não volta.`
               : `Somam-se a isso ${pmJoin(rot, 'e')} no período, com conteúdo que não volta.`)
      : (first ? `${f} has ${pmJoin(rot, 'and')} this term — content that does not come back.`
               : `On top of that, ${pmJoin(rot, 'and')} this term — content that does not come back.`));
  }
  if(inc.norecovery){
    if(d.st && d.st.advanced){
      F.push(pt ? `Não há segunda aplicação do TOEFL: é uma prova só, e ela decide o resultado final ${g.dela}.`
                : `There is no second sitting of the TOEFL: it is taken once, and it decides ${f}'s final result.`);
    } else if(d.remaining === 1){
      F.push(pt ? `Não existe prova de recuperação: essa última prova decide o resultado final ${g.dela}.`
                : `There is no resit: that last test decides ${f}'s final result.`);
    } else if(d.remaining > 1){
      F.push(pt ? `Não existe prova de recuperação: as avaliações que faltam decidem o resultado final ${g.dela}.`
                : `There is no resit: the assessments still ahead decide ${f}'s final result.`);
    }
  }
  return F;
}

function pmClubInvitePt(student, cfg){
  const d = parentMsgStats(student);
  const f = pmFirstName(student.name);
  const fem = pmGenderOf(student) === 'f';
  const g = { o: fem?'a':'o', doDa: fem?'da':'do', ela: fem?'ela':'ele', Ela: fem?'Ela':'Ele',
              dela: fem?'dela':'dele', propria: fem?'a própria':'o próprio' };
  const n = pmPicked(student).length;
  const P = [];

  const role = cfg.role === 'professora' ? 'professora' : 'professor';
  P.push(cfg.teacher
    ? `Olá! Aqui é ${cfg.teacher}, ${role} de inglês ${g.doDa} ${f}, da Phil Young's.`
    : `Olá! Aqui é ${role==='professora'?'a':'o'} ${role} de inglês ${g.doDa} ${f}, da Phil Young's.`);

  const facts = pmInviteFacts(d, cfg.inc, f, g, true);
  P.push(facts.length
    ? `Preciso ser direto com vocês sobre a situação ${g.doDa} ${f} no curso. ` + facts.join(' ')
    : `Queria falar com vocês sobre o momento ${g.doDa} ${f} no curso, porque é hora de agir.`);

  P.push(`É por isso que estou convidando ${g.o} ${f} para o English Club. O convite não é para a turma toda: chamo os alunos cuja situação exige ação imediata, e a ${g.dela} exige. São encontros extras e gratuitos, fora do horário normal, para recuperar o conteúdo que ficou para trás e treinar exatamente o que cai na prova.`);

  P.push(pmSessionsBlock(student, cfg, true));

  if(n > 1){
    P.push(`São ${n} encontros, e a sequência importa: cada um puxa o seguinte, e o ganho aparece quando ${g.ela} vem ${n===2?'nos dois':'nos '+n}.`);
  }

  P.push(`A participação é voluntária, mas neste momento eu não a trataria como opcional. Quem vira esse quadro é ${g.propria} ${f}, com o esforço ${g.dela}. O que nós podemos fazer, eu aqui e vocês em casa, é garantir que ${g.ela} tenha essa chance e chegue ${n>1?'nesses horários':'nesse horário'}.`);

  P.push(`Posso contar com vocês? É só confirmar por aqui que eu reservo ${n>1?'as vagas':'a vaga'}.`);
  P.push(role === 'professora' ? `Obrigada!` : `Obrigado!`);
  return P.join('\n\n');
}

function pmClubInviteEn(student, cfg){
  const d = parentMsgStats(student);
  const f = pmFirstName(student.name);
  const n = pmPicked(student).length;
  const P = [];

  P.push(cfg.teacher
    ? `Hello! This is ${cfg.teacher}, ${f}'s English teacher at Phil Young's.`
    : `Hello! This is ${f}'s English teacher at Phil Young's.`);

  const facts = pmInviteFacts(d, cfg.inc, f, {}, false);
  P.push(facts.length
    ? `I need to be straight with you about where ${f} stands on the course. ` + facts.join(' ')
    : `I wanted to talk to you about where ${f} stands on the course, because this is the moment to act.`);

  P.push(`That is why I am inviting ${f} to the English Club. The invitation does not go to the whole class: I call the students whose situation needs acting on now, and ${f}'s does. These are extra sessions, free of charge and outside normal hours, to catch up on the content left behind and practice exactly what comes up in the test.`);

  P.push(pmSessionsBlock(student, cfg, false));

  if(n > 1){
    P.push(`That is ${n} sessions, and the sequence matters: each one leads into the next, and the gain shows when ${f} comes to ${n===2?'both':'all '+n}.`);
  }

  P.push(`Attendance is voluntary, but right now I would not treat it as optional. The one who turns this around is ${f}, through ${f}'s own work. What we can do, me here and you at home, is make sure ${f} gets that chance and arrives ${n>1?'at those times':'at that time'}.`);

  P.push(`Can I count on you? Just confirm here and I will save ${n>1?'the places':'the place'}.`);
  P.push(`Thank you!`);
  return P.join('\n\n');
}


/* --- English Club sessions come from the Calendar, not from a second place to
       keep updated. Any event whose title names the Club counts; an event tied
       to a class is only offered to that class's students. --- */
function isClubEvent(e){ return /english\s*club|clube?\s*de\s*ingl/i.test(e && e.title || ''); }
function clubEvents(){
  const today = todayStr();
  return (state.events||[]).filter(e=>isClubEvent(e) && e.date >= today)
    .sort((a,b)=>a.date.localeCompare(b.date) || String(a.title||'').localeCompare(String(b.title||'')));
}
function clubEventsFor(student){
  return clubEvents().filter(e=>!e.classId || e.classId===student.classId);
}
/* A time written into the event title ("English Club 14h-15h") is the teacher's
   own note and beats the modal default. An explicit edit in the modal beats
   both. */
function pmParseTimes(title){
  const m = /(\d{1,2})\s*[:h]\s*(\d{2})?\s*(?:-|–|—|a|as|às|até|to)\s*(\d{1,2})\s*[:h]?\s*(\d{2})?/i.exec(String(title||''));
  if(!m) return null;
  const h1 = Number(m[1]), h2 = Number(m[3]);
  if(h1 > 23 || h2 > 23) return null;
  return { from: pad(h1)+':'+(m[2]||'00'), to: pad(h2)+':'+(m[4]||'00') };
}
function clubSessionTime(e){
  const cfg = clubSettings();
  const saved = (cfg.times||{})[e && e.id];
  if(saved && saved.from && saved.to) return saved;
  return pmParseTimes(e && e.title) || { from: cfg.from, to: cfg.to };
}
/* Which sessions this student is being called to. Nothing chosen yet defaults
   to the next one — an invitation to a series is a deliberate act, so it is
   opted into rather than assumed. */
function pmPicked(student){
  const avail = clubEventsFor(student);
  if(!avail.length) return [];
  const saved = (clubSettings().pick||{})[student.id];
  if(Array.isArray(saved)) return avail.filter(e=>saved.includes(e.id));
  return avail.slice(0,1);
}
function clubMutate(fn){
  const c = clubSettings();
  fn(c);
  state.clubSettings = c;
  scheduleSave('clubSettings', c);
}
function setClubTime(eventId, which, val){
  const ev = (state.events||[]).find(e=>e.id===eventId);
  const cur = clubSessionTime(ev || {id:eventId});
  const next = Object.assign({}, cur); next[which] = val;
  clubMutate(c=>{ c.times = Object.assign({}, c.times, {[eventId]: next}); });
  pmRegenerate();
}
function pmTogglePick(studentId, eventId){
  const s = state.students.find(x=>x.id===studentId); if(!s) return;
  const cur = pmPicked(s).map(e=>e.id);
  const next = cur.includes(eventId) ? cur.filter(id=>id!==eventId) : cur.concat([eventId]);
  clubMutate(c=>{ c.pick = Object.assign({}, c.pick, {[studentId]: next}); });
  pmRegenerate();
}
function pmPickAll(studentId, on){
  const s = state.students.find(x=>x.id===studentId); if(!s) return;
  const next = on ? clubEventsFor(s).map(e=>e.id) : [];
  clubMutate(c=>{ c.pick = Object.assign({}, c.pick, {[studentId]: next}); });
  pmRegenerate();
}

/* ================= ENGLISH CLUB SESSIONS =================
   The Club is already on the Calendar and students are already flagged for it,
   so this adds only the Friday itself: who turned up, and what was done.
   Attendance lives in state.clubs keyed by the calendar event's id, entirely
   apart from class sessions — no class figure moves because of the Club.
   Nothing is assumed: a student who is never ticked stays "not recorded"
   rather than counting as present, because registering is not turning up. */
function clubEventsAll(){
  return (state.events||[]).filter(isClubEvent).slice()
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function clubEventById(id){ return (state.events||[]).find(e=>e.id===id && isClubEvent(e)) || null; }
function clubRec(eventId){
  const r = (state.clubs||{})[eventId] || {};
  return { content: r.content||'', roster: Array.isArray(r.roster)?r.roster.slice():null,
           att: Object.assign({}, r.att||{}), done: !!r.done,
           slots: Array.isArray(r.slots)&&r.slots.length ? r.slots.map(s=>Object.assign({}, s)) : null,
           slotOf: Object.assign({}, r.slotOf||{}) };
}
function clubMutateRec(eventId, fn){
  const rec = clubRec(eventId);
  fn(rec);
  state.clubs = Object.assign({}, state.clubs||{}, {[eventId]: rec});
  scheduleSave('clubs', state.clubs);
}
/* Flagged students are registered for every Club session, unless the teacher
   narrowed the list down in the message modal or edited this session's roster
   by hand. An event tied to a class only takes that class's students. */
function clubFlagged(){
  return sortByName(state.students.filter(s=>{
    const c = classById(s.classId);
    return s.englishClub && c && !c.archived;
  }));
}
function clubRegisteredIds(eventId){
  const rec = clubRec(eventId);
  if(rec.roster) return rec.roster.slice();
  const ev = clubEventById(eventId);
  const picks = clubSettings().pick || {};
  return clubFlagged().filter(s=>{
    if(ev && ev.classId && ev.classId !== s.classId) return false;
    const saved = picks[s.id];
    return Array.isArray(saved) ? saved.includes(eventId) : true;
  }).map(s=>s.id);
}
/* Anyone with a record on the day belongs on the list even if they were never
   registered — a walk-in is still someone who was there. */
function clubRosterIds(eventId){
  const ids = clubRegisteredIds(eventId);
  Object.keys(clubRec(eventId).att).forEach(id=>{ if(!ids.includes(id)) ids.push(id); });
  return ids.filter(id=>state.students.some(s=>s.id===id));
}
function clubCounts(eventId){
  const att = clubRec(eventId).att;
  let present = 0, absent = 0;
  const ids = clubRosterIds(eventId);
  ids.forEach(id=>{
    const st = (att[id]||{}).status;
    if(st === 'present') present++;
    else if(st === 'absent') absent++;
  });
  return { total: ids.length, present, absent, unmarked: ids.length - present - absent };
}
function clubSessionsDue(){
  const today = todayStr();
  return clubEventsAll().filter(e=>e.date <= today && !clubRec(e.id).done);
}

/* --- writes --- */
function setClubStatus(eventId, studentId, status){
  clubMutateRec(eventId, r=>{
    const cur = Object.assign({}, r.att[studentId]||{});
    cur.status = (cur.status === status) ? null : status;
    if(cur.status === 'absent'){ cur.late = false; cur.lateMin = 0; cur.leftEarlyMin = 0; }
    r.att = Object.assign({}, r.att, {[studentId]: cur});
  });
  refreshView();
}
function clubMarkAllPresent(eventId){
  const ids = clubRosterIds(eventId);
  clubMutateRec(eventId, r=>{
    const att = Object.assign({}, r.att);
    ids.forEach(id=>{
      if(!(att[id]||{}).status) att[id] = Object.assign({}, att[id]||{}, {status:'present'});
    });
    r.att = att;
  });
  refreshView();
}
function clubAddStudent(eventId, studentId){
  if(!studentId) return;
  const ids = clubRosterIds(eventId);
  if(!ids.includes(studentId)) ids.push(studentId);
  clubMutateRec(eventId, r=>{ r.roster = ids; });
  refreshView();
}
function clubRemoveStudent(eventId, studentId){
  const ids = clubRosterIds(eventId).filter(id=>id!==studentId);
  clubMutateRec(eventId, r=>{
    r.roster = ids;
    const att = Object.assign({}, r.att);
    delete att[studentId];
    r.att = att;
  });
  refreshView();
}
function setClubNum(eventId, studentId, field, val){
  const n = Math.max(0, Math.round(Number(val) || 0));
  clubMutateRec(eventId, r=>{
    const cur = Object.assign({}, r.att[studentId]||{});
    cur[field] = n;
    if(field === 'lateMin') cur.late = n > 0;
    r.att = Object.assign({}, r.att, {[studentId]: cur});
  });
  refreshView();
}
function setClubContent(eventId, val){
  clubMutateRec(eventId, r=>{ r.content = val; });
  refreshView();
}
function setClubDone(eventId, on){
  clubMutateRec(eventId, r=>{ r.done = !!on; });
  refreshView();
}


function nextFridayStr(){
  const d = new Date();
  d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7));
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function addClubSession(){
  const input = document.getElementById('club-new-date');
  const date = input && input.value;
  if(!date) return;
  const existing = clubEventsAll().find(e=>e.date === date);
  if(existing){ goToClubSession(existing.id); return; }
  const ev = { id: uid(), date, title: 'English Club', type: 'other', classId: null };
  state.events.push(ev);
  scheduleSave('events', state.events);
  refreshView();
  goToClubSession(ev.id);
}

/* --- time slots ---
   One Friday can hold several sittings: two students at 14:00, three more at
   15:30. Slots live on the session record, and each registered student is
   assigned to one when the teacher registers them. A session with no slots
   behaves as it always did — a single time read from the event title or the
   Club defaults — so old dates are untouched. */
function clubSlots(eventId){
  const rec = clubRec(eventId);
  if(rec.slots && rec.slots.length){
    return rec.slots.map(s=>({ id:s.id, from:s.from||'', to:s.to||'' }));
  }
  const ev = clubEventById(eventId);
  const t = ev ? clubSessionTime(ev) : { from:'', to:'' };
  return [{ id:'default', from:t.from, to:t.to }];
}
function clubSlotIdOf(eventId, studentId){
  const slots = clubSlots(eventId);
  const want = (clubRec(eventId).slotOf||{})[studentId];
  return slots.some(s=>s.id===want) ? want : slots[0].id;
}
function clubSlotTime(eventId, studentId){
  const slots = clubSlots(eventId);
  const id = clubSlotIdOf(eventId, studentId);
  return slots.find(s=>s.id===id) || slots[0];
}
/* The one call the rest of the app makes: this student's time on this date. */
function clubTimeFor(ev, student){
  if(!ev) return { from:'', to:'' };
  return student ? clubSlotTime(ev.id, student.id) : clubSessionTime(ev);
}
function clubSlotLabel(s){ return `${s.from||'?'}–${s.to||'?'}`; }
function clubSlotStudents(eventId, slotId){
  return clubRosterIds(eventId).filter(id=>clubSlotIdOf(eventId, id) === slotId);
}
function clubTimePlus(hhmm, mins){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm||''));
  if(!m) return '';
  const total = (Number(m[1])*60 + Number(m[2]) + mins) % 1440;
  return pad(Math.floor(total/60)) + ':' + pad(total%60);
}
/* What the new-slot fields suggest: the hour after the last slot ends. The
   teacher overwrites it as often as not, which is the point of the fields. */
function clubNextSlotFrom(eventId){
  const slots = clubSlots(eventId);
  const last = slots[slots.length-1];
  return (last && (last.to || clubTimePlus(last.from, 60))) || '14:00';
}
function addClubSlot(eventId){
  const fromEl = document.getElementById('club-new-from');
  const toEl = document.getElementById('club-new-to');
  const slots = clubSlots(eventId).slice();
  const from = (fromEl && fromEl.value) || clubNextSlotFrom(eventId);
  const to = (toEl && toEl.value) || clubTimePlus(from, 60) || '';
  slots.push({ id: uid(), from, to });
  clubMutateRec(eventId, r=>{ r.slots = slots; });
  refreshView();
}
function setClubSlotTime(eventId, slotId, which, val){
  const slots = clubSlots(eventId).map(s=>s.id===slotId ? Object.assign({}, s, {[which]: val}) : s);
  clubMutateRec(eventId, r=>{ r.slots = slots; });
  refreshView();
}
/* Removing a slot never removes its students: they fall back to the first
   slot, which is where the teacher will look for them. */
function removeClubSlot(eventId, slotId){
  const slots = clubSlots(eventId).filter(s=>s.id!==slotId);
  clubMutateRec(eventId, r=>{
    r.slots = slots.length ? slots : null;
    const slotOf = Object.assign({}, r.slotOf||{});
    Object.keys(slotOf).forEach(id=>{ if(slotOf[id]===slotId) delete slotOf[id]; });
    r.slotOf = slotOf;
  });
  refreshView();
}
function setStudentSlot(eventId, studentId, slotId){
  clubMutateRec(eventId, r=>{ r.slotOf = Object.assign({}, r.slotOf||{}, {[studentId]: slotId}); });
  refreshView();
}
function clubMarkSlotPresent(eventId, slotId){
  const ids = clubSlotStudents(eventId, slotId);
  clubMutateRec(eventId, r=>{
    const att = Object.assign({}, r.att);
    ids.forEach(id=>{ if(!(att[id]||{}).status) att[id] = Object.assign({}, att[id]||{}, {status:'present'}); });
    r.att = att;
  });
  refreshView();
}

/* --- the Club's own tab: every session, in date order ---
   Dates run oldest to newest because that is how a term reads. A date with
   nobody on it is greyed: it exists on the calendar but has no one to teach,
   which is exactly the state the teacher needs to spot at a glance. */
function renderClubList(){
  const evs = clubEventsAll();
  const today = todayStr();
  const tagged = clubFlagged().length;
  const rows = evs.map(e=>{
    const c = clubCounts(e.id);
    const rec = clubRec(e.id);
    const slots = clubSlots(e.id);
    const empty = c.total === 0;
    const past = e.date < today;
    const isToday = e.date === today;
    const status = empty ? `<span class="badge other">no students</span>`
      : rec.done ? `<span class="badge green">complete</span>`
      : past ? `<span class="badge amber">roll call due</span>`
      : `<span class="badge hw">${c.total} registered</span>`;
    return `
      <tr class="club-row ${empty?'club-empty':''}" onclick="goToClubSession('${e.id}')" style="cursor:pointer;">

        <td>${slots.map(sl=>esc(clubSlotLabel(sl))).join(' · ')}</td>
        <td>${empty ? '—' : `${c.total} student${c.total===1?'':'s'}`}</td>
        <td>${empty ? '—' : `${c.present} present${c.absent?` · ${c.absent} absent`:''}${c.unmarked?` · ${c.unmarked} not marked`:''}`}</td>
        <td>${status}</td>
        <td><button type="button" class="icon-btn" onclick="event.stopPropagation();goToClubSession('${e.id}')">Open →</button></td>
      </tr>`;
  }).join('');

  document.getElementById('view-club-list').innerHTML = `
    <div class="topbar">
      <div>
        <h1>⭐ English Club</h1>
        <div class="meta">${evs.length} session${evs.length===1?'':'s'} · ${tagged} student${tagged===1?'':'s'} tagged${clubSessionsDue().length?` · ${clubSessionsDue().length} awaiting roll call`:''}</div>
      </div>
      <div class="rollcall-controls">
        <input type="date" id="club-new-date" value="${nextFridayStr()}">
        <button class="btn-accent" onclick="addClubSession()">+ Add session</button>
      </div>
    </div>
    ${evs.length ? `
      <div class="card section">
        <div class="compact-wrap">
          <table class="compact-roster">
            <thead><tr>
              <th class="cr-name">Date</th><th>Times</th><th>Registered</th><th>Attendance</th><th>Status</th><th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`
      : `<div class="card empty-card">No English Club sessions yet. Pick a date above and add the first one.</div>`}
  `;
}

/* --- the Friday itself, as its own screen ---
   A Club session is a class the teacher runs, so it gets the Roll Call
   treatment rather than a dialog: one page per date, the slots stacked down
   it, and every field for a student on their own row. Students come from
   different groups, so the note is per student — it is where what each one
   actually did gets written. */
let clubPickClass = {};     // {slotId: classId} for the add-student pickers
function goToClubSession(eventId){
  navigate('club', { clubSessionId: eventId });
}
function clubSetPickClass(slotId, classId){
  clubPickClass[slotId] = classId || '';
  refreshView();
}
function clubAddToSlot(eventId, slotId, studentId){
  if(!studentId) return;
  const ids = clubRosterIds(eventId);
  if(!ids.includes(studentId)) ids.push(studentId);
  clubMutateRec(eventId, r=>{
    r.roster = ids;
    r.slotOf = Object.assign({}, r.slotOf||{}, {[studentId]: slotId});
  });
  refreshView();
}
function setClubNoteDirect(eventId, studentId, val){
  clubMutateRec(eventId, r=>{
    r.att = Object.assign({}, r.att, {[studentId]: Object.assign({}, r.att[studentId]||{}, {note: val})});
  });
}
function clubNeighbors(eventId){
  const all = clubEventsAll();
  const i = all.findIndex(e=>e.id===eventId);
  return { prev: i > 0 ? all[i-1] : null, next: (i >= 0 && i < all.length-1) ? all[i+1] : null };
}
function navClubSession(dir){
  const n = clubNeighbors(state.clubSessionId);
  const target = dir < 0 ? n.prev : n.next;
  if(target) goToClubSession(target.id);
}
function setClubDate(eventId, date){
  if(!date) return;
  const ev = clubEventById(eventId);
  if(!ev) return;
  ev.date = date;
  scheduleSave('events', state.events);
  refreshView();
}

function clubSlotTable(eventId, slot, rec){

  const rows = ids.map(id=>{
    const s = state.students.find(x=>x.id===id);
    if(!s) return '';
    const cls = classById(s.classId);
    const a = rec.att[id] || {};
    const absent = a.status === 'absent';
    const dis = absent ? 'disabled' : '';
    return `
      <tr class="${absent?'cr-absent':''}">
        <td class="cr-name">${esc(s.name)}${clubRegisteredIds(eventId).includes(id)?'':`<span class="hw-owed">walk-in</span>`}</td>
        <td class="cr-dim">${cls?esc(cls.name):'—'}</td>
        <td>
          <div class="cr-pa">
            <button type="button" class="cr-p ${a.status==='present'?'on':''}" title="Present" onclick="setClubStatus('${eventId}','${id}','present')">P</button>
            <button type="button" class="cr-a ${absent?'on':''}" title="Absent" onclick="setClubStatus('${eventId}','${id}','absent')">A</button>
          </div>
        </td>
        <td><input type="number" min="0" class="cr-num" value="${Number(a.lateMin||0)}" ${dis} onchange="setClubNum('${eventId}','${id}','lateMin',this.value)"></td>
        <td><input type="number" min="0" class="cr-num" value="${Number(a.leftEarlyMin||0)}" ${dis} onchange="setClubNum('${eventId}','${id}','leftEarlyMin',this.value)"></td>
        <td class="cr-notes"><input type="text" class="cr-note" value="${esc(a.note||'')}" placeholder="what ${esc(pmFirstName(s.name))} did…" oninput="setClubNoteDirect('${eventId}','${id}',this.value)"></td>
        <td>
          ${clubSlots(eventId).length>1?`<select class="cr-sel" title="Move to another time" onchange="setStudentSlot('${eventId}','${id}',this.value)">
            ${clubSlots(eventId).map(sl=>`<option value="${sl.id}" ${sl.id===slot.id?'selected':''}>${esc(clubSlotLabel(sl))}</option>`).join('')}
          </select>`:''}

}

/* --- report --- */
/* Sessions the student was registered for or turned up to, up to today: a
   report is a record of what happened, not a diary of what is booked. */
function clubReportRows(student, from, to){
  if(!student) return [];
  const today = todayStr();
  return clubEventsAll().filter(e=>{
    if(e.date > today) return false;
    if(from && e.date < from) return false;
    if(to && e.date > to) return false;
    if(clubRec(e.id).att[student.id]) return true;
    return clubRegisteredIds(e.id).includes(student.id);
  }).map(e=>{
    const rec = clubRec(e.id);
    const a = rec.att[student.id] || {};
    const sl = clubSlotTime(e.id, student.id);
    return { date: e.date, title: e.title, content: (rec.content||'').trim(),
             time: (sl && sl.from) ? `${sl.from}–${sl.to||''}` : '',
             status: a.status || null, late: !!a.late || Number(a.lateMin||0) > 0,
             lateMin: Number(a.lateMin||0), leftEarlyMin: Number(a.leftEarlyMin||0),
             note: (a.note||'').trim() };
  }).sort((a,b)=>b.date.localeCompare(a.date));
}
function pmShortDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return pad(d.getDate())+'/'+pad(d.getMonth()+1);
}
function pmDayEn(dateStr){
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(dateStr+'T00:00:00').getDay()];
}
function pmDayShortPt(dateStr){
  return ['dom','seg','ter','qua','qui','sex','sáb'][new Date(dateStr+'T00:00:00').getDay()];
}
/* The date block of the message. One session reads as an appointment; several
   read as a list, because that is what the parent has to put in a diary. */
function pmSessionsBlock(student, cfg, pt){
  const picks = pmPicked(student);
  const place = cfg.place ? `\n📍 ${cfg.place}` : '';
  if(!picks.length){
    const d = pt ? (cfg.date ? pmDatePt(cfg.date) : '(defina a data)')
                 : (cfg.date ? pmDateEn(cfg.date) : '(set the date)');
    return `📅 ${d}\n🕑 ${pt ? pmHour(cfg.from)+' às '+pmHour(cfg.to) : cfg.from+' – '+cfg.to}${place}`;
  }
  if(picks.length === 1){
    const t = clubTimeFor(picks[0], student);
    const d = pt ? pmDatePt(picks[0].date) : pmDateEn(picks[0].date);
    return `📅 ${d}\n🕑 ${pt ? pmHour(t.from)+' às '+pmHour(t.to) : t.from+' – '+t.to}${place}`;
  }
  return picks.map(e=>{
    const t = clubTimeFor(e, student);
    const d = pt ? pmDatePt(e.date) : pmDateEn(e.date);
    return `📅 ${d} · ${pt ? pmHour(t.from)+' às '+pmHour(t.to) : t.from+' – '+t.to}`;
  }).join('\n') + place;
}

function pmJoin(list, conj){
  if(list.length <= 1) return list[0] || '';
  return list.slice(0,-1).join(', ') + ' ' + conj + ' ' + list[list.length-1];
}

function pmTextPt(student, cfg){
  const d = parentMsgStats(student);
  const f = pmFirstName(student.name);
  const fem = pmGenderOf(student) === 'f';
  const o = fem ? 'a' : 'o';
  const doDa = fem ? 'da' : 'do';
  const ele = fem ? 'ela' : 'ele';
  const dele = fem ? 'dela' : 'dele';
  const ado = fem ? 'ada' : 'ado';
  const inc = cfg.inc;
  const P = [];

  const role = cfg.role === 'professora' ? 'professora' : 'professor';
  P.push(cfg.teacher
    ? `Olá! Aqui é ${cfg.teacher}, ${role} de inglês ${doDa} ${f}, da Phil Young's.`
    : `Olá! Aqui é ${role==='professora'?'a':'o'} ${role} de inglês ${doDa} ${f}, da Phil Young's.`);

  /* — desempenho — */
  if(inc.grades && d.st){
    if(d.st.advanced){
      const tgt = d.st.target;
      if(d.st.final != null){
        P.push(d.st.under
          ? `No TOEFL, ${f} ficou com ${d.st.final} pontos. A meta da turma ${d.cls.level} é ${tgt}, então ${ele} ficou ${tgt - d.st.final} pontos abaixo do necessário.`
          : `No TOEFL, ${f} fez ${d.st.final} pontos, com a meta da turma em ${tgt}.`);
      } else if(d.st.diagnostic != null){
        const gap = tgt - d.st.diagnostic;
        P.push(gap > 0
          ? `No diagnóstico do início do curso, ${f} fez ${d.st.diagnostic} pontos no TOEFL. A meta da turma ${d.cls.level} é ${tgt}, ou seja, faltam ${gap} pontos até a prova oficial, na última aula do curso.`
          : `No diagnóstico, ${f} já fez ${d.st.diagnostic} pontos, acima da meta de ${tgt}. Agora é manter e ampliar essa margem até o TOEFL oficial.`);
      }
    } else {
      const done = d.st.entered;
      const lastLabel = d.labels[done-1] || '';
      const nome = ({'First Test':'primeiro teste','Second Test':'segundo teste','Third Test':'terceiro teste'})[lastLabel] || 'último teste';
      const lastScore = d.st.scores.filter(v=>v!=null).slice(-1)[0];
      if(lastScore != null){
        let s = `No ${nome}, ${f} ficou com ${lastScore} pontos.`;
        if(d.remaining > 0){
          const provas = d.remaining === 1 ? 'na prova que falta' : `em cada uma das ${d.remaining} provas que faltam`;
          s += (d.need != null && d.need <= 100)
            ? ` A aprovação exige ${CYCLE_TOTAL_TARGET} pontos somando os três testes, e ${ele} tem ${d.st.total} até agora. Na prática, precisa de cerca de ${d.need} ${provas}.`
            : ` A aprovação exige ${CYCLE_TOTAL_TARGET} pontos somando os três testes e, pelos números, esse total já não é alcançável. O foco agora é fechar o curso o mais forte possível.`;
        } else {
          s += ` A média final ficou em ${d.st.avg}, com ${CYCLE_AVG_TARGET} como mínimo.`;
        }
        P.push(s);
      }
    }
  }

  /* — rotina: tudo o que pesa no desempenho, num parágrafo só — */
  const cl = [];
  if(inc.attendance && d.absent > 0){
    cl.push(d.expected
      ? `faltou a ${d.absent} ${d.absent===1?'aula':'aulas'} das ${d.expected} até agora (${d.attRate}% de presença)`
      : `tem ${d.absent} ${d.absent===1?'falta':'faltas'} registrada${d.absent===1?'':'s'}`);
  }
  if(inc.late && d.late > 0){
    cl.push(`chegou atras${ado} ${d.late} ${d.late===1?'vez':'vezes'}, somando ${d.lateMin} minutos de aula perdidos`);
  }
  if(inc.hw && d.hwMissing > 0){
    cl.push(`deixou de entregar o dever em ${d.hwMissing} ${d.hwMissing===1?'ocasião':'ocasiões'}`);
  } else if(inc.hw && d.hwAvg != null && d.hwAvg < 70){
    cl.push(`está com ${d.hwAvg}% de entrega dos deveres`);
  }
  if(inc.part && d.partScore != null && d.partScore < 55){
    cl.push(`tem participado pouco nas atividades faladas`);
  }
  if(cl.length){
    let s = `Sobre a rotina: ${f} ${pmJoin(cl, 'e')}.`;
    if(d.absent > 0 || d.late > 0) s += ` Aula perdida pesa muito, porque o conteúdo segue em frente.`;
    P.push(s);
  } else if(d.total > 0){
    P.push(`Do lado positivo, frequência e deveres ${doDa} ${f} estão em dia. A base está lá, falta transformar isso em nota.`);
  }

  if(inc.norecovery) P.push((d.st && d.st.advanced)
    ? `Não há recuperação nem segunda chance: o TOEFL é uma aplicação só, na última aula do curso.`
    : `Como não existe prova de recuperação, os pontos precisam vir já nas próximas avaliações.`);
  P.push(`Estou à disposição para combinar o que ${ele} pode fazer daqui para frente. Qualquer coisa, é só chamar por aqui.`);

  P.push(`Obrigado!`);
  return P.join('\n\n');
}

function pmTextEn(student, cfg){
  const d = parentMsgStats(student);
  const f = pmFirstName(student.name);
  const inc = cfg.inc;
  const P = [];
  P.push(cfg.teacher
    ? `Hello! This is ${cfg.teacher}, ${f}'s English teacher at Phil Young's.`
    : `Hello! This is ${f}'s English teacher, from Phil Young's.`);

  if(inc.grades && d.st){
    if(d.st.advanced){
      if(d.st.final != null){
        P.push(`On the TOEFL, ${f} scored ${d.st.final}. The target for ${d.cls.level} is ${d.st.target}${d.st.under?`, which leaves ${f} ${d.st.target-d.st.final} points short`:''}.`);
      } else if(d.st.diagnostic != null){
        const gap = d.st.target - d.st.diagnostic;
        P.push(gap > 0
          ? `On the diagnostic at the start of the course, ${f} scored ${d.st.diagnostic}. The target for ${d.cls.level} is ${d.st.target}, so there are ${gap} points to cover before the official test in the last class.`
          : `On the diagnostic, ${f} already scored ${d.st.diagnostic}, above the ${d.st.target} target. The job now is to hold and widen that margin.`);
      }
    } else {
      const lastScore = d.st.scores.filter(v=>v!=null).slice(-1)[0];
      if(lastScore != null){
        let s = `On the ${d.labels[d.st.entered-1] || 'last test'}, ${f} scored ${lastScore}.`;
        if(d.remaining > 0){
          s += (d.need != null && d.need <= 100)
            ? ` Passing takes ${CYCLE_TOTAL_TARGET} points across the three tests and the total so far is ${d.st.total}, so that means about ${d.need} on each of the ${d.remaining} test${d.remaining===1?'':'s'} still to come.`
            : ` Passing takes ${CYCLE_TOTAL_TARGET} points across the three tests, and that total is no longer reachable. The aim now is to finish the course as strongly as possible.`;
        } else {
          s += ` The final average is ${d.st.avg}, against a minimum of ${CYCLE_AVG_TARGET}.`;
        }
        P.push(s);
      }
    }
  }

  const cl = [];
  if(inc.attendance && d.absent > 0) cl.push(d.expected ? `has missed ${d.absent} of ${d.expected} classes so far (${d.attRate}% attendance)` : `has ${d.absent} recorded absence${d.absent===1?'':'s'}`);
  if(inc.late && d.late > 0) cl.push(`has arrived late ${d.late} time${d.late===1?'':'s'}, losing ${d.lateMin} minutes of class`);
  if(inc.hw && d.hwMissing > 0) cl.push(`did not hand in homework on ${d.hwMissing} occasion${d.hwMissing===1?'':'s'}`);
  else if(inc.hw && d.hwAvg != null && d.hwAvg < 70) cl.push(`is at ${d.hwAvg}% on homework`);
  if(inc.part && d.partScore != null && d.partScore < 55) cl.push(`speaks up rarely in class`);
  if(cl.length){
    let s = `On the day-to-day: ${f} ${pmJoin(cl, 'and')}.`;
    if(d.absent > 0 || d.late > 0) s += ` A missed lesson costs a lot, because the content moves on.`;
    P.push(s);
  } else if(d.total > 0){
    P.push(`On the positive side, ${f}'s attendance and homework are both on track. The foundation is there — it needs to turn into marks.`);
  }

  if(inc.norecovery) P.push(`There is no resit exam, so the points have to come from the assessments still ahead.`);
  P.push(`I am happy to talk through what ${f} can do from here. Just message me any time.`);

  P.push(`Thank you!`);
  return P.join('\n\n');
}

/* ---------- the Message Parents screen ----------
   Lives as a tab inside Contacts rather than a modal: writing five personalised
   messages is a sit-down job, and a dialog that tall fights the page it floats
   over. The interface is English throughout; only the generated message follows
   the message-language setting, because that is the part a parent reads. */
let pmExtraIds = [];        // students opened explicitly from a 📱 button
let pmSelected = null;      // Set of ids being written right now; null = "all"
let pmShowTimes = false;

function pmFlaggedIds(){
  return sortByName(state.students.filter(s=>{
    const c = classById(s.classId);
    return s.englishClub && c && !c.archived;
  })).map(s=>s.id);
}
/* The roster is whoever is flagged, plus anyone the teacher opened by hand.
   Marking a message done clears the flag, so students leave the list on their
   own and nothing has to be reconciled. */
function pmRoster(){
  const ids = pmFlaggedIds();
  pmExtraIds.forEach(id=>{ if(!ids.includes(id) && state.students.some(s=>s.id===id)) ids.push(id); });
  return sortByName(ids.map(id=>state.students.find(s=>s.id===id)).filter(Boolean)).map(s=>s.id);
}
function pmChosen(){
  const roster = pmRoster();
  const sel = pmSelected;
  return roster.map(id=>state.students.find(s=>s.id===id))
               .filter(s=>s && (!sel || sel.has(s.id)));
}
function openParentMessages(ids){
  const cfg = clubSettings();
  if(!cfg.date){
    // Default to the next Friday — the slot the Club actually runs in.
    const d = new Date(); d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7 || 7));
    state.clubSettings = Object.assign({}, cfg, { date: dateToStr(d.getFullYear(), d.getMonth(), d.getDate()) });
    scheduleSave('clubSettings', state.clubSettings);
  }
  pmExtraIds = (ids || []).slice();
  pmSelected = (ids && ids.length) ? new Set(ids) : null;
  pmShowTimes = false;
  state.contactsTab = 'messages';
  navigate('contacts');
}

function setContactsTab(tab){
  state.contactsTab = tab === 'messages' ? 'messages' : 'log';
  refreshView();
}
function contactsTabsHtml(active){
  const n = pmRoster().length;
  const btn = (k, label, count) => `<button class="btn-ghost small" onclick="setContactsTab('${k}')"
    style="${active===k?'border-color:var(--accent);color:var(--accent);font-weight:700;':''}">${label}${count!=null?` (${count})`:''}</button>`;
  return `<div class="no-print" style="display:flex;gap:8px;margin-bottom:16px;">
    ${btn('log','Contact log')}${btn('messages','Message parents', n)}
  </div>`;
}

        </select>
        <input type="text" value="${esc(cfg.place)}" placeholder="Place" onchange="setClubSetting('place',this.value)"
          style="flex:1 1 130px;min-width:110px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12.5px;background:var(--surface);color:var(--text);">
        <input type="text" value="${esc(cfg.teacher)}" placeholder="Your name (optional)" onchange="setClubSetting('teacher',this.value)"
          title="Just your name — the message adds the rest around it."
          style="flex:1 1 150px;min-width:120px;border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12.5px;background:var(--surface);color:var(--text);">

  const evs = clubEvents();
  if(!evs.length){
    return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
      <span class="meta" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;">Session</span>
      <input type="date" value="${esc(cfg.date)}" onchange="setClubSetting('date',this.value)"
        style="border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12.5px;background:var(--surface);color:var(--text);">
      <input type="time" value="${esc(cfg.from)}" onchange="setClubSetting('from',this.value)"
        style="border:1px solid var(--border);border-radius:8px;padding:6px 8px;font-size:12.5px;background:var(--surface);color:var(--text);">
      <span class="meta">→</span>
      <input type="time" value="${esc(cfg.to)}" onchange="setClubSetting('to',this.value)"

      <span class="meta" style="font-size:11px;flex:1 1 100%;">Nothing marked on the Calendar from today. Add events titled “English Club” there to invite students to several at once.</span>

  }
