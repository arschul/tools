/* ---------- JSON backup: export / import ----------
   Independent of Supabase — a local file the teacher controls.
   The state keys in BACKUP_KEYS + backupMeta are the full source of truth.
*/
function setGradeMargin(v){
  state.gradeSettings.margin = Math.max(0, Number(v)||0);
  scheduleSave('gradeSettings', state.gradeSettings);
  refreshView();   // dashboard alert cards react immediately
}

function setDashUpcomingRange(r){
  localStorage.setItem('dashUpcomingRange', r);   // per-device preference, like theme
  refreshView();
}

const BACKUP_KEYS = ['classes','students','sessions','events','holidays','sessionMeta',
  'lessonNotes','homework','promises','privateStudents','privateLessons','payments','checkpoints',
  'learningPoints','classFocus','privateSettings','grades','gradeSettings','pointsLog','activities','projects'];

function daysSinceLastBackup(){
  const last = state.backupMeta?.lastBackupAt;
  if(!last) return Infinity;
  return (Date.now() - new Date(last).getTime()) / 86400000;
}

async function markBackupDone(){
  state.backupMeta = { lastBackupAt: new Date().toISOString() };
  await saveKey('backupMeta', state.backupMeta);
}

function exportBackup(){
  const payload = { exportedAt: new Date().toISOString(), version: 1, data: {} };
  BACKUP_KEYS.forEach(k => { payload.data[k] = state[k]; });
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr();
  a.href = url;
  a.download = `efl-dashboard-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  markBackupDone().then(()=>{ refreshView(); });
}

function openBackupModal(){
  const last = state.backupMeta?.lastBackupAt;
  const lastLabel = last ? formatDateLong(last.slice(0,10)) + ' at ' + new Date(last).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : 'Never';
  showModal(`${sizeModal('md')}
    <h2>Backup &amp; Restore</h2>
    <p class="meta" style="margin:6px 0 18px;">A local JSON file of everything in your dashboard, independent of Supabase. Keep a copy somewhere safe (Drive, email to yourself, etc).</p>
    <div class="card section" style="margin-bottom:14px;">
      <h3>Export</h3>
      <p class="meta" style="margin:4px 0 12px;">Last backup: <b>${esc(lastLabel)}</b></p>
      <button class="btn-accent" onclick="exportBackup()">⬇ Download backup (.json)</button>
    </div>
    <div class="card section" style="border-left:4px solid var(--red);">
      <h3>Restore</h3>
      <p class="meta" style="margin:4px 0 12px;">Replaces everything currently in the dashboard with the contents of the chosen file. This cannot be undone — export a current backup first if unsure.</p>
      <input type="file" id="backup-file-input" accept="application/json,.json" style="display:none;" onchange="handleBackupFileChosen(event)">
      <button class="btn-ghost" style="border-color:var(--red);color:var(--red);" onclick="document.getElementById('backup-file-input').click()">⬆ Choose backup file to restore…</button>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:16px;">
      <button class="btn-ghost" onclick="closeModal()">Close</button>
    </div>
  `);
}

function handleBackupFileChosen(evt){
  const file = evt.target.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert('That file is not valid JSON.'); return; }
    const data = parsed?.data && typeof parsed.data==='object' ? parsed.data : parsed;
    if(!data || typeof data!=='object'){ alert("That file doesn't look like a dashboard backup."); return; }
    const foundKeys = BACKUP_KEYS.filter(k => Object.prototype.hasOwnProperty.call(data,k));
    if(foundKeys.length < 3){ alert("That file doesn't look like a dashboard backup — expected keys like 'classes' and 'students' weren't found."); return; }
    const missing = BACKUP_KEYS.filter(k=>!foundKeys.includes(k));
    const stamp = parsed?.exportedAt ? formatDateLong(parsed.exportedAt.slice(0,10)) : 'unknown date';
    const warn = missing.length ? `\n\nNote: this file is missing ${missing.length} field(s) (${missing.join(', ')}) — those will be reset to empty on restore.` : '';
    if(!confirm(`Restore backup from ${stamp}?\n\nThis will REPLACE all current data in the dashboard with the contents of this file.${warn}\n\nThis cannot be undone.`)) return;
    restoreBackup(data);
  };
  reader.onerror = () => alert('Could not read that file.');
  reader.readAsText(file);
  evt.target.value = '';
}

async function restoreBackup(data){
  closeModal();
  showModal(`<h2>Restoring…</h2><p class="meta">Please don't close this tab.</p>`, true);
  try{
    for(const key of BACKUP_KEYS){
      const value = Object.prototype.hasOwnProperty.call(data,key) ? data[key] : (Array.isArray(state[key]) ? [] : {});
      state[key] = value;
      const ok = await saveKey(key, value);
      if(!ok) throw new Error(`Failed to save "${key}" — restore stopped partway. Check your connection and try again; already-saved keys were written.`);
    }
    await markBackupDone();
    closeModal();
    navigate('dashboard');
    alert('Backup restored successfully.');
  }catch(e){
    closeModal();
    alert('Restore error: ' + (e?.message || String(e)));
  }
}

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dateToStr(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function nowTime(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function formatDateLong(dateStr){
  return new Date(dateStr+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
function formatDateShort(dateStr){
  return new Date(dateStr+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
const DAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function getClassDays(cls){
  if(Array.isArray(cls.days) && cls.days.length) return cls.days;
  if(cls.schedule && SCHEDULE_DAYS[cls.schedule]) return SCHEDULE_DAYS[cls.schedule];
  return [];
}
function scheduleLabel(cls){
  const days = getClassDays(cls);
  return days.length ? days.map(d=>DAY_ABBR[d]).join(' / ') : 'No days set';
}
function classById(id){ return state.classes.find(c=>c.id===id); }
function activeClasses(){ return state.classes.filter(c=>!c.archived); }
/* A day's classes read in the order they're taught. Times are stored as "HH:MM"
   so a plain string compare sorts them, but a stray "9:00" would sort after
   "14:00", so minutes-since-midnight is used instead. Classes with no time set
   go last, then alphabetically, rather than falling wherever they were created. */
function timeToMins(t){
  const m = /^(\d{1,2}):(\d{2})/.exec(String(t || '').trim());
  return m ? (Number(m[1]) * 60 + Number(m[2])) : null;
}
function byClassTime(a, b){
  const ta = timeToMins(a && a.time), tb = timeToMins(b && b.time);
  if(ta == null && tb == null) return byName(a, b);
  if(ta == null) return 1;
  if(tb == null) return -1;
  return (ta - tb) || byName(a, b);
}
function sortByClassTime(list){ return list.slice().sort(byClassTime); }
function archivedClasses(){ return state.classes.filter(c=>c.archived); }

/* ---------- group level tags & test grades ----------
   Group tags live on the CLASS (not the student). Test regime derives from the tag:
   - Teens / Basic / Intermediate: three TERMS in a course, each closed by its
     own test (First, Second, Third). 240 points total across them (avg 80).
     If the running average of entered tests is under 80 -> contact parents.
   - Advanced: ONE term. A diagnostic in the first week sets the baseline; the
     real TOEFL sits on the last class or the one before it. Per-level target
     (Adv 1 = 475, Adv 2 = 500, Adv 3 = 525, Adv 4 = 550) applies to the FINAL
     TOEFL only -> contact parents. A low diagnostic is the expected starting
     point and never raises a flag. Two essays are written during the term.
*/
const GROUP_LEVELS = ['Teens 1','Teens 2','Teens 3','Teens 4','Basic 1','Basic 2','Basic 3','Basic 4','Intermediate 1','Intermediate 2','Intermediate 3','Intermediate 4','Advanced 1','Advanced 2','Advanced 3','Advanced 4'];
const TOEFL_TARGETS = {'Advanced 1':475,'Advanced 2':500,'Advanced 3':525,'Advanced 4':550};
const CYCLE_TOTAL_TARGET = 240, CYCLE_AVG_TARGET = 80;
function isAdvancedLevel(lv){ return /^Advanced /.test(lv||''); }
function testCountFor(cls){ return isAdvancedLevel(cls?.level) ? 2 : 3; }
/* Regular levels run three terms, each closed by its own test.
   Advanced runs ONE term: a diagnostic in the first week to set the baseline,
   and the real TOEFL on the last (or second-to-last) class of the term. The
   two are not comparable attempts, so they are never averaged or added. */
const TEST_ORDINALS = ['First','Second','Third','Fourth','Fifth','Sixth'];
const ADV_TEST_LABELS = ['Diagnostic', 'TOEFL Test'];
function testLabelFor(cls, i){
  if(isAdvancedLevel(cls?.level)) return ADV_TEST_LABELS[i] || ('TOEFL '+(i+1));
  return TEST_ORDINALS[i] ? TEST_ORDINALS[i]+' Test' : 'Test '+(i+1);
}
// Which slot carries the mark that decides pass/fail. Advanced: the final TOEFL.
function finalTestIdx(cls){ return testCountFor(cls) - 1; }

/* ================= TERMS =================
   Regular levels: three terms. Term 1 runs from day one to the First Test;
   Term 2 from the first class after it to the Second Test; Term 3 likewise to
   the Third Test. Advanced: a single term, opened by a diagnostic in week one
   and closed by the real TOEFL on the last class or the one before it.
   Reports use these to show how a student is attending in the term they're in
   right now, next to the accumulated figures — a strong start can otherwise
   hide a recent slide. */
function termsFor(cls, cycle){
  if(!cls || !cycle) return [];
  const dates = cycle.testDates || [];
  const today = todayStr();
  const start = courseStartFor(cls, cycle);

  if(isAdvancedLevel(cls.level)){
    const end = dates[finalTestIdx(cls)] || null;
    return [{ idx:0, label:'Term', endLabel:testLabelFor(cls, finalTestIdx(cls)),
              testIdx:finalTestIdx(cls), from:start, after:null, to:end, isCurrent:true }];
  }

  const n = testCountFor(cls);
  const out = [];
  let after = null;                 // exclusive lower bound (the previous test day)
  for(let i=0;i<n;i++){
    out.push({ idx:i, label:'Term '+(i+1), endLabel:testLabelFor(cls,i), testIdx:i,
               from:(after?null:start), after:after, to:dates[i] || null });
    if(dates[i]) after = dates[i];
  }
  // Current = the first term whose test is still ahead (or undated).
  let cur = out.findIndex(p => !p.to || p.to >= today);
  if(cur < 0) cur = out.length - 1;
  out.forEach((p,i)=>{ p.isCurrent = (i===cur); });
  return out;
}

/* When Term 1 began. `startedAt` is stamped the moment the grades record is
   first created — which is whenever the teacher first opened the Grades
   screen, often weeks into the course — so it is not the course start. For the
   FIRST course of a class, the class's own start date is the truth. Later
   courses (a repeat of the level, a new year) legitimately begin when they
   were created, so those keep `startedAt`. */
function courseStartFor(cls, cycle){
  const g = state.grades[cls.id];
  const isFirst = !g || !g.cycles || !g.cycles.length || g.cycles[0] === cycle;
  if(isFirst && cls.startDate){
    // Guard against a class start recorded after the grades record was made.
    return (cycle.startedAt && cycle.startedAt < cls.startDate) ? cycle.startedAt : cls.startDate;
  }
  return cycle.startedAt || cls.startDate || null;
}

// Attendance figures for one term, from a student's full record history.
function periodStats(records, p){
  const today = todayStr();
  const rows = records.filter(r=>{
    if(p.after && r.date <= p.after) return false;
    if(!p.after && p.from && r.date < p.from) return false;
    return r.date <= (p.to || today);
  });
  const classes = rows.length;
  const absent = rows.filter(r=>r.attendance==='absent').length;
  const late = rows.filter(r=>r.attendance!=='absent' && (r.lateMin||0)>0).length;
  const present = classes - absent;
  return { classes, present, absent, late,
           rate: classes ? Math.round((present/classes)*100) : null };
}

function periodRangeTxt(p, pt){
  const a = p.after || p.from;
  const from = a ? formatDateShort(a) : (pt?'início':'start');
  const to = p.to ? formatDateShort(p.to) : (pt?'em curso':'ongoing');
  return from + ' – ' + to;
}

/* ================= ESSAYS (Advanced classes) =================
   Advanced classes write 2 essays per cycle alongside their 2 TOEFL tests.
   Scored on the TWE band scale 0-6 (half points allowed). Essays are recorded,
   graphed and reported, but they never move the Contact Parents flag — that
   stays tied to the TOEFL target, exactly as before. */
const ESSAY_MAX = 6, ESSAY_PASS = 4;
function essayCountFor(cls){ return isAdvancedLevel(cls?.level) ? 2 : 0; }
function essayLabelFor(cls, i){ return 'Essay '+(i+1); }
/* Older cycle records predate essays — this fills the shape in on demand,
   so nothing ever needs migrating. */
function cycleEssays(cycle){
  if(!cycle.essayScores) cycle.essayScores = {};
  if(!Array.isArray(cycle.essayDates)) cycle.essayDates = [];
  if(!Array.isArray(cycle.essayTopics)) cycle.essayTopics = [];
  if(!Array.isArray(cycle.essayEventIds)) cycle.essayEventIds = [];
  return cycle.essayScores;
}
// One essay mark: clamped to 0-6, kept to 2 decimal places. Marks like 5.2 or
// 5.75 are normal here, so nothing is snapped to a band.
function essayValue(v){
  if(v==null || v==='') return null;
  const n = Number(v);
  if(isNaN(n)) return null;
  return Math.max(0, Math.min(ESSAY_MAX, Math.round(n*100)/100));
}
function fmtEssay(v){ return v==null ? '—' : String(Math.round(v*100)/100); }
function studentEssays(cycle, studentId, n){
  const arr = (((cycle.essayScores||{})[studentId])||[]).slice(0, n).map(essayValue);
  while(arr.length < n) arr.push(null);
  return arr;
}
// A student's essay standing in one cycle. null when nothing is entered yet.
function essayStatus(cls, cycle, studentId){
  const n = essayCountFor(cls);
  if(!n) return null;
  const scores = studentEssays(cycle, studentId, n);
  const nums = scores.filter(v=>v!=null);
  if(!nums.length) return null;
  const avg = Math.round((nums.reduce((a,b)=>a+b,0)/nums.length)*100)/100;
  return { scores:scores, entered:nums.length, of:n, avg:avg, max:ESSAY_MAX,
           best:Math.max.apply(null,nums), low:nums.some(v=>v<ESSAY_PASS) };
}
function essayScoresTxt(scores){ return scores.map(fmtEssay).join(' / '); }
// Every essay on record for one student, oldest first, across all cycles.
function essayHistory(cls, studentId){
  const g = state.grades[cls.id];
  if(!g || !g.cycles) return [];
  const n = essayCountFor(cls);
  if(!n) return [];
  const out = [];
  g.cycles.forEach(cy=>{
    cycleEssays(cy);
    const scores = studentEssays(cy, studentId, n);
    scores.forEach((v,i)=>{
      if(v==null && !(cy.essayTopics||[])[i]) return;
      if(v==null) return;
      out.push({ cycleLabel:cy.label, label:essayLabelFor(cls,i), idx:i,
                 date:(cy.essayDates||[])[i]||null, topic:(cy.essayTopics||[])[i]||null, score:v });
    });
  });
  return out;
}

const TOEFL_FORM_LABELS = { rta:'Advanced 1 test', rtb:'Advanced 2 test', rtc:'Advanced 3 test', rtd:'Advanced 4 test', itp1:'ITP practice test' };
const TOEFL_FORM_IDS = ['rta','rtb','rtc','rtd','itp1'];
const TOEFL_SECTIONS = [
  { k:'L', col:0, max:50, en:'Listening', pt:'Listening' },
  { k:'S', col:1, max:40, en:'Structure', pt:'Structure' },
  { k:'R', col:2, max:50, en:'Reading',   pt:'Reading'   }
];
const TOEFL_SECTION_COLORS = { L:'#2563eb', S:'#d97706', R:'#0e9f6e', T:'#111827' };
// A class sitting Advanced N defaults to that level's test booklet.
function toeflFormFor(cls){
  const m = /^Advanced ([1-4])$/.exec((cls&&cls.level)||'');
  return m ? TOEFL_FORM_IDS[Number(m[1])-1] : 'itp1';
}
function toeflSectionScore(form, col, raw){
  const tbl = TOEFL_FORMS[form] || TOEFL_FORMS.itp1;
  if(raw==null || raw==='') return null;
  const n = Number(raw);
  if(isNaN(n)) return null;
  const i = Math.max(0, Math.min(TOEFL_SECTIONS[col].max, Math.round(n)));
  return Math.round(tbl[i][col]*10);
}
// All three sections are required — a partial test has no meaningful total.
/* Sections are scored independently — a test sat one section at a time is a
   perfectly normal classroom situation. `total` only exists once all three
   are in, but every entered section always has its converted score. */
function toeflCompute(form, L, S, R){
  const src = {L:L, S:S, R:R}, sec = {};
  let filled = 0;
  for(const s of TOEFL_SECTIONS){
    const v = toeflSectionScore(form, s.col, src[s.k]);
    sec[s.k] = v;
    if(v!=null) filled++;
  }
  const complete = filled===3;
  return { sec: sec, filled: filled, complete: complete,
           total: complete ? Math.round((sec.L + sec.S + sec.R)/3) : null };
}
/* A score cell holds EITHER a plain number (typed straight in, or data from
   before section entry existed) OR a detail object {form,L,S,R,v,sec}.
   Everything downstream reads through these helpers, so both shapes stay
   valid forever and no migration is ever needed. */
function scoreValue(entry){
  if(entry==null || entry==='') return null;
  if(typeof entry==='object'){
    if(entry.v==null || entry.v==='') return null;   // a part-entered test has no final score yet
    const n = Number(entry.v); return isNaN(n)?null:n;
  }
  const n = Number(entry); return isNaN(n)?null:n;
}
function scoreDetail(entry){
  return (entry && typeof entry==='object' && entry.form) ? entry : null;
}
// Converted score per section — null for sections not sat yet.
function scoreSections(entry){
  const d = scoreDetail(entry);
  if(!d) return null;
  const c = toeflCompute(d.form, d.L, d.S, d.R);
  return c.filled ? c.sec : null;
}
function sectionsFilled(sec){ return sec ? TOEFL_SECTIONS.filter(s=>sec[s.k]!=null).length : 0; }
function missingSectionNames(sec){ return TOEFL_SECTIONS.filter(s=>!sec || sec[s.k]==null).map(s=>s.en); }
// Build a detail object from raw section counts. Null only if nothing is entered.
function makeToeflEntry(form, L, S, R){
  const norm = v => (v===''||v==null||isNaN(Number(v))) ? null : Math.round(Number(v));
  const c = toeflCompute(form, L, S, R);
  if(!c.filled) return null;
  return { form:form, L:norm(L), S:norm(S), R:norm(R), v:c.total, sec:c.sec, partial:!c.complete };
}
/* ---- mock tests (simulations) ----
   A mock sits inside a cycle next to the official tests but NEVER counts
   towards pass/fail. It exists purely so section-by-section progress can be
   compared across attempts. */
function cycleMocks(cycle){ if(!Array.isArray(cycle.mocks)) cycle.mocks = []; return cycle.mocks; }
function toeflFormOfSlot(cycle, slot, cls){
  if(slot && slot.kind==='mock'){
    const mk = cycleMocks(cycle).find(m=>m.id===slot.id);
    return (mk && mk.form) || toeflFormFor(cls);
  }
  return (cycle.testForms||[])[slot ? slot.idx : 0] || toeflFormFor(cls);
}
/* Every TOEFL attempt on record for one student, oldest first, across all
   cycles. Officials and mocks are interleaved by test date where known.
   Part-scored attempts are included — their sections count, their total is
   simply null until the remaining sections are sat. */
function toeflAttempts(cls, studentId){
  const g = state.grades[cls.id];
  if(!g || !g.cycles) return [];
  const n = testCountFor(cls);
  const out = [];
  g.cycles.forEach(cy=>{
    const items = [];
    studentScores(cy, studentId, n).forEach((entry, i)=>{
      items.push({ entry:entry, kind:'official', seq:i, key:cy.id+'|o'+i, label:testLabelFor(cls,i), date:(cy.testDates||[])[i]||null });
    });
    cycleMocks(cy).forEach((mk, i)=>{
      items.push({ entry:(mk.scores||{})[studentId], kind:'mock', seq:100+i, key:cy.id+'|m'+mk.id, label:mk.label||('Mock '+(i+1)), date:mk.date||null });
    });
    items.sort((a,b)=> (a.date||'9999-99-99').localeCompare(b.date||'9999-99-99') || a.seq-b.seq);
    items.forEach(it=>{
      const v = scoreValue(it.entry);
      const sec = scoreSections(it.entry);
      if(v==null && !sec) return;               // nothing entered at all
      const d = scoreDetail(it.entry);
      out.push({ key:it.key, label:it.label, cycleLabel:cy.label, kind:it.kind, date:it.date, total:v,
                 form: d ? d.form : null,
                 raw:  d ? {L:d.L, S:d.S, R:d.R} : null,
                 sec:  sec,
                 filled: sectionsFilled(sec),
                 complete: v!=null });
    });
  });
  return out;
}
/* Section-by-section change. Each section is compared against the most recent
   EARLIER attempt that also has that section — so a Listening-only day still
   compares against the last time Listening was sat, not against a test that
   skipped it. Percentages are on raw correct answers: the figure a student
   actually feels ("4 more right out of 50"). */
function toeflProgress(attempts){
  const list = attempts || [];
  if(list.length < 2) return null;
  const cur = list[list.length-1];
  const sections = [];
  if(cur.raw && cur.sec){
    TOEFL_SECTIONS.forEach(s=>{
      if(cur.raw[s.k]==null) return;
      let prev = null;
      for(let i=list.length-2; i>=0; i--){ const a = list[i]; if(a.raw && a.raw[s.k]!=null){ prev = a; break; } }
      if(!prev) return;
      const c = cur.raw[s.k], p = prev.raw[s.k];
      sections.push({ k:s.k, en:s.en, max:s.max, cur:c, prev:p, delta:c-p,
                      pct: p>0 ? Math.round(((c-p)/p)*100) : null,
                      curScore:cur.sec[s.k], prevScore:prev.sec[s.k],
                      scoreDelta:cur.sec[s.k]-prev.sec[s.k],
                      prevLabel:prev.label, prevDate:prev.date });
    });
  }
  let totalPrev = null, totalDelta = null;
  if(cur.total!=null){
    for(let i=list.length-2; i>=0; i--){ if(list[i].total!=null){ totalPrev = list[i]; break; } }
    if(totalPrev) totalDelta = cur.total - totalPrev.total;
  }
  if(!sections.length && totalDelta==null) return null;
  return { cur:cur, sections:sections, totalPrev:totalPrev, totalDelta:totalDelta };
}
/* --- multi-line TOEFL chart: dependency-free inline SVG, prints cleanly.
       Gaps are fine: each line simply skips attempts where that section
       wasn't sat. --- */
function toeflChartSvg(attempts, opts){
  const o = opts || {};
  const w = o.w || 620, h = o.h || 210, target = o.target!=null ? o.target : null, pt = !!o.pt;
  const pts = (attempts||[]).filter(a=>a.total!=null || sectionsFilled(a.sec)>0);
  if(pts.length < 1) return `<div class="spark-empty">${pt?'sem dados ainda':'no data yet'}</div>`;
  const series = [
    { k:'T', name:pt?'Nota final':'Total score', color:TOEFL_SECTION_COLORS.T, width:2.6, get:a=>a.total },
    { k:'L', name:'Listening', color:TOEFL_SECTION_COLORS.L, width:1.8, get:a=>a.sec?a.sec.L:null },
    { k:'S', name:'Structure', color:TOEFL_SECTION_COLORS.S, width:1.8, get:a=>a.sec?a.sec.S:null },
    { k:'R', name:'Reading',   color:TOEFL_SECTION_COLORS.R, width:1.8, get:a=>a.sec?a.sec.R:null }
  ];
  const all = [];
  series.forEach(s=>pts.forEach(a=>{ const v=s.get(a); if(v!=null) all.push(v); }));
  if(target!=null) all.push(target);
  if(!all.length) return `<div class="spark-empty">${pt?'sem dados ainda':'no data yet'}</div>`;
  let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  if(lo===hi){ lo -= 10; hi += 10; }
  const span = hi-lo; lo -= span*0.14; hi += span*0.14;
  const padL = 40, padR = 12, padT = 12, padB = 34;
  const iw = w - padL - padR, ih = h - padT - padB;
  const x = i => pts.length===1 ? padL + iw/2 : padL + i*(iw/(pts.length-1));
  const y = v => padT + ih - (v-lo)/(hi-lo)*ih;
  const ticks = [lo + span*0.14, (lo+hi)/2, hi - span*0.14].map(v=>Math.round(v));
  const grid = ticks.map(v=>`<line x1="${padL}" x2="${padL+iw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#d8dee6" stroke-width="1"/><text x="${padL-6}" y="${(y(v)+3.5).toFixed(1)}" font-size="9.5" fill="#6b7280" text-anchor="end">${v}</text>`).join('');
  const targetLine = target!=null
    ? `<line x1="${padL}" x2="${padL+iw}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke="#dc2626" stroke-dasharray="4 3" stroke-width="1.4"/><text x="${padL+iw}" y="${(y(target)-4).toFixed(1)}" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="end">${pt?'meta':'target'} ${target}</text>`
    : '';
  const lines = series.map(s=>{
    const d = pts.map((a,i)=>({i:i, v:s.get(a)})).filter(p=>p.v!=null);
    if(!d.length) return '';
    const poly = d.map(p=>`${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    const dots = d.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${s.k==='T'?3.2:2.4}" fill="${s.color}"><title>${esc(pts[p.i].label)} — ${s.name}: ${p.v}</title></circle>`).join('');
    return (d.length>1 ? `<polyline points="${poly}" fill="none" stroke="${s.color}" stroke-width="${s.width}" stroke-linecap="round" stroke-linejoin="round"/>` : '') + dots;
  }).join('');
  const xLabels = pts.map((a,i)=>{
    const anchor = pts.length===1 ? 'middle' : (i===0 ? 'start' : (i===pts.length-1 ? 'end' : 'middle'));
    const short = a.label.length>13 ? a.label.slice(0,12)+'…' : a.label;
    return `<text x="${x(i).toFixed(1)}" y="${h-16}" font-size="9.5" fill="#374151" text-anchor="${anchor}">${esc(short)}</text>`
         + (a.date?`<text x="${x(i).toFixed(1)}" y="${h-5}" font-size="8.5" fill="#9ca3af" text-anchor="${anchor}">${esc(formatDateShort(a.date))}</text>`:'');
  }).join('');
  const legend = series.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);"><span style="width:12px;height:3px;border-radius:2px;background:${s.color};display:inline-block;"></span>${s.name}</span>`).join('');
  return `
  <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${pt?'Progresso TOEFL':'TOEFL progress'}" style="max-width:${w}px;">
    ${grid}${targetLine}${lines}${xLabels}
  </svg>
  <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:2px;">${legend}</div>`;
}

function classGrades(classId){
  if(!state.grades[classId]) state.grades[classId] = { cycles: [] };
  const g = state.grades[classId];
  if(!g.cycles.length) g.cycles.push({ id: uid(), label: 'Course 1', startedAt: todayStr(), scores: {} });
  g.cycles.forEach(cy=>{ if(!cy.id) cy.id = uid(); });   // older records predate cycle ids
  return g;
}
function studentScores(cycle, studentId, n){
  const arr = ((cycle.scores||{})[studentId]||[]).slice(0, n);
  while(arr.length < n) arr.push(null);
  return arr;
}
// Evaluate a student's standing in a cycle. Returns null if no scores entered yet.
// gradeSettings.margin: also flag students who pass but sit within `margin` points
// of the minimum (e.g. margin 3 flags averages 80–82.9 as "close").
function gradeMargin(){ return Math.max(0, Number(state.gradeSettings?.margin)||0); }
function gradeStatus(cls, cycle, studentId){
  const n = testCountFor(cls);
  const entries = studentScores(cycle, studentId, n);
  const scores = entries.map(scoreValue);      // number | null, whatever shape the cell holds
  const nums = scores.filter(v=>v!=null);
  if(!nums.length) return null;
  const total = nums.reduce((a,b)=>a+b,0);
  const avg = Math.round((total/nums.length)*10)/10;
  const margin = gradeMargin();
  if(isAdvancedLevel(cls.level)){
    /* The diagnostic is a baseline taken in week one — being under target there
       is the normal starting point, not a warning. Only the real TOEFL at the
       end of the term decides pass/fail, so only it can raise Contact Parents. */
    const target = TOEFL_TARGETS[cls.level];
    const fi = finalTestIdx(cls);
    const diagnostic = scores[0] != null ? scores[0] : null;
    const final = scores[fi] != null ? scores[fi] : null;
    const gain = (diagnostic != null && final != null) ? final - diagnostic : null;
    const gapToTarget = (target != null && diagnostic != null && final == null) ? target - diagnostic : null;
    return { advanced:true, target, diagnostic, final, gain, gapToTarget,
             total, avg, entered:nums.length, of:n, scores, entries,
             pending: final == null,
             under: final != null && final < target,
             close: final != null && final >= target && final < target + margin };
  }

// Human line describing a status (for dashboard alerts / reports). lang: 'en' | 'pt'

/* Every student list in the app is alphabetical. A base-sensitivity collator
   keeps Brazilian names where a teacher expects them — Álvaro under A rather
   than after Z, Ângela next to Ana — which a plain sort or a default
   localeCompare does not guarantee. */
const NAME_COLLATOR = new Intl.Collator('pt-BR', { sensitivity:'base', numeric:true });
function byName(a, b){ return NAME_COLLATOR.compare(a?.name || '', b?.name || ''); }
function sortByName(list){ return list.slice().sort(byName); }
// Keep the master list ordered too, so anything reading state.students
// directly is alphabetical without needing to remember to sort.
function sortStudentStore(){ state.students.sort(byName); }
function sortPrivateStudentStore(){ state.privateStudents.sort(byName); }

function studentsInClass(classId){ return sortByName(state.students.filter(s=>s.classId===classId)); }

function daysAgo(dateStr){ return (Date.now() - new Date(dateStr+'T00:00:00').getTime()) / 86400000; }

// A student's completed, non-holiday attendance records, deduped by date
// (prefer the enrolled class — same rule the report uses), newest first.
/* ================= DEFAULT-PRESENT RESOLUTION =================
   Roll Call DISPLAYS every student as Present by default (recFor falls back to
   defaultRecord()), but it only SAVES a record once the teacher touches that
   student. So "no saved record" means "present, nothing else noted" — NOT
   "missing". Anything that counts attendance must therefore work from the
   enrolled roster with saved records laid over the default, or a session where
   only one student was touched reports 1/1 instead of 2/2.
   All of this is read-side: no records are written, nothing is migrated. */
function sessionHappened(classId, date){
  if(date > todayStr()) return false;          // not yet — may be prepared ahead
  if(isHoliday(date)) return false;
  const sess = state.sessions[classId+'_'+date];
  if(sess && Object.keys(sess).length) return true;                    // someone was ticked
  if(state.sessionMeta && state.sessionMeta[classId+'_'+date]?.completed) return true;
  if(getLessonNote(classId, date)) return true;                        // content proves it ran
  // Otherwise: a past, in-term, scheduled class day ran even if nothing was
  // recorded — the same assumption expectedSessionsForClass already makes for
  // the attendance rate. Off-schedule dates need explicit evidence above.
  const cls = classById(classId);
  if(!cls) return false;
  if(!getClassDays(cls).includes(new Date(date+'T00:00:00').getDay())) return false;
  if(cls.startDate && date < cls.startDate) return false;
  if(cls.endDate && date > cls.endDate) return false;
  if(!cls.startDate){
    const first = firstSessionDateOf(classId);   // don't count days before the class began
    if(first && date < first) return false;
  }
  return true;
}
// Everyone enrolled in this class on this date, plus anyone with a saved record
// (covers students who have since transferred out).
function sessionRosterIds(classId, date){
  const sess = state.sessions[classId+'_'+date] || {};
  const ids = new Set(Object.keys(sess));
  for(const s of state.students){
    if(classForStudentOnDate(s, date)?.id === classId) ids.add(s.id);
  }
  return [...ids];
}
// What we know about a student on a date they weren't explicitly marked: they
// were present (the app's default), and nothing else was observed. hw/english/
// participation stay null so they can't inflate homework or behaviour averages.
function assumedRecord(){
  return { attendance:'present', lateMin:0, leftEarlyMin:0, phone:0,
           hw:null, english:null, participation:null, notes:'', _assumed:true };
}
function sessionCounts(classId, date){
  const sess = state.sessions[classId+'_'+date] || {};
  const ids = sessionRosterIds(classId, date);
  let absent = 0;
  for(const id of ids) if(sess[id]?.attendance === 'absent') absent++;
  return { roster: ids.length, absent, present: ids.length - absent,
           recorded: Object.keys(sess).length };
}
function studentAttendanceRecords(student){
  const map = new Map();
  const consider = (classId, date, rec)=>{
    if(isHoliday(date) || !isSessionCompleted(classId, date)) return;
    const enrolledId = classForStudentOnDate(student, date)?.id;
    const score = (classId===enrolledId ? 2 : 0) + 1;
    const prev = map.get(date);
    if(!prev || score > prev._score) map.set(date, {...rec, date, _classId:classId, _score:score});
  };
  // 1) Sessions where this student was explicitly recorded.
  Object.keys(state.sessions).forEach(key=>{
    const [classId, date] = splitSessionKey(key);
    const rec = state.sessions[key][student.id];
    if(rec) consider(classId, date, rec);
  });
  // 2) Sessions that demonstrably happened for a class this student was enrolled
  //    in, but where nobody ticked anything for them — default: present.
  const pairs = new Set();
  for(const key of Object.keys(state.sessions)) pairs.add(key);
  if(state.sessionMeta) for(const key of Object.keys(state.sessionMeta)) pairs.add(key);
  for(const store of [state.lessonNotes, state.homework, state.promises]){
    if(store) for(const key of Object.keys(store)) pairs.add(key);
  }
  for(const key of pairs){
    const [classId, date] = splitSessionKey(key);
    if(state.sessions[key] && state.sessions[key][student.id]) continue;   // handled above
    if(classForStudentOnDate(student, date)?.id !== classId) continue;
    if(!sessionHappened(classId, date)) continue;
    consider(classId, date, assumedRecord());
  }
  return annotateLateHw(annotateHwAssigned([...map.values()].sort((a,b)=>b.date.localeCompare(a.date))));
}

function getPreviousClassDate(cls, fromDateStr){
  const days = getClassDays(cls);
  if(!days.length) return null;
  let d = new Date(fromDateStr+'T00:00:00');
  for(let i=0; i<60; i++){
    d.setDate(d.getDate()-1);
    const dateStr = dateToStr(d.getFullYear(), d.getMonth(), d.getDate());
    if(days.includes(d.getDay()) && !isHoliday(dateStr)) return dateStr;
  }
  return null;
}
function getNextClassDate(cls, fromDateStr){
  const days = getClassDays(cls);
  if(!days.length) return null;
  let d = new Date(fromDateStr+'T00:00:00');
  for(let i=0; i<60; i++){
    d.setDate(d.getDate()+1);
    const dateStr = dateToStr(d.getFullYear(), d.getMonth(), d.getDate());
    if(cls.endDate && dateStr > cls.endDate) return null;   // course has ended
    if(days.includes(d.getDay()) && !isHoliday(dateStr)) return dateStr;
  }
  return null;
}
function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function eventTypeLabel(type){ return {hw:'Homework',test:'Test',review:'Review',project:'Project',other:'Other'}[type] || type; }
function attendanceLabel(a){ return {present:'Present',late:'Late',absent:'Absent'}[a] || '—'; }
function attendanceBadgeClass(a){ return {present:'green',late:'amber',absent:'red'}[a] || ''; }
function englishLabel(e){ return {excellent:'Excellent',improve:'Needs some reminders',unacceptable:'Needs consistent reminders'}[e] || '—'; }
function englishBadgeClass(e){ return {excellent:'green',improve:'amber',unacceptable:'red'}[e] || ''; }
function splitSessionKey(key){ const i=key.indexOf('_'); return [key.slice(0,i), key.slice(i+1)]; }
function defaultRecord(){ return {attendance:'present', lateMin:0, leftEarlyMin:0, phone:0, hw:100, english:'excellent', participation:'great', notes:''}; }
function getHoliday(dateStr){ return state.holidays.find(h=>h.date===dateStr); }
function isHoliday(dateStr){ return !!getHoliday(dateStr); }
/* ---------- duration history ---------- */
// A class's duration can change over time. durationHistory = [{from:'YYYY-MM-DD', duration:N}, ...]
// Past sessions keep the duration that was in effect on their date.
function durationHistoryOf(cls){
  if(Array.isArray(cls.durationHistory) && cls.durationHistory.length){
    return cls.durationHistory.slice().sort((a,b)=>a.from.localeCompare(b.from));
  }
  return [{ from: '1900-01-01', duration: Number(cls.duration)||150 }];
}
function durationForDate(cls, dateStr){
  if(!cls) return 150;
  const hist = durationHistoryOf(cls);
  let d = hist[0].duration;
  for(const e of hist){ if(e.from <= dateStr) d = e.duration; else break; }
  return Number(d)||150;
}
function currentDuration(cls){ return durationForDate(cls, todayStr()); }

/* ---------- enrollments (class transfers) ---------- */
// student.enrollments = [{classId, from, to|null}] — 'to' is inclusive last day in that class.
function enrollmentsOf(st){
  if(Array.isArray(st.enrollments) && st.enrollments.length) return st.enrollments;
  const c = classById(st.classId);
  return [{ classId: st.classId, from: c?.startDate || '1900-01-01', to: null }];
}
function classForStudentOnDate(st, dateStr){
  const en = enrollmentsOf(st).find(e => e.from <= dateStr && (!e.to || dateStr <= e.to));
  return classById(en ? en.classId : st.classId);
}

// A4: earliest date this class has any session record for. Used to bound the
// expected-session window when the class has no explicit startDate, so we don't
// count expected sessions from before the class actually began.
function firstSessionDateOf(classId){
  let earliest = null;
  for(const key of Object.keys(state.sessions)){
    const [cid, date] = splitSessionKey(key);
    if(cid !== classId) continue;
    if(!earliest || date < earliest) earliest = date;
  }
  return earliest;
}

function expectedSessionsForClass(cls, startOverride, endOverride){
  const days = getClassDays(cls);
  if(!days.length) return null;
  // A4: if no startDate anywhere, fall back to the first recorded session.
  const startStr = startOverride || cls.startDate || firstSessionDateOf(cls.id);
  // End fallback: an override, the class end, or today (an ongoing class counts
  // only sessions up to now, never into the future).
  const endStr = endOverride || cls.endDate || todayStr();
  if(!startStr || !endStr) return null;
  const start = new Date(startStr+'T00:00:00');
  const end = new Date(endStr+'T00:00:00');
  if(start>end) return 0;
  let count=0;
  let d = new Date(start);
  while(d<=end){
    const dow = d.getDay();
    const dateStr = dateToStr(d.getFullYear(), d.getMonth(), d.getDate());
    if(days.includes(dow) && !isHoliday(dateStr)) count++;
    d.setDate(d.getDate()+1);
  }
  return count;
}

// A3: THE single attendance-rate definition, used by the profile headline, the
// profile donut, and the group report so they can never disagree.
// Preferred: schedule-based (expected − absent) / expected — this punishes
// missed classes against the real schedule. When no schedule/dates give an
// expected count, fall back to recorded-based present/recorded and flag it so
// the UI can label it differently.
// NOTE: `present` already counts everyone who attended, INCLUDING late arrivals
// (arriving late is still being present). `late` is passed only for callers that
// want it; it is a subset of present and must not be added again here.
// Args: expected (number|null), absent, present, late (all counts).
// Returns {rate:0-100|null, basis:'schedule'|'recorded'}.
function attendanceRate(expected, absent, present, late){
  if(expected){
    return { rate: Math.round(100*(expected-absent)/expected), basis:'schedule' };
  }
  const recorded = present + absent;   // present already includes late
  if(recorded) return { rate: Math.round(100*present/recorded), basis:'recorded' };
  return { rate: null, basis:'recorded' };
}
/* Classroom time runs to thousands of minutes, which nobody can picture.
   Show the exact minutes and the same figure in hours. */
function fmtHours(mins){
  const m = Math.max(0, Math.round(mins||0));
  if(m < 60) return m + ' min';
  const h = Math.floor(m/60), r = m%60;
  return r ? h+'h '+r+'min' : h+'h';
}
function fmtMinsAndHours(mins){
  const m = Math.max(0, Math.round(mins||0));
  return m < 60 ? (m+' min') : (fmtNum(m)+' min ('+fmtHours(m)+')');
}
// 1.240 for a report in Portuguese, 1,240 in English.
function fmtNum(n){ return Number(n).toLocaleString(state.reportLang==='pt' ? 'pt-BR' : 'en-US'); }

function renderDonut(slices, centerLabel, centerSub){
  const total = slices.reduce((s,x)=>s+x.value,0);
  const size=140, stroke=20, r=(size-stroke)/2, c=2*Math.PI*r;
  let acc=0;
  const segs = total ? slices.filter(sl=>sl.value>0).map(sl=>{
    const len = sl.value/total*c;
    const dashoffset = c - acc;
    acc += len;
    return `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${sl.color}" stroke-width="${stroke}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${dashoffset.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
  }).join('') : `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${stroke}"/>`;
  return `
    <div class="donut-wrap">
      <div class="donut">
        <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}</svg>
        <div class="donut-center">

          <div class="donut-sub">${centerSub}</div>
        </div>
      </div>
      <div class="donut-legend">

      </div>

}

/* ---------- modal ----------
   All modals go through showModal(), so dialog semantics, Escape-to-close,
   the focus trap and focus restoration are implemented once, here.
   `persistent` modals (e.g. an in-progress restore) refuse Escape and
   backdrop clicks, but are still focus-trapped.

let modalLastFocus = null;      // element to return focus to on close
let modalPersistent = false;

const FOCUSABLE = 'a[href],button:not([disabled]),textarea:not([disabled]),' +
  'input:not([type="hidden"]):not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])';

function modalFocusable(modal){
  // offsetParent filters out display:none nodes (e.g. the hidden file input)
  return [...modal.querySelectorAll(FOCUSABLE)].filter(el => el.offsetParent !== null || el === document.activeElement);

/* Set from inside a modal's own template literal — see sizeModal() — so a
   call site only has to name its size once, at the top of its markup. */
let _modalSize = null;
function sizeModal(s){ _modalSize = s || null; return ''; }
function showModal(html, persistent, size){
  const root = document.getElementById('modal-root');
  // Only capture the return target when opening from a non-modal context;
  // re-rendering an already-open modal must not overwrite it.
  if(!root.firstElementChild) modalLastFocus = document.activeElement;
  modalPersistent = !!persistent;

  const cls = ('modal ' + (size || _modalSize || '')).trim();
  _modalSize = null;
  root.innerHTML = `
    <div class="modal-overlay" ${persistent?'':'onclick="if(event.target===this) closeModal()"'}>
      <div class="${cls}" role="dialog" aria-modal="true" tabindex="-1">${html}</div>
    </div>`;

  const modal = root.querySelector('.modal-overlay > div');
  const heading = modal.querySelector('h2, h3');

  }

  // itself — so screen readers announce the title instead of a stray input.

/* Every modal gets its own Save button and status line. The warning banner
   lives on the page behind the overlay, so without this a failed save is
   invisible for as long as a modal is open — which is exactly when most
   editing happens. */
let modalSaveSeq = 0;
function ensureModalSaveButton(modal, persistent){
  if(!modal || modal.hasAttribute('data-nosave')) return;
  if(modal.querySelector('.save-btn')) return;
  let bar = modal.querySelector('.modal-actions');
  if(!bar){
    if(persistent) return;              // e.g. the "Restoring…" screen: no controls on purpose
    bar = document.createElement('div');
    bar.className = 'modal-actions';

  }
  if(bar.hasAttribute('data-nosave')) return;
  const n = ++modalSaveSeq;
  const wrap = document.createElement('span');
  wrap.style.cssText = 'display:flex;align-items:center;gap:8px;margin-right:auto;';
  wrap.innerHTML =
    `<button type="button" id="msave-b${n}" class="btn-ghost small save-btn" `
    + `onclick="saveNowClicked('msave-b${n}','msave-m${n}')">💾 Save</button>`
    + `<span id="msave-m${n}" class="save-msg"></span>`
    + `<span class="save-indicator"></span>`;

/* ===== C6: undo toast — recover the last destructive action ===== */
let toastTimer = null;
function showUndoToast(message, undoFn){
  const root = document.getElementById('toast-root');
  if(!root) return;
  if(toastTimer){ clearTimeout(toastTimer); toastTimer = null; }
  root.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'toast';
  const msg = document.createElement('span'); msg.textContent = message;
  const btn = document.createElement('button'); btn.textContent = 'Undo';
  const dismiss = ()=>{ if(toastTimer){clearTimeout(toastTimer);toastTimer=null;} root.innerHTML=''; };
  btn.onclick = ()=>{ dismiss(); try{ undoFn(); }catch(e){ console.error('Undo failed', e); } };
  el.appendChild(msg); el.appendChild(btn);
  root.appendChild(el);
  toastTimer = setTimeout(dismiss, 6000);
}

function closeModal(){

  _pendingCallCtx = null;  // dismissing by Escape or backdrop must not leave it armed
  root.innerHTML = '';

document.addEventListener('keydown', (e)=>{

  if(!modal) return;

  if(e.key === 'Escape'){
    if(modalPersistent) return;
    e.preventDefault();
    closeModal();
    return;
  }

  if(e.key !== 'Tab') return;

  const items = modalFocusable(modal);
  if(!items.length){ e.preventDefault(); modal.focus(); return; }
  const first = items[0], last = items[items.length-1];

  // Focus sitting on the dialog container: Tab enters, Shift+Tab wraps to the end.
  if(document.activeElement === modal){
    e.preventDefault();

  }
  if(e.shiftKey && document.activeElement === first){
    e.preventDefault(); last.focus();
  }else if(!e.shiftKey && document.activeElement === last){
    e.preventDefault(); first.focus();
  }
});

/* ---------- navigation ---------- */
function navigate(view, params={}){
  Object.assign(state, params);
  state.view = view;
  const navMap = {dashboard:'dashboard', classes:'classes', rollcall:'rollcall', calendar:'calendar', projects:'projects', student: state.studentProfileReturn||'reports', reports:'reports', 'group-report':'reports', contacts:'contacts', private:'private', 'priv-student':'private'};
  document.querySelectorAll('.nav-item').forEach(n=>{
    const on = n.dataset.view===navMap[view];
    n.classList.toggle('active', on);
    if(n.dataset.view){ on ? n.setAttribute('aria-current','page') : n.removeAttribute('aria-current'); }
  });
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+view));
  refreshView();
}

/* Re-render whatever view is currently open.
   Mutators must call this instead of naming a view: an action reachable from
   two places (e.g. deleting a private lesson from the calendar chip) would
   otherwise repaint a hidden view and leave the visible one stale. */
function refreshView(){
  const v = state.view;
  // A record can be deleted while its own detail view is open; fall back rather than render a ghost.
  if(v==='student' && !state.students.some(s=>s.id===state.studentProfileId)){
    return navigate(state.studentProfileReturn || 'reports');
  }
  if(v==='priv-student' && !privStudent(state.privOpenStudentId)){
    return navigate('private');
  }
  if(v==='dashboard') renderDashboard();
  else if(v==='classes') renderClasses();
  else if(v==='rollcall') renderRollCall();
  else if(v==='calendar') renderCalendar();
  else if(v==='projects') renderProjects();
  else if(v==='student') renderStudentProfile();
  else if(v==='reports') renderReports();
  else if(v==='group-report') renderGroupReport();
  else if(v==='contacts') renderContacts();
  else if(v==='private') renderPrivate();
  else if(v==='priv-student') renderPrivStudent();
  updatePrivAlertDot();
  paintSaveButtons();   // the Roll Call save button is re-created by every render
}
function goToRollCall(classId, date){
  state.rollcall.classId = classId;
  state.rollcall.date = date;
  state.openDrawer = null;
  // If the target class isn't scheduled on that weekday (a makeup opened from
  // the calendar/dashboard), reveal the full list so it stays selectable.
  const cls = classById(classId);
  const dow = new Date(date+'T00:00:00').getDay();
  state.rollcallShowAll = !!(cls && !getClassDays(cls).includes(dow));
  navigate('rollcall');
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  try { _renderDashboard(el); }
  catch(e){
    el.innerHTML = `<div class="card empty-card" style="color:var(--red);">
      <b>Dashboard error — please copy this and report it:</b><br><br>
      <code style="font-size:12px;word-break:break-all;">${esc(e?.stack||e?.message||String(e))}</code>
    </div>`;
  }
}
function _renderDashboard(el){
  if(!activeClasses().length){
    el.innerHTML = `
      <div class="topbar"><div><h1>Dashboard</h1><div class="meta">${formatDateLong(todayStr())}</div></div></div>
      <div class="card empty-card">
        <p>Welcome! Start by adding your first class.</p>
        <button class="btn-accent" onclick="navigate('classes');setTimeout(openClassModal,0)">+ Add a class</button>
      </div>`;
    return;
  }
  const today = todayStr();
  const todayHoliday = getHoliday(today);
  const dow = new Date(today+'T00:00:00').getDay();
  const todaysClasses = todayHoliday ? [] : sortByClassTime(activeClasses().filter(c=>{
    if(!getClassDays(c).includes(dow)) return false;
    if(c.startDate && today < c.startDate) return false;
    if(c.endDate && today > c.endDate) return false;
    return true;
  }));
  // Upcoming = group class occurrences + calendar events + scheduled private lessons,
  // merged chronologically, filtered by range: Today (default) / Tomorrow / This week.
  const privName = id => state.privateStudents.find(p=>p.id===id)?.name || 'Private student';
  const upRange = localStorage.getItem('dashUpcomingRange') || 'today';
  const addDays = (dstr,n)=>{ const d=new Date(dstr+'T00:00:00'); d.setDate(d.getDate()+n); return dateToStr(d.getFullYear(), d.getMonth(), d.getDate()); };
  const upFrom = upRange==='tomorrow' ? addDays(today,1) : today;
  const upTo   = upRange==='week' ? addDays(today,6) : upFrom;

  // Expand recurring group classes into dated occurrences within the range
  const classOccurrences = [];
  for(let d=upFrom; d<=upTo; d=addDays(d,1)){
    if(isHoliday(d)) continue;
    const wd = new Date(d+'T00:00:00').getDay();
    activeClasses().forEach(c=>{
      if(!getClassDays(c).includes(wd)) return;
      if(c.startDate && d < c.startDate) return;
      if(c.endDate && d > c.endDate) return;
      if(isSessionCompleted(c.id, d)) return; // already marked done — not "upcoming"
      classOccurrences.push({kind:'class', date:d, time:c.time||'', c});
    });
  }

  const upcoming = [
    ...classOccurrences,
    ...state.events.filter(e=>e.date>=upFrom && e.date<=upTo).map(e=>({kind:'event', date:e.date, time:'', e})),
    ...state.privateLessons.filter(l=>l.status==='scheduled' && l.date>=upFrom && l.date<=upTo)
        .map(l=>({kind:'priv', date:l.date, time:l.time||'', l}))
  ].sort((a,b)=> a.date===b.date ? (a.time||'').localeCompare(b.time||'') : a.date.localeCompare(b.date))
   .slice(0, upRange==='week' ? 24 : 12);

  // — Private lessons whose scheduled time has already passed: remind to flag —
  const nowHM = new Date().toTimeString().slice(0,5);
  const staleLessons = state.privateLessons
    .filter(l=>l.status==='scheduled' && (l.date<today || (l.date===today && l.time && l.time<nowHM)))
    .sort((a,b)=> a.date===b.date ? (a.time||'').localeCompare(b.time||'') : a.date.localeCompare(b.date));

  // — Pending session completions (today + recent past days with data but not marked complete) —
  const pendingCompletions = [];
  activeClasses().forEach(c=>{
    const days = getClassDays(c);
    for(let i=0; i<8; i++){
      const d = new Date(today+'T00:00:00');
      d.setDate(d.getDate()-i);
      const dateStr = dateToStr(d.getFullYear(), d.getMonth(), d.getDate());
      if(!days.includes(d.getDay())) continue;
      if(isHoliday(dateStr)) continue;
      if(c.startDate && dateStr < c.startDate) continue;
      if(c.endDate && dateStr > c.endDate) continue;
      const sessionKey = c.id+'_'+dateStr;
      const hasData = !!state.sessions[sessionKey] && Object.keys(state.sessions[sessionKey]).length>0;
      if(!hasData) continue;
      const completed = isSessionCompleted(c.id, dateStr);
      if(!completed){
        pendingCompletions.push({cls:c, date:dateStr, isToday: dateStr===today});
      }
    }
  });
  pendingCompletions.sort((a,b)=>a.date.localeCompare(b.date));

  // — Today's private lessons (shown even on school holidays; completed ones stay visible) —
  const privTodayList = state.privateLessons
    .filter(l=>l.date===today && l.status!=='cancelled')
    .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  window._dashPrivTodayIds = privTodayList.map(l=>l.studentId);
  const privTodayHtml = privTodayList.map((l,i)=>`
    <div class="dash-row" ${l.status!=='scheduled'?'style="opacity:.75;"':''}>

        <span class="color-dot" style="background:#0ea5b8"></span>
        <div>
          <div class="dash-row-title">${esc(privName(l.studentId))} <span class="badge hw" style="margin-left:6px;">Private</span>${l.status==='completed'?' <span class="badge green" style="margin-left:6px;">✓ Done</span>':l.status==='no-show'?' <span class="badge red" style="margin-left:6px;">No-show</span>':''}</div>

        </div>
      </div>
      <button class="btn-ghost small" onclick="navigate('priv-student',{privOpenStudentId:window._dashPrivTodayIds[${i}]})">Open →</button>
    </div>`).join('');

  // — Today's classes —
  let todayHtml = '';
  if(todayHoliday){
    todayHtml = `<div class="empty">🎉 Holiday: ${esc(todayHoliday.label)} — no classes today.</div>`;
  } else if(todaysClasses.length){
    const allDone = todaysClasses.every(c=>isSessionCompleted(c.id, today));
    todayHtml = (allDone?`<div class="empty" style="padding:4px 0 8px;">✓ All of today's classes are done.</div>`:'') +
      todaysClasses.map(c=>{
        const done = isSessionCompleted(c.id, today);
        const hasHw = !!getHomework(c.id, today);
        const hasProm = !!getPromise(c.id, today);
        return `
      <div class="dash-row" ${done?'style="opacity:.75;"':''}>
        <div class="dash-row-left">
          <span class="color-dot" style="background:${c.color}"></span>

            <div class="dash-row-title">${esc(c.name)}${done?' <span class="badge green" style="margin-left:6px;">✓ Done</span>':''}${hasProm?' <span class="badge amber" style="margin-left:6px;">📋 Plan</span>':''}${hasHw?' <span class="badge hw" style="margin-left:6px;">📘 HW due</span>':''}</div>

          : `<button class="btn-accent" onclick="goToRollCall('${c.id}','${today}')">Start Roll Call →</button>`}
      </div>`;
      }).join('');
  } else {
    todayHtml = privTodayList.length ? '' : `<div class="empty">No classes scheduled today.</div>`;
  }

  // — Upcoming —
  window._dashUpcomingPrivIds = upcoming.map(u=>u.kind==='priv'?u.l.studentId:null);
  window._dashUpcomingClassIds = upcoming.map(u=>u.kind==='class'?u.c.id:null);
  window._dashUpcomingDates = upcoming.map(u=>u.date);
  const upcomingHtml = upcoming.length ? upcoming.map((u,i)=> u.kind==='class' ? `
    <div class="dash-row" ${u.date===today && isSessionCompleted(u.c.id, u.date)?'style="opacity:.75;"':''}>

        <span class="color-dot" style="background:${u.c.color}"></span>

          <div class="dash-row-title" style="font-size:15px;">${esc(u.c.name)}${u.c.level?` <span class="badge other" style="margin-left:6px;">${esc(u.c.level)}</span>`:''}${u.date===today && isSessionCompleted(u.c.id, u.date)?' <span class="badge green" style="margin-left:6px;">✓ Done</span>':''}${getPromise(u.c.id,u.date)?' <span class="badge amber" style="margin-left:6px;">📋</span>':''}${getHomework(u.c.id,u.date)?' <span class="badge hw" style="margin-left:6px;">📘</span>':''}</div>
          <div class="dash-row-sub">${formatDateShort(u.date)}${u.time?' · '+u.time:''} · ${studentsInClass(u.c.id).length} students</div>
        </div>
      </div>

    </div>` : u.kind==='event' ? `
    <div class="dash-row">
      <div class="dash-row-left">
        <span class="badge ${u.e.type}">${eventTypeLabel(u.e.type)}</span>
        <div>
          <div class="dash-row-title" style="font-size:15px;">${esc(u.e.title)}</div>
          <div class="dash-row-sub">${formatDateShort(u.e.date)}${u.e.classId?' · '+esc(classById(u.e.classId)?.name||''):''}</div>
        </div>

    </div>` : `
    <div class="dash-row">
      <div class="dash-row-left">
        <span class="badge hw">Private</span>
        <div>
          <div class="dash-row-title" style="font-size:15px;">${esc(privName(u.l.studentId))}</div>

  // — Contact Parents (group students) —
  const cpStudents = sortByName(state.students.filter(s=>{ const c=classById(s.classId); return s.contactParents?.reason && c && !c.archived; }));
  window._dashCpIds = cpStudents.map(s=>s.id);
  const cpHtml = cpStudents.length ? `

              <div class="dash-row-title">${esc(s.name)} <span class="badge red" style="margin-left:6px;">${esc(s.contactParents.category)}</span></div>

            <button class="icon-btn" onclick="clearContactParents(window._dashCpIds[${i}])" title="Log the call and mark done">✓ Done</button>
            <button class="icon-btn danger" onclick="discardContactParents(window._dashCpIds[${i}])" title="Discard — no longer needed, nothing logged">✕</button>
          </div>
        </div>`; }).join('')}
    </div>` : '';

  // — Reminders (private students: adults, so it's "send that link", not "call home") —

  window._dashRemIds = remStudents.map(s=>s.id);
  const remHtml = remStudents.length ? `
    <div class="card section" style="margin-top:16px;border-left:4px solid var(--amber);">
      <h3>⏰ Reminders — private students</h3>
      ${remStudents.map((s,i)=>`
        <div class="dash-row">
          <div class="dash-row-left">
            <span class="color-dot" style="background:#0ea5b8"></span>
            <div>
              <div class="dash-row-title">${esc(s.name)} <span class="badge amber" style="margin-left:6px;">${esc(s.contactParents.category)}</span></div>
              <div class="dash-row-sub">${esc(s.contactParents.reason)}</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn-ghost small" onclick="navigate('priv-student',{privOpenStudentId:window._dashRemIds[${i}]})">Open →</button>
            <button class="icon-btn" onclick="clearContactParents(window._dashRemIds[${i}])" title="Mark done">✓ Done</button>
            <button class="icon-btn danger" onclick="discardContactParents(window._dashRemIds[${i}])" title="Discard — no longer needed, nothing logged">✕</button>
          </div>
        </div>`).join('')}
    </div>` : '';

  // — English Club —
  const ecStudents = sortByName(state.students.filter(s=>{ const c=classById(s.classId); return s.englishClub && c && !c.archived; }));
  window._dashEcIds = ecStudents.map(s=>s.id);
  const ecHtml = ecStudents.length ? `
    <div class="card section" style="margin-top:16px;">
      <button type="button" class="dash-row-left" aria-expanded="${state.showDashEC}" onclick="state.showDashEC=!state.showDashEC;refreshView();">
        <span class="chevron" aria-hidden="true">${state.showDashEC?'▾':'▸'}</span>
        <span class="section-title" style="margin:0;">⭐ English Club (${ecStudents.length})</span>
      </button>
      ${state.showDashEC ? ecStudents.map((s,i)=>{ const c=classById(s.classId); return `
        <div class="dash-row">
          <div class="dash-row-left">
            ${c?`<span class="color-dot" style="background:${c.color}"></span>`:''}
            <div>
              <div class="dash-row-title">${esc(s.name)}</div>
              <div class="dash-row-sub">${c?esc(c.name):'No class'}</div>
            </div>
          </div>

    </div>` : '';

  const pendingHtml = pendingCompletions.length ? `
    <div class="card section" style="margin-bottom:16px;border-left:4px solid var(--amber);">
      <h3>⏳ Sessions awaiting completion</h3>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">These have roll call data but aren't marked complete yet, so they're not counted in reports.</div>

      ${missedAssess.length ? `

  // — Grades alerts: contact parents —
  // Non-advanced: running average of entered tests under 80 (240-point cycle),
  // or within the configurable margin above it ("close").
  // Advanced: any entered TOEFL test under the level target, or within the margin.
  const gradeAlerts = [];
  state.students.forEach(s=>{
    const c = classById(s.classId);
    if(!c || c.archived) return;
    const g = state.grades[c.id];
    if(!g || !g.cycles || !g.cycles.length) return;
    const cyc = g.cycles[g.cycles.length-1];
    const st = gradeStatus(c, cyc, s.id);
    if(st && (st.under || st.close)) gradeAlerts.push({ id:s.id, name:s.name, classId:s.classId, st, cycleLabel:cyc.label });

  // — Missed scheduled tests: contact parents —
  // Student was marked absent on a scheduled test day (current cycle) and has
  // no score entered for that test (a filled score = make-up done, no alert).
  const missedTests = [];
  activeClasses().forEach(c=>{
    const g = state.grades[c.id];
    if(!g || !g.cycles || !g.cycles.length) return;
    const cyc = g.cycles[g.cycles.length-1];

    dates.slice(0,nT).forEach((d,ti)=>{

  const risks = state.students.map(riskAssess).filter(Boolean)

  window._dashGradeIds = gradeAlerts.map(x=>x.id);

  el.innerHTML = `

      </div>
      ${items.length ? `
        <div class="student-list" style="margin-top:8px;">
          ${items.map(f=>`
            <div class="student-list-row" ${f.done?'style="opacity:.55;"':''}>
              <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">

                <span style="${f.done?'text-decoration:line-through;':''}overflow:hidden;text-overflow:ellipsis;">${esc(f.topic)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                ${f.done?'':`<button class="icon-btn" onclick="focusToNextClass('${classId}','${f.id}')" title="Add to next class plan">→ Next class</button>`}
                <button class="icon-btn danger" onclick="deleteClassFocus('${classId}','${f.id}')">Remove</button>
              </div>
            </div>`).join('')}
        </div>` : ''}

function addClassFocus(classId){
  const input = document.getElementById('focus-input-'+classId);
  if(!input) return;
  const topic = input.value.trim();
  if(!topic) return;
  if(!state.classFocus) state.classFocus = {};
  if(!state.classFocus[classId]) state.classFocus[classId] = [];
  state.classFocus[classId].push({ id: uid(), topic, added: todayStr(), done: false });
  scheduleSave('classFocus', state.classFocus);
  refreshView();
}
function toggleClassFocusDone(classId, id){
  const f = classFocusList(classId).find(x=>x.id===id);
  if(!f) return;
  f.done = !f.done;
  scheduleSave('classFocus', state.classFocus);
  refreshView();
}
function deleteClassFocus(classId, id){
  if(!state.classFocus || !state.classFocus[classId]) return;
  state.classFocus[classId] = state.classFocus[classId].filter(x=>x.id!==id);
  scheduleSave('classFocus', state.classFocus);
  refreshView();
}
function focusToNextClass(classId, id){
  const c = classById(classId);
  const f = classFocusList(classId).find(x=>x.id===id);
  if(!c || !f) return;
  const nextDate = getNextClassDate(c, todayStr());
  if(!nextDate){ alert('No upcoming scheduled class for this class.'); return; }
  // Appends to the class PLAN for that date (not "what we did", which is a
  // record of what actually happened and feeds absent reports).
  const cur = getPromise(classId, nextDate);
  if(htmlToPlain(planDisplayHtml(cur)).toLowerCase().includes(f.topic.trim().toLowerCase())){
    alert(`"${f.topic}" is already in the plan for ${formatDateShort(nextDate)}.`); return;
  }
  const line = `<div>\u{1F4CD} ${esc(f.topic)}</div>`;
  setPromise(classId, nextDate, cur ? planDisplayHtml(cur) + line : line);
  refreshView();
  alert(`Added "${f.topic}" to the class plan for ${formatDateShort(nextDate)}.`);
}
function toggleClassExpand(classId){
  state.expandedClassId = state.expandedClassId===classId ? null : classId;
  refreshView();
}

/* ===== D1: Class Log — chronological teaching history for one class ===== */
let clLogClassId = null, clLogFrom = '', clLogTo = '', clLogOnlyTaken = false;
function openClassLogModal(classId){
  clLogClassId = classId;
  clLogFrom = ''; clLogTo = ''; clLogOnlyTaken = false;
  renderClassLogModal();
}
function clSetRange(which, val){ if(which==='from') clLogFrom = val||''; else clLogTo = val||''; renderClassLogModal(); }
function clResetRange(){ clLogFrom=''; clLogTo=''; renderClassLogModal(); }
function clToggleOnlyTaken(){ clLogOnlyTaken = !clLogOnlyTaken; renderClassLogModal(); }

// Gather every dated entry for a class: any date that has a session record,
// lesson note, homework, or promise. Returns rows newest-first with an
// attendance summary computed from completed sessions only.
/* The log's row set is the UNION of dates that have a session, lesson note,
   homework or class plan — so a date prepared in advance (homework/plan set
   from the previous class's "next class" section, or a focus point sent
   forward) appears before any roll call exists for it. Those rows are real,
   not missing data; hasSession distinguishes them so the UI can say so.
   onlyTaken filters them out for a pure attendance history. */
function classLogRows(classId, fromVal, toVal, onlyTaken){
  const dates = new Set();
  for(const key of Object.keys(state.sessions)){
    const [cid, date] = splitSessionKey(key);
    if(cid===classId) dates.add(date);
  }
  for(const store of [state.lessonNotes, state.homework, state.promises]){
    if(!store) continue;
    for(const key of Object.keys(store)){
      const [cid, date] = splitSessionKey(key);
      if(cid===classId) dates.add(date);
    }
  }
  const rows = [...dates]
    .filter(d => (!fromVal || d>=fromVal) && (!toVal || d<=toVal))
    .sort((a,b)=>b.localeCompare(a))
    .map(date=>{
      const completed = isSessionCompleted(classId, date);
      const counts = sessionCounts(classId, date);
      const happened = sessionHappened(classId, date);
      return {
        date,
        content: getLessonNote(classId, date),
        hw: getHomework(classId, date),
        promise: getPromise(classId, date),
        completed,
        present: counts.present, absent: counts.absent, roster: counts.roster,
        // hasSession = this class actually ran that day (so attendance applies),
        // recorded = how many students were explicitly ticked. Untouched
        // students count as present, matching what Roll Call shows.
        hasSession: happened,
        recorded: counts.recorded,
        future: date > todayStr(),
        holiday: isHoliday(date)
      };
    })
    .filter(r => !onlyTaken || r.hasSession);
  return rows;
}

        </tbody>

    </div>
    ${!clLogOnlyTaken && prepCount ? `<div style="font-size:12px;color:var(--muted);margin-top:8px;">

  showModal(`${sizeModal('xl sheet')}

function cmDurRow(i, e, c){
  const isFirst = i===0;
  const fromVal = (e.from && e.from!=='1900-01-01') ? e.from : (isFirst ? (c?.startDate||'') : '');
  return `<div class="field-row cm-dur-row" style="align-items:center;margin-bottom:6px;">
    ${isFirst
      ? `<div style="flex:1;font-size:12px;color:var(--muted);align-self:center;">From the start</div>`
      : `<div style="flex:1;"><input class="cm-dur-from" type="date" value="${fromVal}" placeholder="From" style="width:100%;"></div>`}
    <input class="cm-dur-min" type="number" min="1" step="5" value="${e.duration||150}" style="width:100px;" title="minutes">
    <span style="font-size:12px;color:var(--muted);">min</span>
    ${isFirst?'<span style="width:34px;"></span>':`<button type="button" class="icon-btn danger" aria-label="Remove this duration period" onclick="this.closest('.cm-dur-row').remove()">×</button>`}
  </div>`;
}
function cmAddDurRow(){

  const last = rows.querySelector('.cm-dur-row:last-child .cm-dur-min')?.value || 150;

function selectSwatch(el, color){
  el.parentElement.querySelectorAll('.swatch').forEach(s=>{ s.classList.remove('on'); s.setAttribute('aria-pressed','false'); });
  el.classList.add('on');
  el.setAttribute('aria-pressed','true');

function saveClass(classId){
  const name = document.getElementById('cm-name').value.trim();
  if(!name) return;
  const days = [1,2,3,4,5,6,0].filter(d=>document.getElementById('cm-day-'+d)?.checked);
  if(!days.length){ alert('Please select at least one day.'); return; }
  const time = document.getElementById('cm-time').value;
  const level = document.getElementById('cm-level')?.value || '';
  const color = document.getElementById('cm-color').value;
  const startDate = document.getElementById('cm-start').value || null;
  const endDate = document.getElementById('cm-end').value || null;
  const pointsEnabled = !!document.getElementById('cm-points')?.checked;

  // Build duration history
  const rows = [...document.querySelectorAll('.cm-dur-row')];
  let durationHistory = rows.map((r,i)=>({
    from: (i===0 ? (r.querySelector('.cm-dur-from')?.value || '1900-01-01') : r.querySelector('.cm-dur-from')?.value),
    duration: parseInt(r.querySelector('.cm-dur-min').value) || 150
  })).filter(e=>e.from);
  if(!durationHistory.length) durationHistory = [{from:'1900-01-01', duration:150}];
  durationHistory.sort((a,b)=>a.from.localeCompare(b.from));
  // dedupe identical from-dates (last wins)
  const seen = {};
  durationHistory.forEach(e=>{ seen[e.from]=e; });
  durationHistory = Object.values(seen).sort((a,b)=>a.from.localeCompare(b.from));
  const duration = durationHistory[durationHistory.length-1].duration; // compat field = current/latest

  if(classId){
    const c = classById(classId);
    c.name=name; c.days=days; c.time=time; c.level=level; c.color=color; c.startDate=startDate; c.endDate=endDate;
    c.duration=duration; c.durationHistory=durationHistory; c.pointsEnabled=pointsEnabled;
  }else{
    state.classes.push({id:uid(), name, days, time, level, color, startDate, endDate, duration, durationHistory, pointsEnabled});
  }
  scheduleSave('classes', state.classes);
  closeModal();
  refreshView();
}
function deleteClass(classId){
  if(!confirm('Delete this class, its students, and all roll call records for it? This cannot be undone.')) return;
  state.classes = state.classes.filter(c=>c.id!==classId);
  state.students = state.students.filter(s=>s.classId!==classId);
  Object.keys(state.sessions).forEach(k=>{ if(splitSessionKey(k)[0]===classId) delete state.sessions[k]; });
  state.events = state.events.filter(e=>e.classId!==classId);
  if((state.pointsLog||[]).some(e=>e.classId===classId)){
    state.pointsLog = state.pointsLog.filter(e=>e.classId!==classId);
    scheduleSave('pointsLog', state.pointsLog);
  }
  if((state.activities||[]).some(a=>a.classId===classId)){
    state.activities = state.activities.filter(a=>a.classId!==classId);
    scheduleSave('activities', state.activities);
  }
  if(state.grades[classId]){ delete state.grades[classId]; scheduleSave('grades', state.grades); }
  if(state.expandedClassId===classId) state.expandedClassId=null;
  scheduleSave('classes', state.classes);
  scheduleSave('students', state.students);
  scheduleSave('sessions', state.sessions);
  scheduleSave('events', state.events);
  refreshView();
}
function archiveClass(classId){
  const c = classById(classId);
  if(!c) return;
  // Contact Parents must be resolved before archiving (per spec Q1)
  const pending = sortByName(state.students.filter(s=>s.classId===classId && s.contactParents?.reason));
  if(pending.length){
    alert(`Cannot archive: ${pending.length} student(s) still have an unresolved Contact Parents flag (${pending.map(s=>s.name).join(', ')}). Mark those as done first.`);
    return;
  }
  if(!confirm(`Archive "${c.name}"? It will be removed from Roll Call, Calendar and the Dashboard, but all its data and reports are kept. You can unarchive anytime.`)) return;
  c.archived = true;
  c.archivedAt = todayStr();
  // Clear English Club flags for this class's students (per spec Q1)
  state.students.forEach(s=>{ if(s.classId===classId && s.englishClub) s.englishClub=false; });
  if(state.expandedClassId===classId) state.expandedClassId=null;
  scheduleSave('classes', state.classes);
  scheduleSave('students', state.students);
  refreshView();
}

/* Attendance alerts are derived from the register, not raised by hand, so
   there is no flag to clear once the call is made. The logged call carries an
   alertKey instead, and any alert whose key is already in the student's call
   history stops being shown. A fresh pair of absences produces a new key, so
   the alert comes back when it should. */
function attendanceAlertKey(kind){
  return [kind].concat(Array.prototype.slice.call(arguments, 1)).join(':');
}
function alertHandled(student, key){
  return ((student && student.contactParentsHistory) || []).some(h => h.alertKey === key);
}

let _pendingCallCtx = null;   // set when logging a call for a derived alert
function openAttendanceCallModal(studentId, alertKey, reason){
  const s = anyStudent(studentId);
  if(!s) return;
  _pendingCallCtx = { alertKey: alertKey, category: 'Attendance', reason: reason };
  showModal(`${sizeModal('md')}
    <h3>☎️ Log Call — ${esc(s.name)}</h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 14px;">${esc(reason)} — write a brief summary of the conversation. It appears on the student's report and clears this alert.</p>
    <div class="field"><label>Call date</label><input id="cp-call-date" type="date" value="${todayStr()}"></div>
    <div class="field"><label>Summary of conversation</label>
      <textarea id="cp-summary" rows="4" autofocus style="width:100%;border:1px solid var(--border);border-radius:8px;padding:8px;font-family:inherit;font-size:13px;" placeholder="e.g. Spoke with mother about the absences. She was unaware and committed to improving attendance."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="cancelPendingCall()">Cancel</button>
      <button class="btn-accent" onclick="confirmCallDone('${studentId}')">Save &amp; Mark Done</button>
    </div>
  `);
}
function cancelPendingCall(){ _pendingCallCtx = null; closeModal(); }

function confirmCallDone(studentId){
  const s = anyStudent(studentId);
  if(!s) return;
  const ctx = _pendingCallCtx;
  const flag = s.contactParents;
  if(!ctx && !flag) return;
  const summary = document.getElementById('cp-summary').value.trim();
  const callDate = document.getElementById('cp-call-date').value;
  const isPrivDone = !!privStudent(studentId);
  if(!summary && !isPrivDone){ alert('Please enter a summary of the conversation.'); return; }
  if(!s.contactParentsHistory) s.contactParentsHistory = [];
  const entry = {
    id: uid(),
    date: callDate,
    category: ctx ? ctx.category : flag.category,
    reason: ctx ? ctx.reason : flag.reason,
    summary: summary
  };
  if(ctx && ctx.alertKey) entry.alertKey = ctx.alertKey;
  s.contactParentsHistory.unshift(entry);
  _pendingCallCtx = null;
  // A hand-raised flag is cleared; a derived alert has none to clear.
  if(flag) s.contactParents = null;
  const isPriv = !!privStudent(studentId);
  if(isPriv) persistPrivate(); else scheduleSave('students', state.students);
  closeModal();
  refreshView();
}

function transferStudent(studentId){
  const st = state.students.find(x=>x.id===studentId);
  if(!st) return;
  const newClassId = document.getElementById('tr-class').value;
  const fromDate = document.getElementById('tr-date').value || todayStr();
  if(newClassId===st.classId){ closeModal(); return; }
  const newCls = classById(newClassId);
  if(!confirm(`Transfer ${st.name} to "${newCls.name}" starting ${formatDateShort(fromDate)}?`)) return;

  // close current enrollment the day before the transfer, open the new one
  const en = enrollmentsOf(st).map(e=>({...e}));
  const open = en.find(e=>!e.to);
  const prevDay = new Date(fromDate+'T00:00:00');
  prevDay.setDate(prevDay.getDate()-1);
  const prevStr = dateToStr(prevDay.getFullYear(), prevDay.getMonth(), prevDay.getDate());
  if(open) open.to = prevStr;
  en.push({ classId: newClassId, from: fromDate, to: null });

  st.enrollments = en;
  st.classId = newClassId;
  scheduleSave('students', state.students);
  closeModal();
  refreshView();
}
/* Renaming keeps the same student record, so attendance, grades, notes,
