function privUpdateDayLabel(d){
  const cb = document.getElementById('ps-day-'+d);
  const lbl = document.getElementById('ps-day-label-'+d);
  if(!cb||!lbl) return;
  lbl.style.background = cb.checked ? 'var(--accent-soft)' : '#fff';
  lbl.style.color = cb.checked ? 'var(--accent)' : 'var(--muted)';
  lbl.style.borderColor = cb.checked ? 'var(--accent)' : 'var(--border)';
}
function privSelectedDays(){
  return [1,2,3,4,5,6,0].filter(d=>document.getElementById('ps-day-'+d)?.checked);
}
function privRenderCustomTimes(existingSlots){
  const box = document.getElementById('ps-custom-box');
  const on = document.getElementById('ps-custom')?.checked;
  if(!box) return;
  box.style.display = on ? 'block' : 'none';
  if(!on){ box.innerHTML=''; return; }
  // preserve anything already typed in the box, then fall back to saved slots
  const typed = {};
  box.querySelectorAll('.ps-ctime').forEach(inp=>{
    const d = inp.dataset.day;
    typed[d] = { time: inp.value, duration: box.querySelector(`.ps-cdur[data-day="${d}"]`)?.value };
  });
  const days = privSelectedDays();
  const defTime = document.getElementById('ps-time').value;
  const defDur = document.getElementById('ps-dur').value || 60;
  box.innerHTML = days.length ? days.map(d=>{
    const prev = typed[d] || (existingSlots||[]).find(sl=>sl.weekday===d);
    return `<div class="field-row" style="align-items:center;margin-bottom:6px;">
      <div style="width:90px;font-size:13px;font-weight:600;color:var(--muted);">${DAY_FULL[d]}</div>
      <input class="ps-ctime" data-day="${d}" type="time" value="${prev?.time||defTime}" style="flex:1;">
      <input class="ps-cdur" data-day="${d}" type="number" min="15" step="15" value="${prev?.duration||defDur}" style="width:80px;" title="minutes">
    </div>`;
  }).join('') : `<div class="empty" style="padding:4px 0;">Select at least one day above.</div>`;
}
function privPricingToggle(){
  const t = document.getElementById('ps-ptype')?.value;
  if(!t) return;
  document.getElementById('ps-rate-box').style.display = t==='package' ? 'none' : 'flex';
  document.getElementById('ps-pkg-box').style.display = t==='package' ? 'flex' : 'none';
  const lbl = document.querySelector('#ps-rate-box label');
  if(lbl) lbl.textContent = t==='hourly' ? 'Hourly rate (R$)' : 'Price per lesson (R$)';
}
function savePrivStudent(id){
  const name = document.getElementById('ps-name').value.trim();
  if(!name){ alert('Name is required.'); return; }
  const days = privSelectedDays();
  const defTime = document.getElementById('ps-time').value;
  const defDur = Number(document.getElementById('ps-dur').value)||60;
  const custom = document.getElementById('ps-custom').checked;
  if(days.length && !custom && !defTime){ alert('Please set a lesson time (or clear the selected days).'); return; }

  let slots = [];
  if(days.length){
    if(custom){
      slots = days.map(d=>{
        const t = document.querySelector(`.ps-ctime[data-day="${d}"]`)?.value || defTime;
        const du = Number(document.querySelector(`.ps-cdur[data-day="${d}"]`)?.value)||defDur;
        return { weekday: d, time: t, duration: du };
      }).filter(sl=>sl.time);
    } else {
      slots = days.map(d=>({ weekday: d, time: defTime, duration: defDur }));
    }
  }

  const startDate = document.getElementById('ps-start').value || todayStr();
  const endDate = document.getElementById('ps-end').value || null;
  if(endDate && endDate < startDate){ alert('Last lesson date cannot be before the first lesson date.'); return; }

  let s = id ? privStudent(id) : null;
  const isNew = !s;
  if(isNew){ s = { id: uid(), pinnedSkills: [], studyPoints: [] }; state.privateStudents.push(s); }
  s.name = name;
  sortPrivateStudentStore();   // a new name may belong somewhere else in the list
  s.contactPhone = document.getElementById('ps-phone').value.trim();
  s.cefr = document.getElementById('ps-cefr').value;
  s.isMinor = document.getElementById('ps-minor').checked;
  s.guardianName = document.getElementById('ps-gname')?.value.trim()||'';
  s.guardianPhone = document.getElementById('ps-gphone')?.value.trim()||'';
  s.status = document.getElementById('ps-status').value;
  s.pricingType = document.getElementById('ps-ptype').value;
  s.rate = document.getElementById('ps-rate').value ? Number(document.getElementById('ps-rate').value) : '';
  s.packageSize = document.getElementById('ps-pkgsize').value ? Number(document.getElementById('ps-pkgsize').value) : '';
  s.packagePrice = document.getElementById('ps-pkgprice').value ? Number(document.getElementById('ps-pkgprice').value) : '';
  s.notes = document.getElementById('ps-notes').value;
  s.startDate = startDate;
  s.endDate = endDate;
  s.recurring = slots.length ? slots : null;
  regenerateRecurring(s);
  persistPrivate();
  closeModal();
  refreshView();
}
function deletePrivStudent(id){
  const s = privStudent(id);
  if(!s) return;
  if(!confirm(`Delete "${s.name}" and ALL their lessons, payments, checkpoints and learning points? This cannot be undone.`)) return;
  state.privateStudents = state.privateStudents.filter(x=>x.id!==id);
  state.privateLessons = state.privateLessons.filter(l=>l.studentId!==id);
  state.payments = state.payments.filter(p=>p.studentId!==id);
  state.checkpoints = state.checkpoints.filter(c=>c.studentId!==id);
  state.learningPoints = state.learningPoints.filter(p=>p.studentId!==id);
  try{ localStorage.removeItem(PT_SK_PREFIX + id); }catch(e){}
  persistPrivate();
  closeModal();
  navigate('private');
}

      <div class="pill-group">
        ${PRIV_STATUSES.map(st=>{
          const cl = st==='completed'?'green':st==='no-show'?'red':st==='cancelled'?'':'amber';
          return `<button type="button" class="pill ${cl} ${l.status===st?'on':''}" aria-pressed="${l.status===st}" onclick="rsSetStatus(this,'${st}')">${st}</button>`;
        }).join('')}
      </div>

    </div>

      <button class="icon-btn danger" onclick="deleteLesson('${l.id}')">Delete</button>

function rsSetStatus(el, st){
  el.parentElement.querySelectorAll('.pill').forEach(p=>{ p.classList.remove('on'); p.setAttribute('aria-pressed','false'); });
  el.classList.add('on');
  el.setAttribute('aria-pressed','true');
  document.getElementById('rs-status').value = st;
}
function saveReschedule(lessonId){
  const l = state.privateLessons.find(x=>x.id===lessonId);
  if(!l) return;
  const newDate = document.getElementById('rs-date').value;
  if(!newDate){ alert('Pick a date.'); return; }
  const newTime = document.getElementById('rs-time').value;
  const origDate = l.date, origTime = l.time, wasRecurring = !!l.isRecurring;
  // A time-only move vacates the old slot just as surely as a date move does.
  const slotChanged = newDate !== origDate || (newTime||'') !== (origTime||'');
  l.date = newDate;
  l.time = newTime;
  l.duration = Number(document.getElementById('rs-dur').value)||60;
  l.notes = document.getElementById('rs-notes').value;
  l.status = document.getElementById('rs-status').value;
  if(wasRecurring && slotChanged){
    l.isRecurring = false;                                  // detach so regeneration never overwrites it
    addRecurringSkip(l.studentId, origDate, origTime);      // and never refills the slot it left
  }
  persistPrivate();
  closeModal();
  refreshView();
}

function saveLesson(id){
  const studentId = document.getElementById('pl-student').value;
  if(!studentId){ alert('Pick a student.'); return; }
  let l = id ? state.privateLessons.find(x=>x.id===id) : null;
  const isNew = !l;
  const oldDate = l?.date;
  if(isNew){ l = { id: uid(), isRecurring:false }; state.privateLessons.push(l); }
  l.studentId = studentId;
  l.date = document.getElementById('pl-date').value;
  l.time = document.getElementById('pl-time').value;
  l.duration = Number(document.getElementById('pl-dur').value)||60;
  l.status = document.getElementById('pl-status').value;
  l.notes = document.getElementById('pl-notes').value;
  l.homework = document.getElementById('pl-hw').value;
  l.promise = document.getElementById('pl-promise').value;
  const nxHwEl = document.getElementById('pl-next-hw');
  if(nxHwEl){
    const nx = state.privateLessons.find(x=>x.id===nxHwEl.dataset.lessonId);
    if(nx){
      nx.homework = nxHwEl.value;
      nx.promise = document.getElementById('pl-next-promise').value;
    }
  }
  if(!isNew && l.date!==oldDate) l.isRecurring = false;  // detach manually moved lessons
  persistPrivate();
  closeModal();
  refreshView();
}
function deleteLesson(id){
  const l = state.privateLessons.find(x=>x.id===id);
  if(!l) return;
  const snapshot = {...l};
  const wasRecurring = l.isRecurring;
  let addedSkipKey = null;
  // A recurring occurrence would be regenerated on next load unless we mark the slot.
  if(l.isRecurring){
    const s = privStudent(l.studentId);
    const key = slotKey(l.date, l.time);
    const had = s?.skips?.includes(key);
    addRecurringSkip(l.studentId, l.date, l.time);
    if(!had) addedSkipKey = key;   // only remove on undo if we were the ones who added it
  }
  state.privateLessons = state.privateLessons.filter(x=>x.id!==id);
  persistPrivate();
  closeModal();
  refreshView();
  const name = privStudent(snapshot.studentId)?.name || 'lesson';
  showUndoToast(`Deleted ${name} lesson (${formatDateShort(snapshot.date)})`, ()=>{
    if(addedSkipKey){
      const s = privStudent(snapshot.studentId);
      if(s?.skips) s.skips = s.skips.filter(k=>k!==addedSkipKey);
    }
    if(!state.privateLessons.some(x=>x.id===snapshot.id)) state.privateLessons.push(snapshot);
    persistPrivate();
    refreshView();
  });
}
function setLessonStatus(id, status){
  const l = state.privateLessons.find(x=>x.id===id);
  if(!l) return;
  if((status==='completed' || status==='no-show') && l.date > todayStr()){
    alert('This class is on ' + formatDateShort(l.date) + " — it hasn't happened yet.");
    return;
  }
  l.status = status;
  persistPrivate();
  refreshView();
}

// One-time cleanup: earlier versions seeded empty records just by opening a
// session. Remove any session whose records are all pristine defaults and that
// isn't marked completed — it carries no information but pollutes "awaiting
// completion" and grows the sessions blob. Runs once per load; only writes if
// it actually removed something.
function isDefaultRecord(r){
  const d = defaultRecord();
  if(!r) return true;
  // lateHwOutcome is set separately and meaningful even on an otherwise-default row
  if(r.lateHwOutcome) return false;
  for(const k of Object.keys(d)){
    if(k === 'notes'){ if((r.notes||'').trim() !== '') return false; }
    else if(r[k] !== d[k]) return false;
  }
  return true;
}
function cleanupEmptySessions(){
  let removed = 0;
  for(const key of Object.keys(state.sessions)){
    if(state.sessionMeta && state.sessionMeta[key]?.completed) continue;   // never touch completed
    const recs = state.sessions[key];
    const ids = Object.keys(recs || {});
    if(ids.length === 0){ delete state.sessions[key]; removed++; continue; }
    if(ids.every(id => isDefaultRecord(recs[id]))){ delete state.sessions[key]; removed++; }
  }
  if(removed){ scheduleSave('sessions', state.sessions); }
  return removed;
}
function showLoadError(err){
  dataReady = false;
  document.getElementById('app-main').innerHTML = `

      <button class="btn-accent" onclick="location.reload()">Try again</button>

}

/* ================= PROJECTS =================
   Multi-session projects assigned to a class from the Advanced Hub
   catalogue (/advanced/projects-data.js). This section covers
   assignment, teams and milestone tracking only; grading and report
   output are handled separately.

   A run freezes a copy of the catalogue's milestones at assignment
   time, so editing the catalogue later can never corrupt a run that
   is already under way.                                            */

const PROJ_COLOURS = ['#2dd4bf','#f59e0b','#818cf8','#f472b6','#34d399','#60a5fa','#fb923c','#a78bfa'];

function projCatalogueReady(){ return typeof ADVANCED_PROJECTS !== 'undefined' && Array.isArray(ADVANCED_PROJECTS); }
function projCatalogue(){ return projCatalogueReady() ? ADVANCED_PROJECTS : []; }
function projDef(id){ return projCatalogue().filter(p=>p.id===id)[0] || null; }

function projRuns(){ return Array.isArray(state.projects) ? state.projects : (state.projects = []); }
function projRun(id){ return projRuns().filter(r=>r.id===id)[0] || null; }
function saveProjects(){ scheduleSave('projects', state.projects); }

function projStepTotal(run){
  return (run.milestones||[]).reduce((n,st)=>n+st.steps.length, 0);
}
function projTeamDone(run, teamId){
  const p = (run.progress||{})[teamId] || {};
  let n = 0;
  (run.milestones||[]).forEach(st=>st.steps.forEach(s=>{ if(p[String(s.n)]===2) n++; }));
  return n;
}
function projStageDone(run, teamId, stage){
  const p = (run.progress||{})[teamId] || {};
  let n = 0;
  stage.steps.forEach(s=>{ if(p[String(s.n)]===2) n++; });
  return n;
}
function projNextStep(run, teamId){
  const p = (run.progress||{})[teamId] || {};
  for(const st of (run.milestones||[])){
    for(const s of st.steps){ if(p[String(s.n)]!==2) return { stage: st, step: s }; }
  }
  return null;
}
/* Criteria for a run. Stored on the run at assignment time so grades survive
   a catalogue edit; older runs and a failed catalogue load fall back safely. */
const PROJ_FALLBACK_CRITERIA = [
  { id:'lang',     label:'Language range & accuracy', labelPt:'Linguagem' },
  { id:'task',     label:'Task completion',           labelPt:'Cumprimento' },
  { id:'collab',   label:'Collaboration',             labelPt:'Colaboração' },
  { id:'delivery', label:'Delivery',                  labelPt:'Apresentação' }
];
function projCriteria(run){
  if(run && Array.isArray(run.criteria) && run.criteria.length) return run.criteria;
  const def = run ? projDef(run.projectId) : null;
  if(def && typeof projectCriteria === 'function'){
    return projectCriteria(def).map(c=>({ id:c.id, label:c.label, labelPt:c.labelPt||c.label, project:!!c.project }));
  }
  return PROJ_FALLBACK_CRITERIA;
}
function projBands(critId){
  if(typeof PROJECT_RUBRIC === 'undefined') return null;
  const c = PROJECT_RUBRIC.filter(x=>x.id===critId)[0];
  return c ? c.bands : null;
}
function projStudentScore(run, studentId){
  const scores = (run.scores||{})[studentId]||{};
  const crits = projCriteria(run);
  const vals = crits.map(c=>scores[c.id]).filter(v=>v!=null);
  if(!vals.length) return { avg:null, letter:null, entered:0, of:crits.length };
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  return { avg, letter:numToLetter(avg), entered:vals.length, of:crits.length };
}
/* Everything the report builder needs about one student's projects. */
function projStudentReport(studentId, classId, fromVal, toVal){
  return projRuns()
    .filter(r=>r.classId===classId)
    .filter(r=>{
      if(fromVal && r.endDate && r.endDate < fromVal) return false;
      if(toVal && r.startDate && r.startDate > toVal) return false;
      return true;
    })
    .map(r=>{
      const team = (r.teams||[]).filter(t=>(t.memberIds||[]).includes(studentId))[0];
      if(!team) return null;
      const crits = projCriteria(r);
      const scores = (r.scores||{})[studentId]||{};
      const st = projStudentScore(r, studentId);
      const stagesTotal = (r.milestones||[]).length;
      const stagesDone = (r.milestones||[]).filter(s=>projStageDone(r, team.id, s)===s.steps.length).length;
      return {
        title:r.title, icon:r.icon, startDate:r.startDate, endDate:r.endDate,
        team:team.name, stagesDone, stagesTotal,
        stepsDone:projTeamDone(r, team.id), stepsTotal:projStepTotal(r),
        criteria:crits.map(c=>({ label:c.label, labelPt:c.labelPt||c.label, score:scores[c.id]==null?null:scores[c.id] })),
        letter:st.letter, comment:((r.comment||{})[studentId]||'').trim()
      };
    })
    .filter(Boolean)
    .sort((a,b)=>String(b.startDate||'').localeCompare(String(a.startDate||'')));
}

function projOverallPct(run){
  const teams = run.teams||[];
  if(!teams.length) return 0;
  const total = projStepTotal(run) * teams.length;
  if(!total) return 0;
  const done = teams.reduce((n,t)=>n+projTeamDone(run,t.id), 0);
  return Math.round(done/total*100);
}

/* Count the class's actual meeting days between two dates, so "Day 4 of 8"
   means four lessons, not four calendar days. Falls back to weekdays for a
   class with no timetable set. */
function projShiftDate(ds, n){
  const d = new Date(ds+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function projMeetingDays(cls, fromDate, count){
  const days = cls ? getClassDays(cls) : [];
  const valid = days.length ? days : [1,2,3,4,5];
  const out = [];
  let cur = fromDate, guard = 0;
  while(out.length < count && guard < 400){
    const dow = new Date(cur+'T00:00:00').getDay();
    if(valid.includes(dow) && !getHoliday(cur)) out.push(cur);
    cur = projShiftDate(cur, 1);
    guard++;
  }
  return out;
}
/* Where the class should be today, versus where a team actually is. */
function projSchedule(run){
  const cls = classById(run.classId);
  const total = Math.max(1, Math.round(run.hours || projStepTotal(run)/4));
  const days = projMeetingDays(cls, run.startDate || todayStr(), total);
  const today = todayStr();
  let dayNo = 0;
  days.forEach(d=>{ if(d <= today) dayNo++; });
  // Which stage should be in progress on that day, by cumulative stage hours.
  let acc = 0, expected = 0;
  (run.milestones||[]).forEach((st,i)=>{ if(dayNo > acc) expected = i; acc += (st.hours||1); });
  return { dayNo, total: days.length, endDate: days[days.length-1] || null, expectedStage: expected };
}
function projTeamStageIdx(run, teamId){
  const nx = projNextStep(run, teamId);
  if(!nx) return (run.milestones||[]).length - 1;
  return (run.milestones||[]).findIndex(st=>st.id===nx.stage.id);
}

}

function closeProjectBoard(){ state.projOpenId = null; refreshView(); window.scrollTo(0,0); }

function _renderProjectBoard(el, run){
  const cls = classById(run.classId);
  const sch = projSchedule(run);
  const stages = run.milestones||[];
  const teams = run.teams||[];
  const total = projStepTotal(run);

  const grid = !teams.length ? `<div class="card empty-card">No teams yet — add one below.</div>` : `
    <div class="table-wrap" style="margin-bottom:18px;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr>
          <th style="text-align:left;padding:10px;">Team</th>
          ${stages.map((st,i)=>`<th style="padding:10px;text-align:center;font-size:11px;">${i+1}. ${esc(st.name)}</th>`).join('')}
          <th style="padding:10px;text-align:center;">Overall</th>
        </tr></thead>
        <tbody>
          ${teams.map(t=>{
            const done = projTeamDone(run, t.id);
            const pct = total?Math.round(done/total*100):0;
            const idx = projTeamStageIdx(run, t.id);
            const late = idx < sch.expectedStage && sch.dayNo>0 && pct<100;
            return `<tr>
              <td style="padding:10px;">
                <span style="display:inline-flex;align-items:center;gap:7px;font-weight:700;">
                  <span style="width:9px;height:9px;border-radius:50%;background:${esc(t.colour||'#2dd4bf')};"></span>${esc(t.name)}
                </span>
                ${late?'<span class="badge" style="margin-left:6px;">behind</span>':''}
              </td>
              ${stages.map(st=>{
                const d = projStageDone(run, t.id, st);
                const a = st.steps.length;
                return `<td style="padding:10px;text-align:center;">
                  <b style="color:${d===a?'var(--accent)':d>0?'var(--amber,#f59e0b)':'var(--muted)'};">${d}/${a}</b>
                  <div style="height:4px;border-radius:3px;background:var(--border);margin-top:4px;overflow:hidden;"><div style="height:100%;width:${Math.round(d/a*100)}%;background:var(--accent);"></div></div>
                </td>`;
              }).join('')}
              <td style="padding:10px;text-align:center;"><b>${pct}%</b></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;

  el.innerHTML = `
    <div class="topbar">
      <div>
        <button class="btn-ghost small" onclick="closeProjectBoard()" style="margin-bottom:8px;">← All projects</button>
        <h1>${esc(run.icon||'')} ${esc(run.title||run.projectId)}</h1>
        <div class="meta">${esc(cls?cls.name:'Class removed')} ·
          ${run.startDate?formatDateLong(run.startDate):'no start date'}${sch.endDate?` → ${formatDateShort(sch.endDate)}`:''} ·
          ${sch.dayNo>0?`Day ${Math.min(sch.dayNo,sch.total)} of ${sch.total}`:`starts in ${sch.total} lesson${sch.total===1?'':'s'}`}
        </div>
      </div>
      <div class="no-print" style="display:flex;gap:10px;">
        <button class="btn-ghost" onclick="openProjTeamModal('${run.id}')">+ Add team</button>
      </div>
    </div>

    ${grid}

    ${projUnassignedPanel(run)}

    ${teams.map(t=>projTeamPanel(run, t)).join('')}

    ${!teams.length?'':`<p class="meta" style="margin-top:18px;">Click a step to cycle it: not started → in progress → done.</p>`}
  `;
}

/* Students in the class who are not on any team in this run. */
function projUnassigned(run){
  const on = {};
  (run.teams||[]).forEach(t=>(t.memberIds||[]).forEach(id=>{ on[id]=1; }));
  return studentsInClass(run.classId).filter(s=>!on[s.id]);
}
function projUnassignedPanel(run){
  const left = projUnassigned(run);
  if(!left.length || !(run.teams||[]).length) return '';
  return `
    <div class="card section" style="margin-bottom:12px;border-left:4px solid var(--amber,#f59e0b);">
      <h3 style="margin-top:0;">Not in a team yet <span class="meta" style="font-weight:400;">(${left.length})</span></h3>
      ${left.map(s=>`
        <div style="display:flex;align-items:center;gap:10px;padding:6px 0;">

          <select onchange="projMoveStudent('${run.id}','${s.id}',this.value)" style="width:auto;min-width:150px;padding:5px 8px;font-size:13px;">
            <option value="">Add to team…</option>
            ${(run.teams||[]).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}
          </select>
        </div>`).join('')}
    </div>`;
}
function projMoveStudent(runId, studentId, teamId){
  if(!teamId) return;
  const run = projRun(runId); if(!run) return;
  (run.teams||[]).forEach(t=>{ t.memberIds = (t.memberIds||[]).filter(id=>id!==studentId); });
  const target = (run.teams||[]).filter(t=>t.id===teamId)[0];
  if(target) target.memberIds.push(studentId);
  saveProjects();
  refreshView();
}

            <textarea placeholder="Observations for this stage…" rows="2"
              onchange="projSetNote('${run.id}','${team.id}','${st.id}',this.value)"
              style="width:100%;margin-top:8px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;">${esc(notes[st.id]||'')}</textarea>
          </div>`;
        }).join('')}
        ${projTeamGrades(run, team)}
      </div>`}
  </div>`;
}

/* Grading is per student, not per team: collaboration and delivery are
   individual even when the deliverables are shared. */
function projTeamGrades(run, team){
  const members = (team.memberIds||[]).map(id=>state.students.filter(x=>x.id===id)[0]).filter(Boolean);
  if(!members.length) return '';
  const crits = projCriteria(run);
  const scores = run.scores||{};
  const comments = run.comment||{};
  return `
    <div style="border-top:1px solid var(--border);padding-top:14px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <b style="font-size:13px;">Grades</b>
        <span class="meta">1 Below · 2 Approaching · 3 Meets · 4 Exceeds</span>
        <button class="btn-ghost small" style="margin-left:auto;" onclick="projLogAsActivity('${run.id}','${team.id}')">Log as graded activity</button>
      </div>
      ${members.map(s=>{
        const sc = scores[s.id]||{};
        const st = projStudentScore(run, s.id);
        return `
        <div style="border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:10px;">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px;">
            <b style="font-size:14px;">${esc(s.name)}</b>
            <span class="meta">${st.entered}/${st.of} scored</span>
            ${st.letter?`<span class="badge" style="margin-left:auto;font-size:14px;">${st.letter}</span>`:'<span class="meta" style="margin-left:auto;">not graded</span>'}
          </div>
          ${crits.map(c=>{
            const bands = projBands(c.id);
            const cur = sc[c.id]||null;
            return `<div style="display:flex;align-items:center;gap:9px;padding:4px 0;">
              <span style="flex:1;font-size:12.5px;color:${c.project?'var(--accent)':'var(--muted)'};">${esc(c.label)}</span>
              <span style="display:flex;gap:4px;">
                ${[1,2,3,4].map(v=>`<button type="button"
                    title="${esc(bands?bands[v-1]:'')}"
                    onclick="projSetScore('${run.id}','${s.id}','${c.id}',${v})"
                    style="width:28px;height:26px;border-radius:6px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
                      border:1px solid ${cur===v?'var(--accent)':'var(--border)'};
                      background:${cur===v?'var(--accent)':'transparent'};
                      color:${cur===v?'#fff':'var(--muted)'};">${v}</button>`).join('')}
              </span>
            </div>`;
          }).join('')}
          <textarea rows="2" placeholder="Comment for the report card…"
            onchange="projSetComment('${run.id}','${s.id}',this.value)"
            style="width:100%;margin-top:9px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;">${esc(comments[s.id]||'')}</textarea>
        </div>`;
      }).join('')}
    </div>`;
}

function projSetScore(runId, studentId, critId, v){
  const run = projRun(runId); if(!run) return;
  run.scores = run.scores||{};
  run.scores[studentId] = run.scores[studentId]||{};
  if(run.scores[studentId][critId] === v) delete run.scores[studentId][critId];   // tap again to clear
  else run.scores[studentId][critId] = v;
  saveProjects();
  refreshView();
}
function projSetComment(runId, studentId, val){
  const run = projRun(runId); if(!run) return;
  run.comment = run.comment||{};
  const t = (val||'').trim();
  if(t) run.comment[studentId] = t; else delete run.comment[studentId];
  saveProjects();
}
/* Push the finished project into the Activities log so it counts towards the
   existing skill averages. Opt-in, because not every project should. */
function projLogAsActivity(runId, teamId){
  const run = projRun(runId); if(!run) return;
  const team = (run.teams||[]).filter(t=>t.id===teamId)[0]; if(!team) return;
  const members = (team.memberIds||[]).filter(id=>projStudentScore(run, id).letter);
  if(!members.length){ alert('Score at least one student on this team first.'); return; }
  if(!confirm(`Add "${run.title}" to the Activities log as a speaking activity, with ${members.length} grade(s)?`)) return;
  const grades = {};
  members.forEach(id=>{ grades[id] = projStudentScore(run, id).letter; });
  if(!state.activities) state.activities = [];
  state.activities.push({ id: uid(), classId: run.classId, date: todayStr(), skill: 'speaking',
    description: 'Project: ' + run.title + ' (' + team.name + ')', grades, notes: {}, ts: Date.now() });
  scheduleSave('activities', state.activities);
  alert('Added to Activities.');
}

function projToggleTeam(id){
  state.projOpenTeamId = state.projOpenTeamId===id ? null : id;
  refreshView();
}

/* ---------- mutations ---------- */
function projCycleStep(runId, teamId, n){
  const run = projRun(runId); if(!run) return;
  run.progress = run.progress || {};
  run.progress[teamId] = run.progress[teamId] || {};
  const cur = run.progress[teamId][String(n)] || 0;
  const next = (cur + 1) % 3;
  if(next === 0) delete run.progress[teamId][String(n)];
  else run.progress[teamId][String(n)] = next;
  saveProjects();
  refreshView();
}
function projSetNote(runId, teamId, stageId, val){
  const run = projRun(runId); if(!run) return;
  run.notes = run.notes || {};
  run.notes[teamId] = run.notes[teamId] || {};
  const t = (val||'').trim();
  if(t) run.notes[teamId][stageId] = t; else delete run.notes[teamId][stageId];
  saveProjects();
}
function projArchiveToggle(id){
  const run = projRun(id); if(!run) return;
  run.status = run.status==='archived' ? 'active' : 'archived';
  saveProjects(); refreshView();
}
function projDeleteRun(id){
  const run = projRun(id); if(!run) return;
  if(!confirm(`Delete "${run.title||run.projectId}" and all its progress and observations?\n\nThis cannot be undone.`)) return;
  state.projects = projRuns().filter(r=>r.id!==id);
  if(state.projOpenId===id) state.projOpenId = null;
  saveProjects(); refreshView();
}
function projDeleteTeam(runId, teamId){
  const run = projRun(runId); if(!run) return;
  const t = (run.teams||[]).filter(x=>x.id===teamId)[0];
  if(!confirm(`Remove ${t?t.name:'this team'} and its progress?`)) return;
  run.teams = (run.teams||[]).filter(x=>x.id!==teamId);
  if(run.progress) delete run.progress[teamId];
  if(run.notes) delete run.notes[teamId];
  if(state.projOpenTeamId===teamId) state.projOpenTeamId = null;
  saveProjects(); refreshView();
}

/* ---------- assign ---------- */
function openAssignProjectModal(){
  projAssignPicks = {};
  if(!projCatalogueReady()){ alert('The project catalogue has not loaded. Check your connection and reload the page.'); return; }
  const classes = activeClasses();
  if(!classes.length){ alert('Add a class first.'); return; }
  const adv = classes.filter(c=>isAdvancedLevel(c.level));
  const ordered = adv.concat(classes.filter(c=>!isAdvancedLevel(c.level)));
  const projOpts = projCatalogue().map(p=>
    `<option value="${p.id}">${p.icon} ${esc(p.title)} — ${esc(p.level)}, ${p.hours}h, ${projectStepCount(p)} steps</option>`).join('');
  const classOpts = ordered.map(c=>
    `<option value="${c.id}">${esc(c.name)}${isAdvancedLevel(c.level)?'':' ('+esc(c.level||'')+')'}</option>`).join('');

  showModal(`${sizeModal('md')}
    <h2>Assign a project</h2>
    <p class="meta" style="margin:6px 0 18px;">The milestones are copied into this assignment, so later edits to the catalogue will not change a project already under way.</p>
    <div class="field" style="margin-bottom:12px;">
      <label>Project</label>
      <select id="ap-project" onchange="projAssignPreview()" style="width:100%;">${projOpts}</select>
    </div>
    <div class="field" style="margin-bottom:12px;">
      <label>Class</label>
      <select id="ap-class" onchange="projAssignClassChanged()" style="width:100%;">${classOpts}</select>
    </div>
    <div class="modal-row" style="display:flex;gap:12px;margin-bottom:12px;">
      <div class="field" style="flex:1;">
        <label>Start date</label>
        <input type="date" id="ap-start" value="${todayStr()}" onchange="projAssignPreview()" style="width:100%;">
      </div>
      <div class="field" style="flex:1;">
        <label>Number of teams</label>
        <input type="number" id="ap-teams" min="1" max="12" value="3" onchange="projAssignTeamCount()" style="width:100%;">
      </div>
    </div>
    <div class="card section" id="ap-preview" style="margin-bottom:14px;"></div>
    <div class="field">
      <label>Who goes in which team</label>
      <div id="ap-roster"></div>
    </div>
    <div class="modal-actions" style="display:flex;gap:10px;justify-content:flex-end;">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-accent" onclick="projAssignConfirm()">Assign project</button>
    </div>
  `);
  projAssignPreview();
}

/* Team membership is chosen by the teacher, never guessed.
   projAssignPicks maps studentId -> team index; absent means unassigned. */
let projAssignPicks = {};

function projAssignTeamN(){
  const el = document.getElementById('ap-teams');
  return Math.max(1, Math.min(12, Number(el ? el.value : 3) || 1));
}
function projAssignTeamCount(){
  const n = projAssignTeamN();
  Object.keys(projAssignPicks).forEach(id=>{ if(projAssignPicks[id] >= n) delete projAssignPicks[id]; });
  projAssignPreview();
}
function projAssignSetPick(studentId, val){
  if(val === '') delete projAssignPicks[studentId];
  else projAssignPicks[studentId] = Number(val);
  projAssignPreview();
}
function projAssignClearPicks(){ projAssignPicks = {}; projAssignPreview(); }
function projAssignSplitEven(){
  const cls = classById(document.getElementById('ap-class').value);
  const n = projAssignTeamN();
  projAssignPicks = {};
  (cls ? studentsInClass(cls.id) : []).forEach((s,i)=>{ projAssignPicks[s.id] = i % n; });
  projAssignPreview();
}
function projAssignClassChanged(){ projAssignPicks = {}; projAssignPreview(); }

function projAssignPreview(){
  const box = document.getElementById('ap-preview');
  const rosterBox = document.getElementById('ap-roster');
  if(!box) return;
  const p = projDef(document.getElementById('ap-project').value);
  const cls = classById(document.getElementById('ap-class').value);
  const start = document.getElementById('ap-start').value || todayStr();
  const n = projAssignTeamN();
  if(!p){ box.innerHTML = ''; if(rosterBox) rosterBox.innerHTML = ''; return; }

  const roster = cls ? studentsInClass(cls.id) : [];
  const days = projMeetingDays(cls, start, p.hours);
  const placed = roster.filter(s=>projAssignPicks[s.id]!=null).length;

  box.innerHTML = `
    <div style="font-size:13px;line-height:1.7;">
      <b>${p.icon} ${esc(p.title)}</b> — ${esc(p.level)}, ${p.stages.length} stages, ${projectStepCount(p)} steps<br>
      <span class="meta">${esc(p.hook)}</span><br><br>
      <b>${p.hours}</b> lessons at one hour a day${days.length?`, ending <b>${formatDateShort(days[days.length-1])}</b>`:''}<br>
      <b>${placed}</b> of <b>${roster.length}</b> student${roster.length===1?'':'s'} placed into <b>${n}</b> team${n===1?'':'s'}<br>
      <span class="meta">Suggested team size for this project: ${esc(p.teamSize)}</span>
    </div>`;

  if(!rosterBox) return;
  if(!roster.length){ rosterBox.innerHTML = '<p class="meta">This class has no students yet.</p>'; return; }

  const counts = [];
  for(let i=0;i<n;i++) counts.push(roster.filter(s=>projAssignPicks[s.id]===i).length);

  rosterBox.innerHTML = `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;align-items:center;">
      ${counts.map((c,i)=>`<span style="font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;
        border:1px solid ${PROJ_COLOURS[i%PROJ_COLOURS.length]};color:${PROJ_COLOURS[i%PROJ_COLOURS.length]};">Team ${i+1}: ${c}</span>`).join('')}
      ${placed<roster.length?`<span class="meta">${roster.length-placed} still unassigned</span>`:''}
    </div>
    <div style="max-height:270px;overflow:auto;border:1px solid var(--border);border-radius:9px;">
      ${roster.map((s,idx)=>{
        const cur = projAssignPicks[s.id];
        const col = cur!=null ? PROJ_COLOURS[cur%PROJ_COLOURS.length] : null;
        return `<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;${idx?'border-top:1px solid var(--border);':''}">
          <span style="width:9px;height:9px;border-radius:50%;flex-shrink:0;background:${col||'transparent'};border:1px solid ${col||'var(--border)'};"></span>
          <span style="flex:1;font-size:14px;">${esc(s.name)}</span>
          <select onchange="projAssignSetPick('${s.id}', this.value)" style="width:auto;min-width:132px;padding:5px 8px;font-size:13px;">
            <option value="" ${cur==null?'selected':''}>— Unassigned</option>
            ${Array.from({length:n}, (_,i)=>`<option value="${i}" ${cur===i?'selected':''}>Team ${i+1}</option>`).join('')}
          </select>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:9px;">
      <button type="button" class="btn-ghost small" onclick="projAssignSplitEven()">Split evenly</button>
      <button type="button" class="btn-ghost small" onclick="projAssignClearPicks()">Clear all</button>
    </div>`;
}

function projAssignConfirm(){
  const p = projDef(document.getElementById('ap-project').value);
  const classId = document.getElementById('ap-class').value;
  const start = document.getElementById('ap-start').value || todayStr();
  const nTeams = Math.max(1, Math.min(12, Number(document.getElementById('ap-teams').value)||1));
  if(!p || !classId){ alert('Choose a project and a class.'); return; }

  const roster = studentsInClass(classId);
  const teams = [];
  for(let i=0;i<nTeams;i++){
    teams.push({ id: uid(), name: 'Team '+(i+1), colour: PROJ_COLOURS[i%PROJ_COLOURS.length], memberIds: [] });
  }
  // Only the students the teacher actually placed. The rest stay unassigned
  // and are listed on the board until they are put somewhere.
  roster.forEach(s=>{
    const t = projAssignPicks[s.id];
    if(t!=null && teams[t]) teams[t].memberIds.push(s.id);
  });
  const unplaced = roster.length - Object.keys(projAssignPicks).filter(id=>roster.some(s=>s.id===id)).length;
  if(unplaced > 0 && !confirm(`${unplaced} student${unplaced===1?' is':'s are'} not in a team yet.\n\nAssign the project anyway? You can add them from the board.`)) return;

  const cls = classById(classId);
  const days = projMeetingDays(cls, start, p.hours);

  const run = {
    id: uid(),
    projectId: p.id,
    projectVersion: p.version || 1,
    title: p.title,
    icon: p.icon,
    level: p.level,
    hours: p.hours,
    classId: classId,
    startDate: start,
    endDate: days.length ? days[days.length-1] : null,
    milestones: JSON.parse(JSON.stringify(p.stages)),   // frozen copy
    criteria: projectCriteria(p).map(c=>({ id:c.id, label:c.label, labelPt:c.labelPt||c.label, project:!!c.project })),
    teams: teams,
    progress: {},
    notes: {},
    scores: {},
    comment: {},
    status: 'active',
    ts: Date.now()
  };
  projRuns().push(run);
  saveProjects();
  closeModal();
  state.projOpenId = run.id;
  refreshView();
}

/* ---------- team editor ---------- */
function openProjTeamModal(runId, teamId){
  const run = projRun(runId); if(!run) return;
  const team = teamId ? (run.teams||[]).filter(t=>t.id===teamId)[0] : null;
  const roster = studentsInClass(run.classId);
  // A student already on another team in this run is shown but flagged.
  const taken = {};
  (run.teams||[]).forEach(t=>{ if(!team || t.id!==team.id) (t.memberIds||[]).forEach(id=>{ taken[id]=t.name; }); });

  showModal(`${sizeModal('md')}
    <h2>${team?'Edit team':'Add team'}</h2>
    <div class="field" style="margin-bottom:12px;">
      <label>Team name</label>
      <input type="text" id="tm-name" value="${esc(team?team.name:'Team '+((run.teams||[]).length+1))}" style="width:100%;">
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label>Colour</label>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;" id="tm-colours">
        ${PROJ_COLOURS.map(c=>`<button type="button" class="swatch" data-c="${c}" onclick="projPickColour('${c}')"
          style="width:26px;height:26px;border-radius:50%;background:${c};border:2px solid ${ (team?team.colour:PROJ_COLOURS[0])===c ? 'var(--text,#111)' : 'transparent'};cursor:pointer;"></button>`).join('')}
      </div>
      <input type="hidden" id="tm-colour" value="${esc(team?team.colour:PROJ_COLOURS[(run.teams||[]).length%PROJ_COLOURS.length])}">
    </div>
    <div class="field">
      <label>Members</label>
      ${roster.length===0?'<p class="meta">This class has no students yet.</p>':`
      <div style="max-height:260px;overflow:auto;border:1px solid var(--border);border-radius:9px;padding:8px;margin-top:6px;">
        ${roster.map(s=>{
          const on = team && (team.memberIds||[]).includes(s.id);
          return `<label style="display:flex;align-items:center;gap:10px;padding:7px 6px;font-size:14px;cursor:pointer;border-radius:7px;">
            <input type="checkbox" class="tm-mem" value="${s.id}" ${on?'checked':''}>
            <span style="flex:1;text-align:left;">${esc(s.name)}</span>
            ${taken[s.id]?`<span class="meta" style="white-space:nowrap;">on ${esc(taken[s.id])}</span>`:''}
          </label>`;
        }).join('')}
      </div>`}
    </div>
    <div class="modal-actions" style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-accent" onclick="projSaveTeam('${runId}'${team?`,'${team.id}'`:''})">Save team</button>
    </div>
  `);
}
function projPickColour(c){
  const hid = document.getElementById('tm-colour'); if(hid) hid.value = c;
  document.querySelectorAll('#tm-colours .swatch').forEach(b=>{
    b.style.borderColor = b.dataset.c===c ? 'var(--text,#111)' : 'transparent';
  });
}
function projSaveTeam(runId, teamId){
  const run = projRun(runId); if(!run) return;
  const name = (document.getElementById('tm-name').value||'').trim() || 'Team';
  const colour = document.getElementById('tm-colour').value || PROJ_COLOURS[0];
  const members = [...document.querySelectorAll('.tm-mem:checked')].map(i=>i.value);
  let team = teamId ? (run.teams||[]).filter(t=>t.id===teamId)[0] : null;
  if(!team){ team = { id: uid(), memberIds: [] }; run.teams = run.teams||[]; run.teams.push(team); }
  team.name = name; team.colour = colour; team.memberIds = members;
  // A student can only be on one team per run.
  (run.teams||[]).forEach(t=>{
    if(t.id===team.id) return;
    t.memberIds = (t.memberIds||[]).filter(id=>!members.includes(id));
  });
  saveProjects();
  closeModal();
  refreshView();
}


/* ---------- session bootstrap ---------- */
(async function bootstrap(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    currentUser = session.user;
    await enterApp();
  }
})();
</script>
