  return `<div>
    <div style="display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;">
      <span class="meta" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;">Sessions</span>
      <span style="font-size:12.5px;flex:1 1 200px;">${esc(summary)}</span>
      <button class="btn-ghost small" onclick="pmToggleTimes()">${pmShowTimes?'Hide times':'Edit times'}</button>
    </div>
    ${pmShowTimes ? `<div style="display:flex;flex-direction:column;gap:5px;margin-top:8px;">
      ${evs.map(e=>{ const t = clubSessionTime(e); const cl = e.classId?classById(e.classId):null; return `
        <div style="display:flex;align-items:center;gap:7px;font-size:12.5px;">
          <span style="min-width:96px;">${pmDayEn(e.date)} ${pmShortDate(e.date)}</span>
          <input type="time" value="${esc(t.from)}" onchange="setClubTime('${e.id}','from',this.value)"
            style="border:1px solid var(--border);border-radius:7px;padding:4px 6px;font-size:12px;background:var(--surface);color:var(--text);">
          <input type="time" value="${esc(t.to)}" onchange="setClubTime('${e.id}','to',this.value)"
            style="border:1px solid var(--border);border-radius:7px;padding:4px 6px;font-size:12px;background:var(--surface);color:var(--text);">
          <span class="meta" style="font-size:11px;">${esc(e.title)}${cl?` · ${esc(cl.name)}`:''}</span>
        </div>`; }).join('')}
    </div>` : ''}
  </div>`;
}
function pmToggleTimes(){ pmShowTimes = !pmShowTimes; pmRegenerate(true); }

/* Different groups get different sessions and different framing, so the
   teacher narrows the list here and works one batch at a time. */
function pmStudentPickerHtml(){
  const roster = pmRoster();
  if(roster.length < 2) return '';
  const all = roster.map(id=>state.students.find(s=>s.id===id)).filter(Boolean);
  const chosenIds = new Set(pmChosen().map(s=>s.id));
  const every = chosenIds.size === all.length;
  return `<div class="card section" style="padding:11px 14px;margin-bottom:12px;">
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <span class="meta" style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-right:2px;">Students</span>
      ${all.map(s=>{ const on = chosenIds.has(s.id); const c = classById(s.classId); return `
        <button class="btn-ghost small" onclick="pmToggleStudent('${s.id}')" title="${esc(c?c.name:'')}"
          style="${on?'border-color:var(--accent);color:var(--accent);font-weight:700;':'opacity:.55;'}">
          ${on?'✓ ':''}${esc(pmFirstName(s.name))}
        </button>`; }).join('')}
      <button class="btn-ghost small" style="margin-left:4px;" onclick="pmSelectAll(${every?'false':'true'})">${every?'None':'All'}</button>
    </div>
  </div>`;
}
function pmToggleStudent(id){
  const cur = new Set(pmChosen().map(s=>s.id));
  if(cur.has(id)) cur.delete(id); else cur.add(id);
  pmSelected = cur;
  pmRegenerate(true);
}
function pmSelectAll(on){
  pmSelected = on ? null : new Set();
  pmRegenerate(true);
}

function pmCardHtml(s, i){
  const cfg = clubSettings();
  const d = parentMsgStats(s);
  const cls = d.cls;
  const fem = pmGenderOf(s) === 'f';
  return `
    <div class="card section" style="padding:14px 16px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
        ${cls?`<span class="color-dot" style="background:${cls.color}"></span>`:''}
        <b style="font-size:15px;">${esc(s.name)}</b>
        <span class="meta" style="font-size:12px;">${cls?esc(cls.name)+' · '+esc(cls.level||''):'—'}</span>
        <div style="margin-left:auto;display:flex;gap:6px;align-items:center;">
          <span class="meta" style="font-size:11px;">Refer to as</span>
          <button class="btn-ghost small" style="${fem?'':'border-color:var(--accent);color:var(--accent);'}" onclick="pmSetGender('${s.id}','m')">ele</button>
          <button class="btn-ghost small" style="${fem?'border-color:var(--accent);color:var(--accent);':''}" onclick="pmSetGender('${s.id}','f')">ela</button>
        </div>
      </div>
      <div class="meta" style="font-size:11.5px;margin-bottom:9px;">${esc(pmFactsLine(d))}</div>
      ${cfg.kind==='club' ? pmChipsHtml(s) : ''}
      <textarea id="pm-txt-${i}" rows="14" style="width:100%;resize:vertical;font-family:inherit;font-size:13px;line-height:1.55;padding:11px;border:1px solid var(--border);border-radius:var(--radius-sm,8px);background:var(--surface);color:var(--text);">${esc(buildParentMessage(s))}</textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px;">
        <button class="btn-ghost small" id="pm-copy-${i}" onclick="pmCopyOne(${i})">Copy</button>
        <button class="btn-accent small" onclick="pmMarkDone('${s.id}',${i})" title="Log this message on the student's report, stamp it with today's date, and clear the English Club reminder">✓ Sent — mark done</button>
      </div>
    </div>`;
}

function pmChipsHtml(s){
  const avail = clubEventsFor(s);
  if(!avail.length) return '';
  const picked = new Set(pmPicked(s).map(e=>e.id));
  const allOn = picked.size === avail.length;
  return `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px;">
    <span class="meta" style="font-size:11px;">Invite to (${picked.size}/${avail.length}):</span>
    ${avail.map(e=>{ const on = picked.has(e.id); const t = clubTimeFor(e, s); return `
      <button class="btn-ghost small" onclick="pmTogglePick('${s.id}','${e.id}')"
        title="${esc(e.title)} · ${esc(t.from)}–${esc(t.to)}"
        style="${on?'border-color:var(--accent);color:var(--accent);font-weight:700;':'opacity:.62;'}">
        ${on?'✓ ':''}${pmDayEn(e.date)} ${pmShortDate(e.date)}
      </button>`; }).join('')}
    <button class="btn-ghost small" style="margin-left:4px;" onclick="pmPickAll('${s.id}',${allOn?'false':'true'})">${allOn?'Clear':'All'}</button>
  </div>`;
}

/* Only the message bodies are repainted on a settings change. Rebuilding the
   whole screen would yank focus out of the very field the teacher just edited,
   and the controls already hold the new value — they are what changed. */
function pmRegenerate(full){
  if(!document.getElementById('pm-list')) return;     // screen not open
  if(full){
    const y = window.scrollY;
    renderParentMessages();
    window.scrollTo(0, y);
    return;
  }
  document.getElementById('pm-list').innerHTML = pmChosen().map((s,i)=>pmCardHtml(s,i)).join('');
}

/* Marking a message done is the point where it stops being a draft: it goes on
   the student's record with the date and time it was sent, and the English Club
   reminder that raised it is cleared. Undoable, because a mis-click here would
   otherwise mean re-typing the whole thing. */
function pmMarkDone(studentId, i){
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return;
  const ta = document.getElementById('pm-txt-'+i);
  const text = ta ? ta.value.trim() : buildParentMessage(s);
  if(!text) return;
  const cfg = clubSettings();
  const picks = pmPicked(s);
  const when = new Date();
  const stamp = `${pad(when.getDate())}/${pad(when.getMonth()+1)} ${pad(when.getHours())}:${pad(when.getMinutes())}`;
  const sessions = picks.length
    ? picks.map(e=>{ const t = clubTimeFor(e, s); return `${pmShortDate(e.date)} ${t.from}–${t.to}`; }).join(', ')
    : (cfg.date ? `${pmShortDate(cfg.date)} ${cfg.from}–${cfg.to}` : '');
  const category = cfg.kind === 'club' ? 'English Club' : 'Grades';
  const reason = cfg.kind === 'club'
    ? `WhatsApp invitation sent ${stamp}${picks.length>1?` · ${picks.length} sessions`:''}${sessions?` · ${sessions}`:''}`
    : `WhatsApp performance update sent ${stamp}`;

  const before = { englishClub: !!s.englishClub, contactParents: s.contactParents || null };
  if(!s.contactParentsHistory) s.contactParentsHistory = [];
  const entry = { id: uid(), date: todayStr(), sentAt: when.toISOString(), channel: 'WhatsApp',
                  category, reason, summary: text };
  s.contactParentsHistory.unshift(entry);
  s.englishClub = false;
  // A hand-raised Contact Parents flag for the same thing is now answered.
  if(s.contactParents && s.contactParents.category === category) s.contactParents = null;
  scheduleSave('students', state.students);

  pmExtraIds = pmExtraIds.filter(id=>id!==studentId);
  if(pmSelected) pmSelected.delete(studentId);
  refreshView();

  showUndoToast(`Logged for ${pmFirstName(s.name)} — English Club reminder cleared`, ()=>{
    s.contactParentsHistory = (s.contactParentsHistory||[]).filter(h=>h.id!==entry.id);
    s.englishClub = before.englishClub;
    s.contactParents = before.contactParents;
    if(pmSelected) pmSelected.add(studentId);
    scheduleSave('students', state.students);
    refreshView();
  });
}

function pmCopyText(text, btn, label){
  const done = ()=>{ if(btn){ const old = btn.textContent; btn.textContent = label; setTimeout(()=>{ if(btn) btn.textContent = old; }, 1500); } };
  const fallback = ()=>{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ alert('Select the text and copy manually.'); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
  else fallback();
}
function pmCopyOne(i){
  const ta = document.getElementById('pm-txt-'+i);
  if(!ta) return;
  pmCopyText(ta.value, document.getElementById('pm-copy-'+i), 'Copied ✓');
}
function pmCopyAll(btn){
  const parts = pmChosen().map((s,i)=>{
    const ta = document.getElementById('pm-txt-'+i);
    return `— ${s.name} —\n${ta?ta.value:''}`;
  });
  pmCopyText(parts.join('\n\n\n'), btn, 'Copied ✓');
}

/* ---------- transfer student between classes ---------- */
function openTransferModal(studentId){
  const st = state.students.find(x=>x.id===studentId);
  if(!st) return;
  const cur = classById(st.classId);
  const targets = activeClasses().filter(c=>c.id!==st.classId);
  if(!targets.length){ alert('There is no other active class to transfer to.'); return; }
  showModal(`${sizeModal('md')}
    <h3>⇄ Transfer ${esc(st.name)}</h3>
    <div style="font-size:13px;color:var(--muted);margin:-6px 0 14px;">
      Currently in <b>${cur?esc(cur.name):'—'}</b>. Past roll call records stay attached to the old class and still appear on this student's report.
    </div>
    <div class="field"><label>Transfer to</label>
      <select id="tr-class">
        ${targets.map(c=>`<option value="${c.id}">${esc(c.name)} · ${scheduleLabel(c)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Effective from</label><input id="tr-date" type="date" value="${todayStr()}"></div>
    <div style="font-size:12px;color:var(--muted);margin:-6px 0 12px;">Sessions on or after this date count toward the new class.</div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-accent" onclick="transferStudent('${st.id}')">Transfer</button>
    </div>
  `);
}
function transferStudent(studentId){
  const st = state.students.find(x=>x.id===studentId);
  if(!st) return;
  const newClassId = document.getElementById('tr-class').value;
  const fromDate = document.getElementById('tr-date').value || todayStr();
  if(newClassId===st.classId){ closeModal(); return; }
  const newCls = classById(newClassId);
  if(!confirm(`Transfer ${st.name} to "${newCls.name}" starting ${formatDateShort(fromDate)}?`)) return;

  // close current enrollment the day before the transfer, open the new one
  const en = enrollmentsOf(st).map(e=>({...e}));
  const open = en.find(e=>!e.to);
  const prevDay = new Date(fromDate+'T00:00:00');
  prevDay.setDate(prevDay.getDate()-1);
  const prevStr = dateToStr(prevDay.getFullYear(), prevDay.getMonth(), prevDay.getDate());
  if(open) open.to = prevStr;
  en.push({ classId: newClassId, from: fromDate, to: null });

  st.enrollments = en;
  st.classId = newClassId;
  scheduleSave('students', state.students);
  closeModal();
  refreshView();
}
/* Renaming keeps the same student record, so attendance, grades, notes,
   points and report history all follow the new name. */
function openRenameStudentModal(studentId){
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return;
  const cls = classById(s.classId);
  showModal(`${sizeModal('md')}
    <h3>Rename student</h3>
    <div class="field">
      <label for="rs-name">Name</label>
      <input type="text" id="rs-name" value="${esc(s.name)}" autofocus
             onkeydown="if(event.key==='Enter') saveStudentName('${s.id}')">
    </div>
    <p class="meta">${cls?esc(cls.name)+' · ':''}Attendance, grades, notes and points stay with this student \u2014 only the name changes.</p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-accent" onclick="saveStudentName('${s.id}')">Save name</button>
    </div>`);
}

function saveStudentName(studentId){
  const s = state.students.find(x=>x.id===studentId);
  const input = document.getElementById('rs-name');
  if(!s || !input) return;
  const name = input.value.trim();
  if(!name){ alert('The name cannot be empty.'); input.focus(); return; }
  if(name === s.name){ closeModal(); return; }
  const clash = state.students.find(x=>x.id!==s.id && x.classId===s.classId
                                        && x.name.toLowerCase() === name.toLowerCase());
  if(clash && !confirm(`Another student in this class is already called \u201c${name}\u201d.\n\nKeep both?`)) return;
  s.name = name;
  sortStudentStore();             // the new name may belong elsewhere in the list
  scheduleSave('students', state.students);
  closeModal();                   // flushes the save before the modal shuts
  refreshView();
}

function deleteStudent(studentId){
  if(!confirm('Remove this student from the class?')) return;
  state.students = state.students.filter(s=>s.id!==studentId);
  scheduleSave('students', state.students);
  refreshView();
}

/* ================= GRADES (test scores per cycle) ================= */
let gmClassId = null, gmCycleIdx = 0;
/* Which test the Advanced grades modal is showing.
   'summary' | 'o<index>' (official test) | 'm<mockId>' */
let gmTab = 'summary';

function gmSlot(){
  if(gmTab && gmTab.charAt(0)==='m') return { kind:'mock', id: gmTab.slice(1) };
  if(/^o\d+$/.test(gmTab||'')) return { kind:'official', idx: Number(gmTab.slice(1)) };
  return null;
}

function openGradesModal(classId, cycleIdx){
  const c = classById(classId);
  if(!c) return;
  const g = classGrades(classId);          // ensures at least one cycle exists
  gmClassId = classId;
  gmCycleIdx = (cycleIdx!=null && g.cycles[cycleIdx]) ? cycleIdx : g.cycles.length-1;
  gmTab = 'summary';
  scheduleSave('grades', state.grades);    // persist the auto-created record
  renderGradesModal();
}

function renderGradesModal(){
  const c = classById(gmClassId);
  const g = classGrades(gmClassId);
  const cycle = g.cycles[gmCycleIdx];
  const students = studentsInClass(gmClassId);
  const n = testCountFor(c);
  const adv = isAdvancedLevel(c.level);
  const target = adv ? TOEFL_TARGETS[c.level] : null;
  const isCurrent = gmCycleIdx === g.cycles.length-1;
  const margin = gradeMargin();
  const testDates = (cycle.testDates||[]).slice(0,n); while(testDates.length<n) testDates.push('');

  const ruleNote = !c.level
    ? `⚠ This class has no group tag yet, so it defaults to the 3-test / 240-point rule. <button type="button" class="linkish" onclick="closeModal();openClassModal('${c.id}')">Set the tag</button> for the right rules.`
    : adv
      ? `One term: a <b>diagnostic</b> in the first week sets the baseline, and the real <b>TOEFL</b> falls on the last class or the one before it. Target for ${esc(c.level)}: <b>${target}</b> — only the final TOEFL counts towards Contact Parents${margin?`, and passing scores under <b>${target+margin}</b> are flagged as "close"`:''}; the diagnostic never does. Plus <b>2 essays</b> during the term, scored 0–${ESSAY_MAX} — recorded and reported, not counted towards status.`
      : `Three terms, each closed by its own test — First, Second, Third · <b>240 points total</b> needed (average 80). An average under 80 flags Contact Parents${margin?` · averages under <b>${CYCLE_AVG_TARGET+margin}</b> are flagged as "close"`:''}.`;

  window._gmIds = students.map(s=>s.id);

  const header = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <h3 style="margin:0;">📝 Grades — ${esc(c.name)}${c.level?` <span class="badge other">${esc(c.level)}</span>`:''}</h3>
      <span style="font-size:12px;color:var(--muted);white-space:nowrap;" title="Change in Settings (sidebar)">⚙ Alert margin: +${margin} · set in Settings</span>
    </div>
    <div style="font-size:13px;color:var(--muted);margin:8px 0 12px;">${ruleNote}</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
      <label style="font-size:13px;font-weight:600;color:var(--muted);">Course:</label>
      ${g.cycles.length>1 ? `<select onchange="gmSelectCycle(this.value)">
        ${g.cycles.map((cy,i)=>`<option value="${i}" ${i===gmCycleIdx?'selected':''}>${esc(cy.label)} (${formatDateShort(cy.startedAt)})${i===g.cycles.length-1?' · current':''}</option>`).join('')}
      </select>` : `<span style="font-size:13px;font-weight:700;">${esc(cycle.label)}</span><span style="font-size:12px;color:var(--muted);">started ${formatDateShort(cycle.startedAt)}</span>`}
      <button class="btn-ghost small" onclick="gmRenameCycle()" title="Rename this course">✏️ Rename</button>
      <button class="btn-ghost small" onclick="gmNewCycle()" title="Start a fresh course — the current one stays saved">+ New course</button>
      ${g.cycles.length>1?`<button class="btn-ghost small" style="color:var(--red);" onclick="gmDeleteCycle()" title="Delete this course">🗑 Delete</button>`:''}
      ${!isCurrent?`<span class="badge other">Viewing a past course — still editable</span>`:''}
    </div>`;

  const body = adv ? gmAdvancedBody(c, cycle, students, n, target)
                   : gmSimpleBody(c, cycle, students, n, testDates, target, adv);

  showModal(`${sizeModal('xl sheet')}${header}${body}
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="btn-ghost small" onclick="exportGradesCsv()">⬇ Export CSV</button>
      <button class="btn-accent" onclick="closeModal()">Done</button>
    </div>
  `, true);
}

/* ---------- non-Advanced classes: one number per test (unchanged) ---------- */
function gmSimpleBody(c, cycle, students, n, testDates, target, adv){
  return `
    <div class="card" style="padding:10px 14px;margin-bottom:12px;">
      <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;">📅 Test days — scheduling a date adds a Test event to the Calendar; absences on that day flag Contact Parents on the Dashboard.</div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        ${testDates.map((d,i)=>`
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
            <span style="font-weight:600;">${testLabelFor(c,i)}</span>
            <input type="date" value="${d||''}" onchange="gmSetTestDate(${i}, this.value)">
          </label>`).join('')}
      </div>
    </div>
    ${students.length ? `
    <div class="table-wrap mtable">
      <table>
        <thead><tr><th>Student</th>${Array.from({length:n},(_,i)=>`<th style="text-align:center;">${testLabelFor(c,i)}${testDates[i]?`<div style="font-weight:400;font-size:11px;color:var(--muted);">${formatDateShort(testDates[i])}</div>`:''}</th>`).join('')}<th style="text-align:center;">Total</th><th style="text-align:center;">Avg</th><th>Status</th></tr></thead>
        <tbody>
          ${students.map((s,si)=>{
            const scores = studentScores(cycle, s.id, n).map(scoreValue);
            const st = gradeStatus(c, cycle, s.id);
            return `<tr>
              <td style="font-weight:600;">${esc(s.name)}</td>
              ${scores.map((v,ti)=>`<td style="text-align:center;"><input type="number" min="0" max="${adv?677:100}" value="${v==null?'':v}" style="width:70px;text-align:center;" onchange="gmSetScore(window._gmIds[${si}], ${ti}, this.value)"></td>`).join('')}
              <td style="text-align:center;">${st?st.total:'—'}</td>
              <td style="text-align:center;">${st?st.avg:'—'}</td>
              <td>${gmStatusHtml(st, c, target)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>` : `<div class="empty">No students in this class yet.</div>`}`;
}

function gmStatusHtml(st, c, target){
  const adv = isAdvancedLevel(c.level);
  if(!st) return '<span style="color:var(--muted);font-size:12px;">—</span>';
  if(st.under) return `<span class="badge red">📞 ${adv?'Below '+target:'Avg under 80'}</span>`;
  if(st.close) return `<span class="badge amber">📞 ${adv?'Close to '+target:'Close to 80'}</span>`;
  if(adv && st.pending){
    // Diagnostic only so far — show the climb still needed, with no alarm.
    if(st.gapToTarget == null) return `<span class="badge other">Diagnostic not taken</span>`;
    return st.gapToTarget > 0
      ? `<span class="badge other">Baseline set · ${st.gapToTarget} to go</span>`
      : `<span class="badge" style="background:var(--green-soft,#e5f7ec);color:var(--green);">Baseline already at target</span>`;
  }
  if(st.entered<st.of) return `<span class="badge other">On track (${st.entered}/${st.of})</span>`;
  return `<span class="badge" style="background:var(--green-soft,#e5f7ec);color:var(--green);">✓ ${adv?'Target met':'Approved'}</span>`;
}

/* ---------- Advanced classes: section entry, mocks, per-test tabs ---------- */
function gmAdvancedBody(c, cycle, students, n, target){
  const mocks = cycleMocks(cycle);
  const tab = (id, label, sub) => `<button class="btn-ghost small" style="${gmTab===id?'background:var(--accent);color:var(--on-accent,#fff);border-color:var(--accent);':''}" onclick="gmSetTab('${id}')">${label}${sub?`<span style="opacity:.75;font-weight:400;"> · ${sub}</span>`:''}</button>`;
  const tabs = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
      ${tab('summary','📋 Summary')}
      ${Array.from({length:n},(_,i)=>tab('o'+i, testLabelFor(c,i), (cycle.testDates||[])[i]?formatDateShort(cycle.testDates[i]):'no date')).join('')}
      ${tab('essays','✍️ Essays', gmEssayTabSub(c, cycle, students))}
      ${mocks.map(m=>tab('m'+m.id, '🧪 '+esc(m.label||'Mock'), m.date?formatDateShort(m.date):'no date')).join('')}
      <button class="btn-ghost small" onclick="gmAddMock()" title="A mock (simulation) is scored the same way but never counts towards pass/fail">+ Mock test</button>
    </div>`;
  return tabs + (gmTab==='summary' ? gmSummaryTable(c, cycle, students, n, target)
               : gmTab==='essays'  ? gmEssayBody(c, cycle, students, target)
                                   : gmTestEntry(c, cycle, students, n, target));
}
// "1/2 written" style hint on the Essays tab, so the Summary screen shows progress.
function gmEssayTabSub(c, cycle, students){
  const n = essayCountFor(c);
  if(!n || !students.length) return '0–'+ESSAY_MAX;
  const done = students.filter(s=>{ const st = essayStatus(c, cycle, s.id); return st && st.entered===st.of; }).length;
  return done ? done+'/'+students.length+' done' : '0–'+ESSAY_MAX;
}

// Diagnostic -> TOEFL movement. The only combined figure worth showing.
function gmGainHtml(st){
  if(!st || st.gain == null) return '<span style="color:var(--muted);">—</span>';
  const up = st.gain > 0, flat = st.gain === 0;
  return `<b style="color:${flat?'var(--muted)':up?'var(--green)':'var(--red)'};">${up?'+':''}${st.gain}</b>`;
}

function gmSummaryTable(c, cycle, students, n, target){
  if(!students.length) return `<div class="empty">No students in this class yet.</div>`;
  const mocks = cycleMocks(cycle);
  const testDates = (cycle.testDates||[]);
  const cellFor = (entry) => {
    const v = scoreValue(entry);
    const sec = scoreSections(entry);
    if(v==null && !sec) return `<span style="color:var(--muted);">—</span>`;
    const line = sec ? `<div style="font-size:10.5px;font-weight:400;color:var(--muted);white-space:nowrap;">${TOEFL_SECTIONS.map(x=>sec[x.k]==null?'—':sec[x.k]).join(' / ')}</div>` : '';
    return (v==null ? `<span style="color:var(--muted);font-weight:700;font-size:12.5px;">${sectionsFilled(sec)}/3</span>` : `<b>${v}</b>`) + line;
  };
  const official = `
    <div class="table-wrap mtable">
      <table>
        <thead><tr><th>Student</th>${Array.from({length:n},(_,i)=>`<th style="text-align:center;">${testLabelFor(c,i)}${testDates[i]?`<div style="font-weight:400;font-size:11px;color:var(--muted);">${formatDateShort(testDates[i])}</div>`:''}</th>`).join('')}<th style="text-align:center;" title="How far the student moved from the diagnostic baseline to the real TOEFL">Change</th><th>Status</th></tr></thead>
        <tbody>
          ${students.map((s,si)=>{
            const entries = studentScores(cycle, s.id, n);
            const st = gradeStatus(c, cycle, s.id);
            return `<tr>
              <td style="font-weight:600;">${esc(s.name)}</td>
              ${entries.map((e,ti)=>{
                const d = scoreDetail(e);
                if(d) return `<td style="text-align:center;">${cellFor(e)}<div style="font-size:10.5px;"><button type="button" class="linkish" onclick="gmSetTab('o${ti}')">edit</button></div></td>`;
                const v = scoreValue(e);
                return `<td style="text-align:center;"><input type="number" min="0" max="677" value="${v==null?'':v}" style="width:72px;text-align:center;" title="Type a final score directly, or open the ${esc(testLabelFor(c,ti))} tab to enter section answers" onchange="gmSetScore(window._gmIds[${si}], ${ti}, this.value)"></td>`;
              }).join('')}
              <td style="text-align:center;">${gmGainHtml(st)}</td>
              <td>${gmStatusHtml(st, c, target)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">Sub-figures are Listening / Structure / Reading converted scores; <b>n/3</b> means that test is only part-scored so far. Open a test tab to enter section answers.</div>`;

  const mockTable = !mocks.length ? '' : `
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 6px;">🧪 MOCK TESTS — practice only, never counted towards status</div>
    <div class="table-wrap mtable-sm">
      <table>
        <thead><tr><th>Student</th>${mocks.map(m=>`<th style="text-align:center;">${esc(m.label||'Mock')}${m.date?`<div style="font-weight:400;font-size:11px;color:var(--muted);">${formatDateShort(m.date)}</div>`:''}</th>`).join('')}</tr></thead>
        <tbody>
          ${students.map(s=>`<tr>
            <td style="font-weight:600;">${esc(s.name)}</td>
            ${mocks.map(m=>`<td style="text-align:center;">${cellFor((m.scores||{})[s.id])}</td>`).join('')}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  return official + gmEssaySummaryTable(c, cycle, students) + mockTable;
}

function gmTestEntry(c, cycle, students, n, target){
  const slot = gmSlot();
  if(!slot) { gmTab = 'summary'; return gmSummaryTable(c, cycle, students, n, target); }
  const isMock = slot.kind==='mock';
  const mk = isMock ? cycleMocks(cycle).find(m=>m.id===slot.id) : null;
  if(isMock && !mk){ gmTab = 'summary'; return gmSummaryTable(c, cycle, students, n, target); }
  const label = isMock ? (mk.label||'Mock') : testLabelFor(c, slot.idx);
  const date = isMock ? (mk.date||'') : ((cycle.testDates||[])[slot.idx]||'');
  const form = toeflFormOfSlot(cycle, slot, c);

  const meta = `
    <div class="card" style="padding:12px 14px;margin-bottom:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;">
      <div style="font-weight:800;font-size:15px;">${isMock?'🧪 ':''}${esc(label)}${isMock?`<span class="badge other" style="margin-left:6px;font-size:11px;">not counted</span>`:''}</div>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
        <span style="font-weight:600;color:var(--muted);">Date</span>
        <input type="date" value="${date}" onchange="${isMock?`gmSetMockDate('${mk.id}', this.value)`:`gmSetTestDate(${slot.idx}, this.value)`}">
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;">
        <span style="font-weight:600;color:var(--muted);">Test used</span>
        <select onchange="gmSetForm(this.value)">
          ${TOEFL_FORM_IDS.map(f=>`<option value="${f}" ${f===form?'selected':''}>${TOEFL_FORM_LABELS[f]}</option>`).join('')}
        </select>
      </label>
      ${isMock?`
        <button class="btn-ghost small" onclick="gmRenameMock('${mk.id}')">✏️ Rename</button>
        <button class="btn-ghost small" style="color:var(--red);" onclick="gmDeleteMock('${mk.id}')">🗑 Delete mock</button>`:''}
    </div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">Enter the number of <b>correct answers</b> per section. The converted score and the final TOEFL score are calculated automatically.</div>`;

  if(!students.length) return meta + `<div class="empty">No students in this class yet.</div>`;

  const attemptsByStudent = {};
  students.forEach(s=>{ attemptsByStudent[s.id] = toeflAttempts(c, s.id); });
  const slotKeyOf = cycle.id + '|' + (isMock ? 'm'+mk.id : 'o'+slot.idx);

  const rows = students.map((s,si)=>{
    const entry = gmScoreCell(cycle, slot, s.id, n);
    const d = scoreDetail(entry);
    const rawOf = k => d && d[k]!=null ? d[k] : '';
    const sec = scoreSections(entry);
    const atts = attemptsByStudent[s.id];
    const idx = atts.findIndex(a=>a.key===slotKeyOf);
    return `<tr>
      <td style="font-weight:600;">${esc(s.name)}</td>
      ${TOEFL_SECTIONS.map(sec2=>`<td style="text-align:center;">
        <input type="number" min="0" max="${sec2.max}" value="${rawOf(sec2.k)}" style="width:64px;text-align:center;" placeholder="/${sec2.max}" onchange="gmSetSection(window._gmIds[${si}], '${sec2.k}', this.value)">
        <div id="gsec-${s.id}-${sec2.k}" style="font-size:12.5px;font-weight:800;color:${TOEFL_SECTION_COLORS[sec2.k]};">${sec&&sec[sec2.k]!=null?sec[sec2.k]:'<span style="color:var(--muted);font-weight:400;">—</span>'}</div>
      </td>`).join('')}
      <td style="text-align:center;font-weight:800;font-size:16px;" id="gtot-${s.id}">${gmTotalCellHtml(entry)}</td>
      <td style="text-align:center;" id="gdelta-${s.id}">${gmDeltaHtml(atts, idx, target)}</td>
    </tr>`;
  }).join('');

  return meta + `
    <div class="table-wrap mtable">
      <table>
        <thead><tr><th>Student</th>${TOEFL_SECTIONS.map(x=>`<th style="text-align:center;">${x.en}<div style="font-weight:400;font-size:11px;color:var(--muted);">correct / ${x.max}</div></th>`).join('')}<th style="text-align:center;">Score</th><th style="text-align:center;">vs previous</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">The colored figure under each box is that section's converted score — it appears as soon as you enter that section, on its own. The final score needs all three.${target?` Target for this level: <b>${target}</b>.`:''}</div>`;
}

// Final score cell: a real score once all three sections are in, otherwise an
// honest "2/3 sections" with what is still outstanding.
function gmTotalCellHtml(entry){
  const total = scoreValue(entry);
  if(total!=null) return String(total);
  const sec = scoreSections(entry);
  const filled = sectionsFilled(sec);
  if(!filled) return '<span style="color:var(--muted);font-weight:600;">—</span>';
  return `<span style="color:var(--muted);font-size:13px;">${filled}/3</span>`
    + `<div style="font-size:10.5px;font-weight:400;color:var(--muted);white-space:normal;">needs ${missingSectionNames(sec).join(' + ')}</div>`;
}
/* "vs previous" for one student. A complete test compares final scores; a
   part-scored one compares each section it does have against the last time
   that section was sat. */
function gmDeltaHtml(atts, idx, target){
  if(idx<0) return '<span style="color:var(--muted);">—</span>';
  const cur = atts[idx];
  if(cur.total!=null){
    let prev = null;
    for(let j=idx-1;j>=0;j--){ if(atts[j].total!=null){ prev = atts[j]; break; } }
    let out = '';
    if(prev){
      const d = cur.total - prev.total;
      const col = d>0?'var(--green)':d<0?'var(--red)':'var(--muted)';
      out += `<span style="font-weight:700;color:${col};">${d>0?'▲ +':d<0?'▼ −':'– '}${Math.abs(d)}</span><div style="font-size:10.5px;color:var(--muted);">vs ${esc(prev.label)}</div>`;
    }else{
      out += '<span style="color:var(--muted);font-size:12px;">first attempt</span>';
    }
    if(target!=null && cur.total < target) out += `<div style="font-size:10.5px;color:var(--red);font-weight:700;">${target-cur.total} below target</div>`;
    return out;
  }
  const bits = [];
  TOEFL_SECTIONS.forEach(x=>{
    if(!cur.sec || cur.sec[x.k]==null) return;
    let prev = null;
    for(let j=idx-1;j>=0;j--){ const a = atts[j]; if(a.sec && a.sec[x.k]!=null){ prev = a; break; } }
    if(!prev) return;
    const d = cur.sec[x.k] - prev.sec[x.k];
    const col = d>0?'var(--green)':d<0?'var(--red)':'var(--muted)';
    bits.push(`<span style="color:${col};font-weight:700;">${x.k} ${d>0?'+':d<0?'−':'±'}${Math.abs(d)}</span>`);
  });
  return bits.length
    ? `<div style="font-size:11.5px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap;">${bits.join('')}</div>`
    : '<span style="color:var(--muted);font-size:12px;">—</span>';
}

/* --- read / write one score cell, official or mock --- */
function gmScoreCell(cycle, slot, studentId, n){
  if(slot.kind==='mock'){
    const mk = cycleMocks(cycle).find(m=>m.id===slot.id);
    return mk ? (mk.scores||{})[studentId] : null;
  }
  return studentScores(cycle, studentId, n)[slot.idx];
}
function gmWriteScoreCell(cycle, slot, studentId, n, entry){
  if(slot.kind==='mock'){
    const mk = cycleMocks(cycle).find(m=>m.id===slot.id);
    if(!mk) return;
    if(!mk.scores) mk.scores = {};
    if(entry==null) delete mk.scores[studentId]; else mk.scores[studentId] = entry;
    return;
  }
  if(!cycle.scores) cycle.scores = {};
  const arr = studentScores(cycle, studentId, n);
  arr[slot.idx] = entry;
  cycle.scores[studentId] = arr;
}

function gmSetTab(id){ gmTab = id; renderGradesModal(); }

function gmSetSection(studentId, sectionKey, value){
  const c = classById(gmClassId);
  const g = classGrades(gmClassId);
  const cycle = g.cycles[gmCycleIdx];
  const n = testCountFor(c);
  const slot = gmSlot();
  if(!slot) return;
  const meta = TOEFL_SECTIONS.find(s=>s.k===sectionKey);
  if(!meta) return;
  const cur = gmScoreCell(cycle, slot, studentId, n);
  const d = scoreDetail(cur);
  const form = (d && d.form) || toeflFormOfSlot(cycle, slot, c);
  const raw = { L: d?d.L:null, S: d?d.S:null, R: d?d.R:null };
  let v = (value==='' || value==null) ? null : Math.round(Number(value));
  if(v!=null && isNaN(v)) v = null;
  if(v!=null) v = Math.max(0, Math.min(meta.max, v));
  raw[sectionKey] = v;
  // Sections stand on their own — makeToeflEntry returns null only when the
  // whole row has been cleared, and fills in the final score once all three are in.
  const entry = makeToeflEntry(form, raw.L, raw.S, raw.R);
  gmWriteScoreCell(cycle, slot, studentId, n, entry);
  scheduleSave('grades', state.grades);
  gmRefreshRow(studentId);
}

// Patch just the derived cells of one row, so typing across a class doesn't
// rebuild (and re-scroll) the whole table between every entry.
function gmRefreshRow(studentId){
  const c = classById(gmClassId);
  const g = classGrades(gmClassId);
  const cycle = g.cycles[gmCycleIdx];
  const n = testCountFor(c);
  const slot = gmSlot();
  if(!slot) return;
  const target = isAdvancedLevel(c.level) ? TOEFL_TARGETS[c.level] : null;
  const entry = gmScoreCell(cycle, slot, studentId, n);
  const sec = scoreSections(entry);
  TOEFL_SECTIONS.forEach(x=>{
    const el = document.getElementById('gsec-'+studentId+'-'+x.k);
    if(el) el.innerHTML = (sec && sec[x.k]!=null) ? String(sec[x.k]) : '<span style="color:var(--muted);font-weight:400;">—</span>';
  });
  const tot = document.getElementById('gtot-'+studentId);
  if(tot) tot.innerHTML = gmTotalCellHtml(entry);
  const del = document.getElementById('gdelta-'+studentId);
  if(del){
    const atts = toeflAttempts(c, studentId);
    const key = cycle.id + '|' + (slot.kind==='mock' ? 'm'+slot.id : 'o'+slot.idx);
    del.innerHTML = gmDeltaHtml(atts, atts.findIndex(a=>a.key===key), target);
  }
}

// Changing the booklet re-converts every score already entered for that test.
function gmSetForm(formId){
  const c = classById(gmClassId);
  const g = classGrades(gmClassId);
  const cycle = g.cycles[gmCycleIdx];
  const n = testCountFor(c);
  const slot = gmSlot();
  if(!slot || !TOEFL_FORMS[formId]) return;
  if(slot.kind==='mock'){
    const mk = cycleMocks(cycle).find(m=>m.id===slot.id);
    if(!mk) return;
    mk.form = formId;
  }else{
    if(!Array.isArray(cycle.testForms)) cycle.testForms = [];
    while(cycle.testForms.length<n) cycle.testForms.push(null);
    cycle.testForms[slot.idx] = formId;
  }
  studentsInClass(gmClassId).forEach(s=>{
    const cur = gmScoreCell(cycle, slot, s.id, n);
    const d = scoreDetail(cur);
    if(!d) return;
    gmWriteScoreCell(cycle, slot, s.id, n, makeToeflEntry(formId, d.L, d.S, d.R));
  });
  scheduleSave('grades', state.grades);
  renderGradesModal();
}

          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">

      TWE bands — <b>6</b> clearly competent · <b>5</b> generally competent · <b>4</b> minimally competent · <b>3</b> developing · <b>2</b> seriously flawed · <b>1</b> incompetent. Decimals are kept exactly as you type them (5.2, 5.75…).
      Essays are recorded and reported but never change Contact Parents, which stays tied to the TOEFL target${target?` of <b>${target}</b>`:''}.
    </div>`;

  if(!students.length) return meta + `<div class="empty">No students in this class yet.</div>`;

  const rows = students.map((s,si)=>{

        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">Anything under <b>${ESSAY_PASS}</b> is highlighted so it is easy to spot, and appears on the student report.</div>`;

function gmEssayAvgCell(st){
  if(!st) return '<span style="color:var(--muted);font-weight:600;">—</span>';

}

function gmSetEssayTopic(idx, value){
  const g = classGrades(gmClassId);

  cycleEssays(cycle);
  const t = (value||'').trim();
  cycle.essayTopics[idx] = t || null;
  const evId = cycle.essayEventIds[idx];

  const c = classById(gmClassId);

}

function gmSetEssayDate(idx, value){
  const g = classGrades(gmClassId);
  const cycle = g.cycles[gmCycleIdx];
  cycleEssays(cycle);
  cycle.essayDates[idx] = value || null;
  const evId = cycle.essayEventIds[idx];
  const title = gmEssayEventTitle(cycle, idx);
  if(value){
    const existing = evId ? state.events.find(e=>e.id===evId) : null;
    if(existing){ existing.date = value; existing.title = title; }
    else{

      state.events.push({id:id, date:value, title:title, type:'test', classId:gmClassId, fromGrades:true, essay:true});

    state.events = state.events.filter(e=>e.id!==evId);
    cycle.essayEventIds[idx] = null;

  scheduleSave('grades', state.grades);

function gmSetTestDate(testIdx, value){

  if(value){

    if(existing){ existing.date = value; existing.title = title; }
    else{
      const id = uid();
      state.events.push({id, date:value, title, type:'test', classId:gmClassId, fromGrades:true});
      cycle.testEventIds[testIdx] = id;
    }
  }else if(evId){
    state.events = state.events.filter(e=>e.id!==evId);
    cycle.testEventIds[testIdx] = null;
  }
  scheduleSave('events', state.events);
  scheduleSave('grades', state.grades);

function gmRenameCycle(){

  const label = prompt('Rename course:', cy.label);
  if(label===null) return;

  // Keep any linked test-day calendar events in sync with the new name.
  const c = classById(gmClassId);
  (cy.testEventIds||[]).forEach((evId, ti)=>{
    if(!evId) return;
    const ev = state.events.find(e=>e.id===evId);
    if(ev) ev.title = `${testLabelFor(c,ti)} — ${trimmed}`;
  });
  cycleMocks(cy).forEach(mk=>{
    if(!mk.eventId) return;
    const ev = state.events.find(e=>e.id===mk.eventId);
    if(ev) ev.title = `${mk.label||'Mock'} (mock) — ${trimmed}`;
  });
  cycleEssays(cy);
  cy.essayEventIds.forEach((evId, i)=>{
    if(!evId) return;
    const ev = state.events.find(e=>e.id===evId);
    if(ev) ev.title = `${essayLabelFor(c,i)}${cy.essayTopics[i]?` — ${cy.essayTopics[i]}`:''} — ${trimmed}`;
  });
  scheduleSave('grades', state.grades);
  scheduleSave('events', state.events);
  renderGradesModal();
}

function gmDeleteCycle(){
  const g = classGrades(gmClassId);
  if(g.cycles.length<=1){ alert('A class needs at least one cycle.'); return; }
  const cy = g.cycles[gmCycleIdx];
  if(!cy) return;
  const mockEvents = cycleMocks(cy).map(m=>m.eventId).filter(Boolean);
  const essayEvents = cycleEssays(cy) && cy.essayEventIds.filter(Boolean);
  const linked = (cy.testEventIds||[]).filter(Boolean).length + mockEvents.length + essayEvents.length;
  if(!confirm(`Delete course "${cy.label}"?\n\nAll test scores in it will be removed${linked?`, along with ${linked} test event(s) on the Calendar`:''}.\n\nThis cannot be undone.`)) return;
  // Remove this cycle's linked calendar events.
  const evIds = new Set((cy.testEventIds||[]).filter(Boolean).concat(mockEvents).concat(essayEvents));
  if(evIds.size) state.events = state.events.filter(e=>!evIds.has(e.id));
  g.cycles.splice(gmCycleIdx, 1);
  gmCycleIdx = Math.min(gmCycleIdx, g.cycles.length-1);
  gmTab = 'summary';
  scheduleSave('grades', state.grades);
  if(evIds.size) scheduleSave('events', state.events);
  renderGradesModal();
}

/* ===== Class plan (repurposed promises store) — rich text helpers =====
   The old "promised for today" store now holds the day's class plan.
   Values may be legacy plain text or HTML written by the rich editor.
   No migration needed: legacy text is upgraded to HTML on display. */
function htmlToPlain(html){
  if(!html) return '';
  const d = document.createElement('div');
  d.innerHTML = String(html)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(div|p|li|h1|h2|h3|blockquote)>/gi, '\n');
  return (d.textContent || '').replace(/\u00a0/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
function looksLikeHtml(val){ return /<[a-z][\s\S]*>/i.test(val||''); }
// Whitelist sanitizer: only formatting tags/attrs the toolbar can produce
// (plus what sensible pasting yields). Everything else is unwrapped to text.
const PLAN_TAGS = new Set(['A','B','STRONG','I','EM','U','S','STRIKE','BR','DIV','P','UL','OL','LI','SPAN','FONT','H1','H2','H3','BLOCKQUOTE']);
function sanitizePlanHtml(html){
  if(!html) return '';
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const walk = (node)=>{
    for(const child of Array.from(node.childNodes)){
      if(child.nodeType === Node.ELEMENT_NODE){
        if(!PLAN_TAGS.has(child.tagName)){
          // unwrap: keep children, drop the tag (kills script/iframe/img etc.)
          walk(child);
          while(child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          continue;
        }
        // strip all attributes except a safe subset
        for(const attr of Array.from(child.attributes)){
          const n = attr.name.toLowerCase();
          if(n === 'size' && child.tagName === 'FONT') continue;
          // Links survive sanitising, but only with a safe scheme — the plan is
          // the one place a teacher pastes a slide deck or video URL.
          if(n === 'href' && child.tagName === 'A'){
            const v = (attr.value || '').trim();
            if(/^(https?:|mailto:|tel:|\/|#)/i.test(v)) continue;
          }
          if(n === 'style'){
            // keep only font-size / font-weight / font-style / text-decoration
            const kept = attr.value.split(';').map(s=>s.trim()).filter(s=>
              /^(font-size|font-weight|font-style|text-decoration)\s*:/i.test(s));
            if(kept.length){ child.setAttribute('style', kept.join(';')); continue; }
          }
          child.removeAttribute(attr.name);
        }
        walk(child);
      } else if(child.nodeType !== Node.TEXT_NODE){
        node.removeChild(child); // comments etc.
      }
    }
  };
  walk(doc.body);
  return doc.body.innerHTML;
}
// Display form: legacy plain text -> escaped html with line breaks; html -> sanitized
function planDisplayHtml(val){
  if(!val) return '';
  return looksLikeHtml(val) ? sanitizePlanHtml(val) : esc(val).replace(/\n/g,'<br>');
}
/* Read-only rendering of a plan / homework note: sanitised HTML, bare URLs
   turned into real links, and every link opened in a new tab so tapping one
   mid-lesson never navigates the dashboard away from the register. */
const URL_RE = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/g;
function autolinkHtml(html){
  if(!html) return '';
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const walk = (node)=>{
    for(const child of Array.from(node.childNodes)){
      if(child.nodeType === Node.TEXT_NODE){
        const t = child.nodeValue || '';
        URL_RE.lastIndex = 0;
        if(!URL_RE.test(t)) continue;
        URL_RE.lastIndex = 0;
        const frag = doc.createDocumentFragment();
        let last = 0, m;
        while((m = URL_RE.exec(t))){
          if(m.index > last) frag.appendChild(doc.createTextNode(t.slice(last, m.index)));
          let raw = m[0], trail = '';
          const tm = raw.match(/[).,;:!?\]]+$/);
          if(tm){ trail = tm[0]; raw = raw.slice(0, raw.length - trail.length); }
          const a = doc.createElement('a');
          a.setAttribute('href', /^www\./i.test(raw) ? 'https://' + raw : raw);
          a.textContent = raw;
          frag.appendChild(a);
          if(trail) frag.appendChild(doc.createTextNode(trail));
          last = m.index + m[0].length;
        }
        if(last < t.length) frag.appendChild(doc.createTextNode(t.slice(last)));
        node.replaceChild(frag, child);
      } else if(child.nodeType === Node.ELEMENT_NODE && child.tagName !== 'A'){
        walk(child);
      }
    }
  };
  walk(doc.body);
  return doc.body.innerHTML;
}
function planReadHtml(val){
  if(!val) return '';
  const doc = new DOMParser().parseFromString(autolinkHtml(planDisplayHtml(val)), 'text/html');
  doc.querySelectorAll('a[href]').forEach(a=>{
    a.setAttribute('target','_blank');
    a.setAttribute('rel','noopener noreferrer');
  });
  return doc.body.innerHTML;
}
function planLink(){
  const sel = window.getSelection();
  const txt = sel ? String(sel) : '';
  let url = prompt(txt ? 'Link URL for \u201c' + txt + '\u201d' : 'Link URL', 'https://');
  if(!url) return;
  url = url.trim();
  if(!url || url === 'https://') return;
  if(!/^(https?:|mailto:|tel:)/i.test(url)) url = 'https://' + url.replace(/^\/+/, '');
  if(txt){
    document.execCommand('createLink', false, url);
  } else {
    const safe = url.replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    document.execCommand('insertHTML', false, '<a href="' + safe + '">' + safe + '</a>&nbsp;');
  }
}

/* ================= CLASS POINTS (ClassDojo-style, per-class opt-in) =================
   Enabled per class via cls.pointsEnabled. Every award is an append-only log
   entry (never a mutated total), so history, undo and cross-device merging
   all stay safe. Totals are computed, filtered by cls.pointsSince so a
   "new round" keeps old history without counting it. */
const POINT_PRESETS = [
  { emoji:'🙋', label:'Participation',       delta:+1 },
  { emoji:'🗣️', label:'Speaking English',    delta:+1 },
  { emoji:'🤝', label:'Helping a colleague', delta:+1 },
  { emoji:'🌟', label:'Great work',          delta:+2 },
  { emoji:'🇧🇷', label:'Speaking Portuguese', delta:-1 },
  { emoji:'📵', label:'Off task',            delta:-1 },
  { emoji:'📕', label:'No homework',         delta:-1 },
];
function classPointsEnabled(classId){ return !!classById(classId)?.pointsEnabled; }
function pointsFor(studentId, classId, sinceOverride){
  const since = sinceOverride !== undefined ? sinceOverride : (classById(classId)?.pointsSince || '');
  return (state.pointsLog||[]).reduce((t,e)=>
    t + ((e.studentId===studentId && e.classId===classId && (!since || e.date>=since)) ? e.delta : 0), 0);
}
function pointsHistory(studentId, classId){
  return (state.pointsLog||[])
    .filter(e=>e.studentId===studentId && e.classId===classId)
    .sort((a,b)=>(b.ts||0)-(a.ts||0));
}
function awardPoints(classId, studentId, delta, reason, date){
  delta = parseInt(delta, 10);
  if(!delta) return null;
  if(!state.pointsLog) state.pointsLog = [];
  const entry = { id: uid(), classId, studentId, delta, reason:(reason||'').trim(), date: date || todayStr(), ts: Date.now() };
  state.pointsLog.push(entry);
  scheduleSave('pointsLog', state.pointsLog);
  return entry;
}
function quickPoint(classId, studentId, delta, date){
  awardPoints(classId, studentId, delta, '', date || state.rollcall?.date || todayStr());
  refreshView();
}
function deletePointEntry(id, rerender){
  const idx = (state.pointsLog||[]).findIndex(e=>e.id===id);
  if(idx<0) return;
  const snapshot = state.pointsLog[idx];
  state.pointsLog.splice(idx,1);
  scheduleSave('pointsLog', state.pointsLog);
  const s = anyStudent(snapshot.studentId);
  showUndoToast(`Removed ${snapshot.delta>0?'+':''}${snapshot.delta} for ${s?s.name:'student'}`, ()=>{
    state.pointsLog.push(snapshot);
    scheduleSave('pointsLog', state.pointsLog);
    if(typeof rerender==='function') rerender(); else refreshView();
  });
  if(typeof rerender==='function') rerender(); else refreshView();
}

/* ================= TRENDS & AT-RISK (derived, read-only) =================
   Longitudinal views computed from data that already exists (sessions,
   grades, pointsLog). No new state keys — nothing here can corrupt data. */
function monthKeyOf(date){ return (date||'').slice(0,7); }
function monthShortLabel(mk){
  const [y,m] = mk.split('-');
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[(+m)-1] + (todayStr().slice(0,4)===y ? '' : ' '+y.slice(2));
}
// records: attendance records in any order → per-month attendance %.
function attendanceMonthly(records, maxMonths=8){
  const by = {};
  for(const r of records){
    const k = monthKeyOf(r.date);
    by[k] = by[k] || {p:0,a:0};
    if(r.attendance==='absent') by[k].a++; else by[k].p++;
  }
  return Object.keys(by).sort().slice(-maxMonths)
    .map(k=>({ key:k, label:monthShortLabel(k), value: Math.round(100*by[k].p/(by[k].p+by[k].a)), n: by[k].p+by[k].a }));
}
/* A homework mark may be stored as a number, as a numeric STRING (older
   records, restored backups, anything that wrote an input's raw .value), or as
   the legacy 'done' flag. Treating "100" as a non-number scored a completed
   assignment as 0 — which then flagged the student as owing it. */
function hwValueOf(r){
  const v = r ? r.hw : null;
  if(typeof v === 'number') return v;
  if(v === 'done') return 100;
  if(typeof v === 'string' && v.trim() !== '' && !isNaN(Number(v))){
    return Math.max(0, Math.min(100, Number(v)));
  }
  return 0;
}
/* ===== Was homework even set? =====
   A session only owes homework if some was set for it. Sessions with none are
   marked _hwAssigned:false and stay out of every average — otherwise a class
   where no homework was given still scored 100% (the roll-call default), which
   reads to a parent as if the student had failed to do it.

   The storage key is the day the homework is DUE, not the day it was given:
   the "Homework to assign (due next class)" box saves against the next
   meeting's date. So "Homework due today", the dashboard's "HW due" chip and
   this helper are all the same direct lookup. */
function hwDueOn(classId, date){
  return date ? String(getHomework(classId, date) || '').trim() : '';
}

function annotateHwAssigned(sorted){
  sorted.forEach(r=>{
    const text = hwDueOn(r._classId, r.date);
    r._hwAssigned = !!text;                      // no homework set for that class
    if(text) r._hwText = text;
  });
  return sorted;
}
/* ===== Late homework =====
   The stored percentage is never rewritten — it records what was handed in on
   the day. But homework brought in late IS done, so every average reads through
   hwEffOf(), which returns 100 for a record whose homework was later brought in.
   annotateLateHw() walks the student's history and pushes each "brought late" /
   "did not bring" outcome back onto the record it refers to (lateHwFor, or the
   previous session in the same class for records saved before that reference
   was snapshotted). Records with no percentage at all — homework missed through
   absence — stay out of the average either way; they still show in the late
   donut so the outcome isn't lost. */
function hwEffOf(r){
  if(r._hwAssigned === false) return null;       // the teacher assigned nothing that class
  if(r._hwEff != null) return r._hwEff;
  // Homework WAS assigned, so there are only two outcomes. A student the
  // teacher never ticked follows the same default the roll call shows them
  // with — present, nothing noted, homework done — exactly as attendance does.
  return r.hw == null ? 100 : hwValueOf(r);
}
/* English use and participation follow the same rule as homework above. Roll
   Call shows every present student with "Excellent" and "Great" already
   selected, so leaving a student untouched IS a judgement — it is the teacher
   agreeing with the default, not an absence of data. Reporting those rows blank
   threw that judgement away and made the term look emptier than it was, so the
   default is filled in here instead. Absent students still return null: they
   have no English use or participation to report. */
function englishEffOf(r){
  if(r.attendance === 'absent') return null;
  return r.english || 'excellent';
}
function partEffOf(r){
  if(r.attendance === 'absent') return null;
  return r.participation || 'great';
}
/* Two states only: the teacher assigned homework, or the teacher didn't.
   Where homework was assigned there is always a percentage. */
function hwCellHtml(r, pt){
  if(r._hwAssigned === false)
    return `<span style="color:var(--muted);font-size:11px;font-style:italic;" title="${pt?'O professor não passou dever para esta aula':'The teacher did not assign any homework for this class'}">${pt?'não houve dever':'not assigned'}</span>`;
  const v = hwEffOf(r);
  const col = v >= 100 ? 'var(--green)' : v === 0 ? 'var(--red)' : 'var(--amber)';
  return `<span style="font-weight:700;color:${col};">${v}%</span>`;
}

function annotateLateHw(sorted){
  const byDate = new Map(sorted.map(r=>[r.date, r]));
  sorted.forEach((r, i)=>{
    if(!r.lateHwOutcome) return;
    let targetDate = r.lateHwFor;
    if(!targetDate){
      for(let j=i+1; j<sorted.length; j++){          // newest-first: next entry is earlier
        if(sorted[j]._classId === r._classId){ targetDate = sorted[j].date; break; }
      }
    }
    const target = targetDate ? byDate.get(targetDate) : null;
    if(!target || target === r) return;
    if(target._hwAssigned === false) return;         // no homework that day to bring late
    if(target._hwLate === 'late') return;            // "brought late" wins a conflict
    target._hwLate = r.lateHwOutcome;
    target._hwLateOn = r.date;
    if(r.lateHwOutcome === 'late' && target.hw != null) target._hwEff = 100;
  });
  return sorted;
}
/* Students who owe homework from the previous class session — either they were
   absent that day, or they handed in nothing at all. A partial score is not
   owed: the work was done and already marked, so raising it in the register
   would be noise. Returns Map(studentId -> {reason:'absent'|'none', pct, date}).
   A student with no record at all in the previous session owes nothing. */
function prevHwPending(students, prevSession, prevDate, classId){
  const map = new Map();
  if(!prevDate) return map;
  /* Missing a class only leaves homework owed if homework was actually due
     that day — i.e. the session before it set some. Without this check a
     student who missed the very first class, when no homework existed at all,
     was flagged as owing it. */
  if(classId && !hwDueOn(classId, prevDate)) return map;
  for(const s of students){
    const pr = prevSession[s.id];
    if(!pr) continue;
    if(pr.attendance === 'absent'){ map.set(s.id, {reason:'absent', pct:null, date:prevDate}); continue; }
    if(pr.hw == null) continue;                 // nothing recorded — don't guess
    /* Only the two cases a teacher has to act on: the student wasn't there to
       receive or hand in the homework, or handed in nothing at all. A partial
       score means they did the work and already have their mark for it —
       flagging it just adds noise to the register. */
    if(hwValueOf(pr) === 0) map.set(s.id, {reason:'none', pct:0, date:prevDate});
  }
  return map;
}
function pendingHwLabel(info){
  if(!info) return '';
  return info.reason==='absent'
    ? `was absent${info.date?' on '+formatDateShort(info.date):''}`
    : `did not hand in${info.date?' on '+formatDateShort(info.date):''}`;
}
function hwMonthly(records, maxMonths=8){
  const by = {};
  for(const r of records){
    if(r.attendance==='absent') continue;
    const v = hwEffOf(r);
    if(v==null) continue;
    const k = monthKeyOf(r.date);
    by[k] = by[k] || {s:0,n:0};
    by[k].s += v; by[k].n++;
  }
  return Object.keys(by).sort().slice(-maxMonths)
    .map(k=>({ key:k, label:monthShortLabel(k), value: Math.round(by[k].s/by[k].n), n: by[k].n }));
}
function pointsMonthly(entries, maxMonths=8){
  const by = {};
  for(const e of entries){ const k = monthKeyOf(e.date); by[k] = (by[k]||0) + e.delta; }
  return Object.keys(by).sort().slice(-maxMonths)
    .map(k=>({ key:k, label:monthShortLabel(k), value: by[k] }));
}
// One point per grade cycle that has any scores for the student.
function studentGradeSeries(cls, studentId){
  const g = state.grades[cls.id];
  if(!g || !g.cycles) return [];
  return g.cycles
    .map(cy=>({ label: cy.label, st: gradeStatus(cls, cy, studentId) }))
    .filter(x=>x.st)
    .map(x=>({ label:x.label, value:x.st.avg, under:x.st.under, close:x.st.close, advanced:x.st.advanced, target:x.st.target }));
}

/* --- sparkline: dependency-free inline SVG --- */
function sparklineSvg(points, opts){
  const { w=190, h=46, target=null, suffix='', color='var(--accent)' } = opts||{};
  if(!points || !points.length) return `<div class="spark-empty">no data yet</div>`;
  const vals = points.map(p=>p.value);
  let lo = Math.min(...vals, target!=null?target:Infinity);
  let hi = Math.max(...vals, target!=null?target:-Infinity);
  if(lo===hi){ lo -= 1; hi += 1; }
  const span = hi-lo; lo -= span*0.12; hi += span*0.12;
  const pad=5, lw=40, iw=w-pad*2-lw, ih=h-pad*2;
  const x = i => points.length===1 ? pad+iw/2 : pad + i*(iw/(points.length-1));
  const y = v => pad + ih - (v-lo)/(hi-lo)*ih;
  const poly = points.map((p,i)=>`${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
  const last = points[points.length-1];
  return `
  <svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="trend">
    ${target!=null?`<line x1="${pad}" x2="${pad+iw}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1" opacity=".55"/>`:''}
    ${points.length>1?`<polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`:''}
    ${points.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="${i===points.length-1?3:2}" fill="${color}"><title>${esc(p.label)}: ${p.value}${suffix}</title></circle>`).join('')}
    <text x="${pad+iw+5}" y="${Math.min(h-4, Math.max(11, y(last.value)+4)).toFixed(1)}" font-size="11" font-weight="700" fill="${color}">${last.value}${suffix}</text>
  </svg>
  <div class="spark-labels"><span>${esc(points[0].label)}</span><span>${esc(last.label)}</span></div>`;
}
function trendDelta(points){
  if(!points || points.length<2) return null;
  return points[points.length-1].value - points[points.length-2].value;
}
function trendArrow(points, goodIsUp=true){
  const d = trendDelta(points);
  if(d==null || d===0) return '';
  const up = d>0;
  const good = up===goodIsUp;
  return ` <span style="font-size:12px;font-weight:700;color:${good?'var(--green)':'var(--red)'};">${up?'▲':'▼'} ${Math.abs(d)}</span>`;
}
/* --- at-risk: combined signals, each pure and individually testable --- */
const RISK = {
  RECENT_N:6, PRIOR_N:6, MIN_RECENT:4,     // attendance windows (class meetings)
  ATT_LOW:75, ATT_DROP:15, ATT_WARN:85,    // % thresholds
  HW_MIN_N:3, HW_LOW:50, HW_WARN:70,       // homework avg thresholds
  GRADE_FALL:8, GRADE_FALL_ADV:15          // cycle-over-cycle drop (regular / TOEFL scale)
};
// records: completed attendance records NEWEST-FIRST (studentAttendanceRecords)
function sigAttendance(records){
  const recent = records.slice(0, RISK.RECENT_N);
  if(recent.length < RISK.MIN_RECENT) return null;
  const rate = arr => Math.round(100*arr.filter(r=>r.attendance!=='absent').length/arr.length);
  const rRecent = rate(recent);
  const prior = records.slice(RISK.RECENT_N, RISK.RECENT_N+RISK.PRIOR_N);
  const rPrior = prior.length >= RISK.MIN_RECENT ? rate(prior) : null;
  if(rRecent < RISK.ATT_LOW)
    return { kind:'attendance', sev:2, recent:rRecent, prior:rPrior,
             text:`Attendance ${rRecent}% in the last ${recent.length} classes${rPrior!=null?` (was ${rPrior}%)`:''}` };
  if(rPrior!=null && rPrior-rRecent >= RISK.ATT_DROP && rRecent < RISK.ATT_WARN)
    return { kind:'attendance', sev:1, recent:rRecent, prior:rPrior, text:`Attendance fell ${rPrior}% → ${rRecent}%` };
  return null;
}
function sigHomework(records){
  const withHw = records.filter(r=>r.attendance!=='absent' && hwEffOf(r)!=null).slice(0, RISK.RECENT_N);
  if(withHw.length < RISK.HW_MIN_N) return null;
  const avg = Math.round(withHw.reduce((s,r)=>s+hwEffOf(r),0)/withHw.length);
  if(avg < RISK.HW_LOW) return { kind:'homework', sev:2, avg, text:`Homework avg ${avg}% over the last ${withHw.length} classes` };
  if(avg < RISK.HW_WARN) return { kind:'homework', sev:1, avg, text:`Homework avg ${avg}%` };
  return null;
}
// series: chronological [{label, value, under, close, advanced}]
function sigGrades(series){
  if(!series || !series.length) return null;
  const cur = series[series.length-1];
  const prev = series.length>1 ? series[series.length-2] : null;
  const fallBar = cur.advanced ? RISK.GRADE_FALL_ADV : RISK.GRADE_FALL;
  const falling = !!prev && (prev.value - cur.value) >= fallBar;
  if(cur.under) return { kind:'grades', sev:2, avg:cur.value, falling,
    text:`${cur.label}: avg ${cur.value} — ${cur.advanced?'below TOEFL target':'failing'}${falling?` (down from ${prev.value})`:''}` };
  if(falling) return { kind:'grades', sev: cur.close?2:1, avg:cur.value, falling:true,
    text:`Avg fell ${prev.value} → ${cur.value} (${cur.label})` };
  if(cur.close) return { kind:'grades', sev:1, avg:cur.value, falling:false,
    text:`${cur.label}: avg ${cur.value} — close to the minimum` };
  return null;
}
// A student is at-risk only when TWO OR MORE independent signal categories
// fire — single-signal cases are already covered by the contact-parents cards.
function riskAssess(student){
  const cls = classById(student.classId);
  if(!cls || cls.archived) return null;
  const records = studentAttendanceRecords(student);
  const signals = [
    sigAttendance(records),
    sigHomework(records),
    sigGrades(studentGradeSeries(cls, student.id))
  ].filter(Boolean);
  if(signals.length < 2) return null;
  return { studentId: student.id, name: student.name, classId: student.classId,
           signals, score: signals.reduce((s,x)=>s+x.sev,0) };
}

      acc[c.id] = acc[c.id] || {s:0,n:0};
      acc[c.id].s += n; acc[c.id].n++;
    }

  const out = {};
  for(const k of Object.keys(acc)) out[k] = { avg: acc[k].s/acc[k].n, letter: numToLetter(acc[k].s/acc[k].n), n: acc[k].n };

}
function activitiesFor(classId, date){

function studentSkillAverages(studentId, classId){

    acc[a.skill].s += n; acc[a.skill].n++;
  }
  const out = {};
  for(const k of Object.keys(acc)) out[k] = { avg: acc[k].s/acc[k].n, letter: numToLetter(acc[k].s/acc[k].n), n: acc[k].n };

/* ---------- rubric mutators ---------- */
function syncRubricOverall(a, studentId){
  const rub = (a.rubric||{})[studentId];
  const L = rubricCount(rub) ? rubricOverallLetter(rub, a.weights) : null;
  a.grades = a.grades || {};
  if(L) a.grades[studentId] = L; else delete a.grades[studentId];
  return L;
}
function setRubricGrade(activityId, studentId, critId, letter){
  const a = activityById(activityId);
  if(!a) return;
  a.rubric = a.rubric || {};
  a.rubric[studentId] = a.rubric[studentId] || {};
  if(a.rubric[studentId][critId] === letter) delete a.rubric[studentId][critId];  // tap again to clear
  else a.rubric[studentId][critId] = letter;
  if(!rubricCount(a.rubric[studentId])) delete a.rubric[studentId];
  syncRubricOverall(a, studentId);
  saveActivitiesStore();
  refreshRubricRow(a, studentId);
}
function setActivityWeight(activityId, critId, val){
  const a = activityById(activityId);
  if(!a) return;
  a.weights = { ...activityWeights(a).raw, [critId]: Math.max(0, Number(val)||0) };
  Object.keys(a.rubric||{}).forEach(sid=>syncRubricOverall(a, sid));
  saveActivitiesStore();

}
function resetActivityWeights(activityId){

function deleteActivity(activityId){

  closeModal();

  });

function isSessionCompleted(classId, date){
  // Past sessions auto-count; today needs explicit completion; future never counts
  if(date < todayStr()) return true;
  if(date > todayStr()) return false;
  return !!(state.sessionMeta && state.sessionMeta[classId+'_'+date]?.completed);
}
function toggleSessionCompleted(classId, date){
  if(!state.sessionMeta) state.sessionMeta = {};
  const key = classId+'_'+date;
  if(!state.sessionMeta[key]) state.sessionMeta[key] = {};
  state.sessionMeta[key].completed = !state.sessionMeta[key].completed;
  scheduleSave('sessionMeta', state.sessionMeta);
  refreshView();
}

function getCurrentRecord(studentId){
  const key = state.rollcall.classId + '_' + state.rollcall.date;
  if(!state.sessions[key]) state.sessions[key] = {};
  if(!state.sessions[key][studentId]) state.sessions[key][studentId] = defaultRecord();
  return state.sessions[key][studentId];
}
function persistSessions(){ scheduleSave('sessions', state.sessions); }
function setAttendance(studentId, val){
  getCurrentRecord(studentId).attendance = val;
  persistSessions();
  refreshView();
}
function adjustField(studentId, field, delta){
  const rec = getCurrentRecord(studentId);
  if(field==='hw'){
    rec[field] = Math.min(100, Math.max(0, (rec[field]??100) + delta));
  } else {
    rec[field] = Math.max(0, rec[field] + delta);
  }
  persistSessions();
  refreshView();
}
function setNumField(studentId, field, value, min=0, max=Infinity){
  const rec = getCurrentRecord(studentId);
  let n = parseInt(value);
  if(isNaN(n)) n = min;
  rec[field] = Math.min(max, Math.max(min, n));
  persistSessions();
  refreshView();
}
function bumpField(studentId, field, delta){
  const rec = getCurrentRecord(studentId);
  rec[field] = Math.max(0, (rec[field]||0) + delta);
  persistSessions();
  refreshView();
}
function setField(studentId, field, val){
  const rec = getCurrentRecord(studentId);
  rec[field] = rec[field]===val ? null : val;
  persistSessions();
  refreshView();
}
function setLateHwOutcome(studentId, val){
  const rec = getCurrentRecord(studentId);
  rec.lateHwOutcome = val;
  if(val){
    // Snapshot WHICH homework this refers to, so the report still makes sense
    // months later even if the previous session is edited afterwards.
    const cls = classById(state.rollcall.classId);
    const prevDate = cls ? getPreviousClassDate(cls, state.rollcall.date) : null;
    const prev = prevDate ? (state.sessions[cls.id+'_'+prevDate]||{})[studentId] : null;
    rec.lateHwFor = prevDate || null;
    rec.lateHwPrevPct = (prev && prev.attendance!=='absent' && prev.hw!=null) ? hwValueOf(prev) : null;
  } else {
    delete rec.lateHwFor;
    delete rec.lateHwPrevPct;
  }
  persistSessions();
  refreshView();
}
function setNote(studentId, val){
  getCurrentRecord(studentId).notes = val;
  persistSessions();
}
function toggleDrawer(studentId){
  state.openDrawer = state.openDrawer===studentId ? null : studentId;
  refreshView();
}
function toggleClassView(){
  const pref = localStorage.getItem('classViewCollapsed');
  const narrow = window.matchMedia('(max-width: 700px)').matches;
  const collapsed = pref===null ? narrow : pref==='1';
  localStorage.setItem('classViewCollapsed', collapsed ? '0' : '1');

function markAllPresent(){ markAll('present'); }
/* With a thin class it's quicker to mark everyone absent and tick off the few
   who turned up. Absence is the consequential state, so this one confirms
   first — and only when it would overwrite attendance already taken. */
function markAllAbsent(){
  const students = studentsInClass(state.rollcall.classId);
  const key = state.rollcall.classId + '_' + state.rollcall.date;
  const session = state.sessions[key] || {};
  const alreadyPresent = students.filter(s => session[s.id] && session[s.id].attendance === 'present').length;
  if(alreadyPresent && !confirm(
      `Mark all ${students.length} students absent?\n\n`
    + `${alreadyPresent} ${alreadyPresent===1?'is':'are'} currently marked present — that will be overwritten. `
    + `Then tap P for each student who turned up.`)) return;
  markAll('absent');

function markAll(value){

}
function setRollcallClass(classId){
  if(classId === '__all__'){   // reveal all active classes for a makeup on this date
    state.rollcallShowAll = true;
    refreshView();
    return;
  }
  state.rollcall.classId = classId;
  state.openDrawer = null;
  state.rcTab = 'now';   // a different class always opens on its register
  refreshView();

/* Previous / next scheduled session of a class, used by both the Roll Call
   arrows and their disabled state so the button and the jump always agree.
   getNextClassDate already stops at cls.endDate; the back direction has to
   respect cls.startDate itself. Holidays are skipped by both helpers. */
function rollcallSessionNeighbors(cls, date){
  if(!cls || !date) return { prev:null, next:null };
  let prev = getPreviousClassDate(cls, date);
  if(prev && cls.startDate && prev < cls.startDate) prev = null;
  return { prev, next: getNextClassDate(cls, date) };
}
function navRollcallSession(dir){
  const cls = classById(state.rollcall.classId);
  if(!cls) return;
  const { prev, next } = rollcallSessionNeighbors(cls, state.rollcall.date);
  const target = dir < 0 ? prev : next;
  if(target) setRollcallDate(target);   // always a scheduled day, so the class stays selected
}
function setRollcallDate(date){
  state.rollcall.date = date;
  state.openDrawer = null;
  state.rcTab = 'now';
  state.rollcallShowAll = false;   // a new date starts from the clean scheduled list
  const dow = new Date(date+'T00:00:00').getDay();
  const cls = classById(state.rollcall.classId);
  if(!cls || !getClassDays(cls).includes(dow)){
    const sched = sortByClassTime(activeClasses().filter(c=>getClassDays(c).includes(dow)));
    state.rollcall.classId = sched[0] ? sched[0].id : null;
  }
  refreshView();
}
function openRollCallNav(){
  const dow = new Date(state.rollcall.date+'T00:00:00').getDay();
  const cls = classById(state.rollcall.classId);
  if(!cls || cls.archived || !getClassDays(cls).includes(dow)){
    const sched = sortByClassTime(activeClasses().filter(c=>getClassDays(c).includes(dow)));
    state.rollcall.classId = sched[0] ? sched[0].id : null;
  }
  navigate('rollcall');
}

/* ================= STUDENT PROFILE ================= */
/* ---------- plain-text student report ----------
   A copy-pasteable block for the school's report card.

   Numbers come from lastReportStats — the figures renderStudentProfile()
   already computed — so the text can never disagree with the on-screen report.

   The prose comments come from a comment bank of five categories x five
   levels x six phrasings, in Brazilian Portuguese, written in a teacher's
   first-person voice and woven into paragraphs by rcCommentLines() so the
   block reads as a letter home rather than a list of graded labels.
   Behavior and homework levels are auto-selected from measured
   participation/homework; vocab, grammar and Portuguese use are not measured
   here, so they stay off unless the teacher sets them, rather than putting an
   unsupported grade on an official document.
*/
