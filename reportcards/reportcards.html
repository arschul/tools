<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --card: #1c2030;
    --card2: #212638;
    --border: #2a3048;
    --border2: #343d5c;
    --text: #e8eaf2;
    --muted: #7a84a8;
    --accent: #5b8dee;
    --accent2: #3d6bd4;
    --c1: #e55555;
    --c2: #e5873a;
    --c3: #d4b93e;
    --c4: #5aaf6e;
    --c5: #3cb8a0;
    --radius: 14px;
    --font-body: 'DM Sans', sans-serif;
    --font-display: 'DM Serif Display', serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
  }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  #topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px 18px 170px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #topbar-title {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-style: italic;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  #topbar-title span { color: var(--accent); font-style: normal; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 18px;
    border-radius: 8px;
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    letter-spacing: 0.01em;
  }
  .btn-ghost {
    background: var(--card);
    border: 1px solid var(--border2);
    color: var(--muted);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); }

  #workspace { flex: 1; display: flex; align-items: flex-start; }

  #editor-panel {
    width: 380px;
    min-width: 340px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 65px;
    max-height: calc(100vh - 65px);
    overflow-y: auto;
  }
  #editor-panel::-webkit-scrollbar { width: 4px; }
  #editor-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .field-group label {
    display: block;
    font-size: 0.73rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field-group input[type="text"] {
    width: 100%;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .field-group input[type="text"]:focus { border-color: var(--accent); }
  .field-group input[type="text"]::placeholder { color: var(--muted); }

  .slider-block { display: flex; flex-direction: column; gap: 8px; }
  .slider-header { display: flex; align-items: center; justify-content: space-between; }
  .slider-label { font-size: 0.82rem; font-weight: 500; color: var(--text); }
  .slider-badge {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    color: #fff;
    transition: background 0.2s;
    letter-spacing: 0.02em;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 1px 6px rgba(0,0,0,0.4);
    transition: transform 0.1s;
  }
  input[type="range"]::-webkit-slider-thumb:active { transform: scale(1.2); }

  .divider { height: 1px; background: var(--border); }

  #preview-panel {
    flex: 1;
    padding: 32px 32px 48px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  #report-card {
    width: 100%;
    max-width: 580px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .rc-header {
    padding: 28px 32px 22px;
    background: linear-gradient(135deg, #1a2240 0%, #1c2a4a 100%);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .rc-school {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .rc-student {
    font-family: var(--font-display);
    font-size: 1.7rem;
    color: var(--text);
    line-height: 1.1;
  }
  .rc-date { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
  .rc-avatar {
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: #fff;
    flex-shrink: 0;
  }

  .rc-scores {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .rc-score-cell {
    padding: 14px 8px;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .rc-score-cell:last-child { border-right: none; }
  .rc-score-icon { font-size: 1.1rem; margin-bottom: 4px; }
  .rc-score-val {
    font-family: var(--font-display);
    font-size: 1.5rem;
    line-height: 1;
    font-weight: 400;
  }
  .rc-score-key {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 3px;
  }

  .rc-body { padding: 26px 32px 30px; display: flex; flex-direction: column; gap: 20px; }

  .rc-section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .rc-section-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .rc-section-title {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    flex: 1;
  }
  .rc-section-stars { display: flex; gap: 2px; }
  .rc-section-star { width: 8px; height: 8px; border-radius: 2px; }
  .rc-section-text {
    font-size: 0.88rem;
    color: #c8cfe8;
    line-height: 1.6;
    padding-left: 18px;
    border-left: 2px solid var(--border);
  }

  .rc-lead, .rc-para, .rc-signoff {
    font-size: 0.9rem;
    color: #d7dcf0;
    line-height: 1.62;
  }
  .rc-lead, .rc-para, .rc-signoff { margin: 0; }

  .rc-footer {
    padding: 16px 32px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rc-footer-text { font-size: 0.72rem; color: var(--muted); font-style: italic; }
  #copy-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 16px;
    background: var(--card2);
    border: 1px solid var(--border2);
    border-radius: 7px;
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 0.78rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  #copy-btn:hover { color: var(--text); border-color: var(--accent); }
  #copy-btn.copied { color: var(--c5); border-color: var(--c5); }

  #toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--c5);
    color: #0d1a17;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  * { scrollbar-width: thin; scrollbar-color: var(--border2) transparent; }

  .back-link {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 100000;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.18);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .back-link:hover { background: rgba(0,0,0,0.78); transform: translateX(-2px); }
</style>
</head>

<script>

];

/* Comment bank written as a teacher's note to the family: third person,
   first-person teacher voice, five categories x five levels x six phrasings.
   {n} is the student's first name. No adjectives that agree with the
   student, so nothing to get wrong, and no dashes or semicolons, which read
   as machine-written. */
const COMMENTS = {"vocab": {"1": ["Tenho notado que {n} trava quando falta a palavra certa, e isso deixa a conversa mais difícil do que precisaria ser. Sugiro começar pequeno, com cinco palavras novas por aula anotadas num caderno separado e revisadas antes da aula seguinte.", "O repertório de palavras ainda está bem abaixo do que a turma usa, e dá para ver a frustração quando a ideia existe mas a palavra não vem. Dez minutos por dia com flashcards, no Anki ou no Quizlet, já mudariam bastante esse quadro.", "Nas atividades de fala, {n} tem coragem, mas fica sem palavras para sustentar a conversa. Vale montar listas por tema, como casa, escola e rotina, e revisá-las toda semana.", "Ainda faltam palavras básicas para as situações que trabalhamos em aula, e isso acaba travando o resto do aprendizado. Ler textos bem curtos em inglês, um por semana, é o jeito mais leve de começar a virar esse jogo.", "Percebo que {n} entende bastante coisa, mas na hora de produzir tem pouquíssimas palavras à mão. Repetir as palavras novas em voz alta e montar uma frase própria com cada uma ajuda muito a fixar.", "Esse é o ponto que mais precisa de atenção agora. Sem ampliar o vocabulário, os próximos conteúdos vão ficar pesados demais. Anotar e revisar toda palavra nova que aparece na aula já seria um ótimo começo."], "2": ["{n} já se vira nas situações mais simples, mas o vocabulário ainda é curto para conversas mais longas. Ler uma história ou uma notícia curta por semana ampliaria bastante o repertório.", "Dá para se comunicar, sim, mas ainda vejo muita repetição das mesmas palavras. Escolher três palavras novas por semana e usá-las de verdade em aula muda bastante o resultado.", "Tenho visto esforço, e o vocabulário básico está lá. O que falta é variedade para as ideias saírem do jeito que {n} quer. Rever as palavras da aula e criar exemplos próprios com elas é o exercício que mais funciona nessa fase.", "Vejo capacidade, mas o vocabulário ainda não acompanha o ritmo do curso. Uma li function clashes(a, b) {
  if (!a || !b) return false;
  var head = function(s) { return s.split(/\s+/).slice(0, 2).join(' ').toLowerCase(); };
  // Two sentences that both open with the name read like a template.
  var byName = function(s) { return s.indexOf('{n}') === 0; };
  return head(a) === head(b) || (byName(a) && byName(b)) ||
    (/parab\u00e9ns/i.test(a) && /parab\u00e9ns/i.test(b));
}
function pickDistinct(pool, taken) {
  var pick = pickFrom(pool);
  for (var t = 0; t < 12; t++) {
    var bad = false;
    for (var k = 0; k < taken.length; k++) if (clashes(pick, taken[k])) { bad = true; break; }
    if (!bad) break;
    pick = pickFrom(pool);
  }
  return pick;
}
function takenExcept(cat) {
  var out = [];
  for (var k in currentComments) if (k !== cat && currentComments[k]) out.push(currentComments[k]);
  if (currentLead && cat !== '__lead') out.push(currentLead);
  return out;
}

// Tone of the opening and closing lines follows the average of the sliders,
// so a rough period does not get a cheerful frame around it.
function toneNow() {
  var cats = ['vocab','grammar','behavior','port','homework'];
  var sum = 0;
  for (var i = 0; i < cats.length; i++) {
    sum += +document.getElementById('sl-' + cats[i]).value;
  }
  var avg = sum / cats.length;
  return avg >= 4 ? 'high' : avg <= 2.3 ? 'low' : 'mid';
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function firstName() {
  var raw = document.getElementById('student-name').value.trim();
  return raw ? raw.split(/\s+/)[0] : '';
}

/* Fills {n} with the first name. Before a name is typed the preview says
   "o aluno", with the Portuguese contractions fixed so "o período de o aluno"
   reads "do aluno", and capitalized where it opens a sentence. */
function fill(txt) {
  var name = firstName();
  var out = String(txt || '');
  if (name) return out.replace(/\{n\}/g, esc(name));
  return out.replace(/\{n\}/g, 'o aluno')
    .replace(/\bde o aluno\b/g, 'do aluno')
    .replace(/\bem o aluno\b/g, 'no aluno')
    .replace(/\bpor o aluno\b/g, 'pelo aluno')
    .replace(/(^|\s)a o aluno\b/g, '$1ao aluno')
    .replace(/(^|[.!?]\s+)o aluno/g, '$1O aluno');
}

// ── INIT ──────────────────────────────────────────────────────────────────────

function init() {
  updateDate();
  updateAllBadges();
  generateAllComments();
  renderPreview();
}

function updateDate() {
  var now = new Date();
  var months = ['janeiro','fevereiro','mar\u00e7o','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  document.getElementById('rc-date').textContent =
    now.getDate() + ' de ' + months[now.getMonth()] + ' de ' + now.getFullYear();
}

function generateAllComments() {
  currentComments = {};
  currentLead = pickFrom(OPENERS[toneNow()]);
  var cats = ['vocab','grammar','port','behavior','homework'];
  for (var i = 0; i < cats.length; i++) {
    var cat = cats[i];
    var val = +document.getElementById('sl-' + cat).value;
    currentComments[cat] = pickDistinct(COMMENTS[cat][val], takenExcept(cat));
  }
  refreshSignoff();
}

// The frame follows the sliders, so it is repicked whenever one moves.
function refreshFrame() {
  currentLead = pickDistinct(OPENERS[toneNow()], takenExcept('__lead'));
  refreshSignoff();
}
function refreshSignoff() {
  currentSignoff = pickDistinct(CLOSERS[toneNow()], takenExcept(''));
}

// ── BADGES ───────────────────────────────────────────────────────────────────

var sliderMap = {
  'sl-vocab':    { badge: 'badge-vocab',    cat: 'vocab' },
  'sl-grammar':  { badge: 'badge-grammar',  cat: 'grammar' },
  'sl-behavior': { badge: 'badge-behavior', cat: 'behavior' },
  'sl-port':     { badge: 'badge-port',     cat: 'port' },
  'sl-homework': { badge: 'badge-homework', cat: 'homework' }
};

function updateBadge(sliderId) {
  var info = sliderMap[sliderId];
  var val = +document.getElementById(sliderId).value;
  var el = document.getElementById(info.badge);
  el.textContent = RATINGS[val];
  el.style.background = LEVEL_COLORS[val];
  var pct = ((val - 1) / 4) * 100;
  document.getElementById(sliderId).style.background =
    'linear-gradient(to right, ' + LEVEL_COLORS[val] + ' ' + pct + '%, #2a3048 ' + pct + '%)';
}

function updateAllBadges() {
  var ids = Object.keys(sliderMap);
  for (var i = 0; i < ids.length; i++) {
    updateBadge(ids[i]);
  }
}

// ── PREVIEW ──────────────────────────────────────────────────────────────────

var CAT_META = [
  { key: 'vocab',    label: 'Vocabul\u00e1rio',     icon: '\uD83D\uDCDA', slId: 'sl-vocab' },
  { key: 'grammar',  label: 'Gram\u00e1tica',        icon: '\uD83D\uDCDD', slId: 'sl-grammar' },
  { key: 'behavior', label: 'Comportamento',    icon: '\u2B50', slId: 'sl-behavior' },
  { key: 'port',     label: 'Uso de Portugu\u00eas', icon: '\uD83C\uDDE7\uD83C\uDDF7', slId: 'sl-port' },
  { key: 'homework', label: 'Tarefas de Casa',  icon: '\uD83D\uDCCB', slId: 'sl-homework' }
];

function renderPreview() {
  var name = document.getElementById('student-name').value.trim() || '\u2014';
  var initials = name === '\u2014' ? '?' :
    name.split(' ').slice(0,2).map(function(w){ return w[0]; }).join('').toUpperCase();

  document.getElementById('rc-name').textContent = name;
  var av = document.getElementById('rc-avatar');
  av.textContent = initials;
  av.style.background = avatarColor;

  // Scores row
  var scoresEl = document.getElementById('rc-scores');
  scoresEl.innerHTML = '';
  for (var i = 0; i < CAT_META.length; i++) {
    var m = CAT_META[i];
    var val = +document.getElementById(m.slId).value;
    var col = LEVEL_COLORS[val];
    var cell = document.createElement('div');
    cell.className = 'rc-score-cell';
    cell.innerHTML =
      '<div class="rc-score-icon">' + m.icon + '</div>' +
      '<div class="rc-score-val" style="color:' + col + '">' + val + '</div>' +
      '<div class="rc-score-key">' + m.label.split(' ')[0] + '</div>';
    scoresEl.appendChild(cell);
  }

  // The note itself: an opening, a paragraph on language, a paragraph on
  // classroom habits, and a closing line to the family. The scores row above
  // keeps the numbers, so the prose carries no labels.
  var bodyEl = document.getElementById('rc-body');
  bodyEl.innerHTML = '';
  var paras = notePars();
  for (var p = 0; p < paras.length; p++) {
    var el = document.createElement('p');
    el.className = p === 0 ? 'rc-lead' : (p === paras.length - 1 ? 'rc-signoff' : 'rc-para');
    el.innerHTML = paras[p];
    bodyEl.appendChild(el);
  }
}

function notePars() {
  var lang = ['vocab','grammar','port'].map(function(k) { return fill(currentComments[k]); });
  var habits = ['behavior','homework'].map(function(k) { return fill(currentComments[k]); });
  return [
    [fill(currentLead)].concat(lang).filter(Boolean).join(' '),
    habits.filter(Boolean).join(' '),
    fill(currentSignoff)
  ].filter(Boolean);
}

// fill() escapes for innerHTML; the clipboard wants the real characters back.
function plain(s) {
  return String(s).replace(/&quot;/g, '"').replace(/&gt;/g, '>')
    .replace(/&lt;/g, '<').replace(/&amp;/g, '&');
}

function buildPlainText() {
  var name = document.getElementById('student-name').value.trim() || '\u2014';
  var now = new Date();
  var months = ['janeiro','fevereiro','mar\u00e7o','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var head = 'RELAT\u00d3RIO DE DESEMPENHO\n' + name + '\n' +
    now.getDate() + ' de ' + months[now.getMonth()] + ' de ' + now.getFullYear();
  return head + '\n\n' + notePars().map(plain).join('\n\n');
}

// ── EVENTS ───────────────────────────────────────────────────────────────────

document.getElementById('student-name').addEventListener('input', renderPreview);


(function() {
  var ids = Object.keys(sliderMap);
  for (var i = 0; i < ids.length; i++) {
    (function(slId) {
      document.getElementById(slId).addEventListener('input', function() {
        var cat = sliderMap[slId].cat;
        var val = +document.getElementById(slId).value;
        currentComments[cat] = pickDistinct(COMMENTS[cat][val], takenExcept(cat));
        refreshFrame();
        updateBadge(slId);
        renderPreview();
      });
    })(ids[i]);
  }
})();

document.getElementById('regen-btn').addEventListener('click', function() {
  generateAllComments();
  renderPreview();
  showToast('Textos regenerados!');
});

document.getElementById('copy-btn').addEventListener('click', function() {
  navigator.clipboard.writeText(buildPlainText()).then(function() {
    var btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    btn.querySelector('svg').innerHTML = '<path d="M2 7l4 4L11 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
    showToast('Boletim copiado!');
    setTimeout(function() {
      btn.classList.remove('copied');
      btn.querySelector('svg').innerHTML = '<rect x="4.5" y="4.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M8.5 4.5V3A1.5 1.5 0 007 1.5H3A1.5 1.5 0 001.5 3v4A1.5 1.5 0 003 8.5h1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>';
    }, 2500);
  });
});

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = '\u2713 ' + msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}

// ── GO ────────────────────────────────────────────────────────────────────────
init();
</script>
</body>
