<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StorySpark ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Karla:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:   #F3EFF9;
    --panel:   #FFFFFF;
    --ink:     #241C3B;
    --ink-soft:#6B6485;
    --line:    #DDD5EC;
    --pink:    #FF5D8F;
    --teal:    #10A99B;
    --yellow:  #FFC846;
    --blue:    #4C6EF5;
    --shadow:  rgba(36,28,59,0.14);
    --hard:    #241C3B;
  }
  [data-theme="dark"] {
    --paper:   #17122B;
    --panel:   #241C3B;
    --ink:     #F1EDFA;
    --ink-soft:#A79FC4;
    --line:    #3B3159;
    --pink:    #FF7BA4;
    --teal:    #2ED3C2;
    --yellow:  #FFD166;
    --blue:    #7C93FF;
    --shadow:  rgba(0,0,0,0.5);
    --hard:    #0C0918;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 4.5rem 1.1rem 3rem;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,93,143,0.10), transparent 42%),
      radial-gradient(circle at 88% 18%, rgba(76,110,245,0.10), transparent 45%);
    color: var(--ink);
    font-family: 'Karla', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    min-height: 100vh;
    transition: background-color .25s ease, color .25s ease;
  }

  h1, h2, h3, .display { font-family: 'Bricolage Grotesque', system-ui, sans-serif; }
  .mono { font-family: 'Space Mono', monospace; }

  /* Top bar */
  .back-link {
    position: fixed; top: 14px; left: 14px; z-index: 60;
    padding: 8px 16px;
    background: var(--hard); color: #fff;
    text-decoration: none; border-radius: 999px;
    font-family: 'Space Mono', monospace; font-size: 12px;
    border: 2px solid var(--hard);
    transition: transform .18s ease;
  }
  .back-link:hover { transform: translateX(-3px); }

  .topright {
    position: fixed; top: 14px; right: 14px; z-index: 60;
    display: flex; gap: 8px;
  }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    background: var(--panel); color: var(--ink);
    font-size: 16px; cursor: pointer;
    display: grid; place-items: center;
    transition: transform .18s ease, background .18s ease;
  }
  .icon-btn:hover { transform: translateY(-2px); background: var(--yellow); }
  .icon-btn.on { background: var(--yellow); }

  /* Header */
  header { text-align: center; max-width: 1180px; margin: 0 auto 1.4rem; }
  header h1 {
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    font-weight: 800; margin: 0; letter-spacing: -0.03em;
  }
  header h1 em { font-style: normal; color: var(--pink); }
  header p { margin: .35rem 0 0; color: var(--ink-soft); font-size: .98rem; }

  .wrap { max-width: 1180px; margin: 0 auto; }

  /* Panels */
  .panel {
    background: var(--panel);
    border: 2px solid var(--ink);
    border-radius: 18px;
    box-shadow: 5px 5px 0 var(--shadow);
    padding: 1.1rem 1.2rem;
    margin-bottom: 1.1rem;
  }
  .panel-title {
    font-family: 'Space Mono', monospace;
    font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 .8rem;
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
  }

  /* Controls */
  .chip-row { display: flex; flex-wrap: wrap; gap: .45rem; }
  .chip {
    font-family: 'Karla', sans-serif; font-weight: 700; font-size: .86rem;
    padding: .42rem .85rem;
    border: 2px solid var(--line);
    background: transparent; color: var(--ink-soft);
    border-radius: 999px; cursor: pointer;
    transition: all .16s ease;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip.lvl.active { background: var(--blue); border-color: var(--blue); color: #fff; }

  .control-split { display: grid; gap: .9rem; grid-template-columns: 1fr; }
  @media (min-width: 780px) { .control-split { grid-template-columns: auto 1fr; align-items: start; } }
  .ctl-label {
    font-family: 'Space Mono', monospace; font-size: .68rem;
    letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft);
    margin-bottom: .4rem;
  }

  .roll-btn {
    width: 100%; margin-top: 1rem;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800; font-size: clamp(1.1rem, 3vw, 1.5rem);
    letter-spacing: -0.01em;
    padding: .85rem 1rem;
    color: #fff; background: var(--pink);
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .roll-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .roll-btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }

  /* The machine */
  .machine { display: flex; flex-direction: column; gap: .55rem; }
  .reel {
    display: grid;
    grid-template-columns: 74px 1fr auto;
    align-items: stretch;
    border: 2px solid var(--ink);
    border-radius: 12px;
    overflow: hidden;
    background: var(--panel);
  }
  .reel-tag {
    font-family: 'Space Mono', monospace; font-size: .62rem;
    letter-spacing: .08em;
    display: grid; place-items: center; text-align: center;
    color: #fff; padding: .3rem;
  }
  .reel[data-slot="who"]   .reel-tag { background: var(--pink); }
  .reel[data-slot="wants"] .reel-tag { background: var(--blue); }
  .reel[data-slot="but"]   .reel-tag { background: var(--teal); }
  .reel[data-slot="twist"] .reel-tag { background: var(--ink); }

  .reel-text {
    padding: .7rem .85rem;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: clamp(1.02rem, 2.3vw, 1.32rem);
    line-height: 1.3;
    display: flex; align-items: center;
    min-height: 3.2rem;
    transition: opacity .12s linear, filter .12s linear;
  }
  .reel-ctl { display: flex; align-items: center; gap: 2px; padding-right: .4rem; }
  .mini {
    width: 32px; height: 32px; border-radius: 9px;
    border: none; background: transparent; cursor: pointer;
    font-size: 15px; opacity: .5;
    transition: opacity .15s ease, transform .15s ease;
  }
  .mini:hover { opacity: 1; transform: scale(1.15); }
  .reel.locked { background: color-mix(in srgb, var(--yellow) 22%, var(--panel)); }
  .reel.locked .mini.lock { opacity: 1; }
  .rolling .reel-text { opacity: .35; filter: blur(1.5px); }

  /* Title + bonus words */
  .strip {
    display: flex; flex-wrap: wrap; align-items: center; gap: .55rem;
    margin-top: .85rem; padding-top: .85rem;
    border-top: 2px dashed var(--line);
  }
  .strip-label {
    font-family: 'Space Mono', monospace; font-size: .64rem;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
  }
  .story-title {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: clamp(1rem, 2.4vw, 1.25rem);
  }
  .wordchip {
    font-weight: 700; font-size: .9rem;
    padding: .3rem .7rem;
    border-radius: 999px;
    background: var(--yellow); color: #241C3B;
    border: 2px solid var(--ink);
  }

  /* Spine */
  .layout { display: grid; gap: 1.1rem; grid-template-columns: 1fr; }
  @media (min-width: 940px) { .layout { grid-template-columns: 1.55fr 1fr; align-items: start; } }

  .connectors { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .9rem; }
  .conn {
    font-family: 'Space Mono', monospace; font-size: .74rem;
    padding: .3rem .6rem; border-radius: 8px;
    border: 2px solid var(--line); background: transparent;
    color: var(--ink-soft); cursor: pointer;
    transition: all .15s ease;
  }
  .conn:hover { border-color: var(--teal); color: var(--teal); }

  .beat { margin-bottom: .9rem; }
  .beat-head { display: flex; align-items: baseline; gap: .5rem; margin-bottom: .3rem; flex-wrap: wrap; }
  .beat-name { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 1.02rem; }
  .beat-q { font-size: .82rem; color: var(--ink-soft); }
  .beat textarea {
    width: 100%; min-height: 92px; resize: vertical;
    padding: .7rem .8rem;
    font-family: 'Karla', sans-serif; font-size: 1.02rem; line-height: 1.55;
    color: var(--ink); background: var(--paper);
    border: 2px solid var(--line); border-radius: 12px;
    transition: border-color .15s ease;
  }
  .beat textarea:focus { outline: none; border-color: var(--blue); }
  .beat textarea::placeholder { color: var(--ink-soft); opacity: .65; }

  .twist-btn {
    width: 100%;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800;
    font-size: 1.05rem; padding: .7rem;
    background: var(--teal); color: #fff;
    border: 2px solid var(--ink); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .twist-btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
  .twist-card {
    margin-top: .7rem; padding: .8rem .9rem;
    border: 2px dashed var(--teal); border-radius: 12px;
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600;
    font-size: 1.1rem;
    display: none;
  }
  .twist-card.show { display: block; animation: pop .3s ease; }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* Spark box */
  .sparkbox { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: .5rem; }
  .spark-item {
    border: 2px solid var(--line); border-radius: 11px;
    padding: .55rem .65rem; cursor: pointer;
    font-size: .87rem; line-height: 1.35;
    transition: border-color .15s ease, transform .15s ease;
  }
  .spark-item:hover { border-color: var(--pink); transform: translateX(3px); }
  .si-top { display: flex; justify-content: space-between; gap: .5rem; align-items: flex-start; margin-bottom: .25rem; }
  .si-lvl {
    font-family: 'Space Mono', monospace; font-size: .62rem;
    color: #fff; background: var(--blue); padding: 1px 6px; border-radius: 5px;
  }
  .star { background: none; border: none; cursor: pointer; font-size: .95rem; opacity: .35; padding: 0 2px; color: var(--ink); }
  .star.on { opacity: 1; color: var(--yellow); }
  .empty-note { color: var(--ink-soft); font-size: .88rem; }

  .btn-row { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .9rem; }
  .btn-sm {
    font-family: 'Karla', sans-serif; font-weight: 700; font-size: .84rem;
    padding: .42rem .8rem; border-radius: 9px;
    border: 2px solid var(--ink); background: var(--panel); color: var(--ink);
    cursor: pointer; transition: all .15s ease;
  }
  .btn-sm:hover { background: var(--ink); color: var(--paper); }

  /* Big screen mode */
  body.bigscreen .hide-on-big { display: none !important; }
  body.bigscreen .reel-text { font-size: clamp(1.5rem, 4.2vw, 3rem); min-height: 4.6rem; }
  body.bigscreen .reel-tag  { font-size: .78rem; }
  body.bigscreen .reel { grid-template-columns: 108px 1fr auto; }
  body.bigscreen .story-title { font-size: clamp(1.3rem, 3.4vw, 2.1rem); }
  body.bigscreen .wordchip { font-size: 1.2rem; padding: .4rem 1rem; }
  body.bigscreen header h1 { font-size: clamp(2rem, 5vw, 2.6rem); }

  /* Print */
  #printSheet { display: none; }
  @media print {
    body { padding: 0; background: #fff; color: #000; }
    body > *:not(#printSheet) { display: none !important; }
    #printSheet { display: block; font-family: 'Karla', sans-serif; }
    #printSheet h2 { font-size: 20pt; margin: 0 0 4pt; }
    #printSheet .p-spark { font-size: 13pt; line-height: 1.5; margin-bottom: 10pt; border-bottom: 2px solid #000; padding-bottom: 8pt; }
    #printSheet .p-beat { margin-bottom: 10pt; page-break-inside: avoid; }
    #printSheet .p-beat b { font-size: 12pt; }
    #printSheet .p-beat span { font-size: 10pt; color: #444; }
    #printSheet .rule { border-bottom: 1px solid #999; height: 20pt; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .rolling .reel-text { opacity: 1; filter: none; }
  }
</style>
</head>
<body>

<a class="back-link" href="../">← Tool Hub</a>
<div class="topright">
  <button class="icon-btn" id="bigBtn" onclick="toggleBig()" title="Big screen mode">⛶</button>
  <button class="icon-btn" onclick="toggleTheme()" title="Light or dark">◐</button>
</div>

<header>
  <h1>Story<em>Spark</em></h1>
  <p class="hide-on-big">Roll a story. Lock the bits you like. Write the rest.</p>
</header>

<div class="wrap">

  <div class="panel hide-on-big">
    <div class="control-split">
      <div>
        <div class="ctl-label">Level</div>
        <div class="chip-row" id="levelRow"></div>
      </div>
      <div>
        <div class="ctl-label">Flavour</div>
        <div class="chip-row" id="genreRow"></div>
      </div>
    </div>
    <button class="roll-btn" onclick="rollAll()">🎲 Roll a story</button>
  </div>

  <div class="panel">
    <div class="panel-title hide-on-big">Your spark <span class="mono" style="opacity:.65">🔒 keeps a line &nbsp;·&nbsp; 🎲 swaps it</span></div>
    <div class="machine" id="machine"></div>

    <div class="strip">
      <span class="strip-label">Title</span>
      <span class="story-title" id="titleOut">—</span>
      <button class="mini" onclick="rollTitle()" title="New title">🎲</button>
    </div>

    <div class="strip">
      <span class="strip-label">Bonus words</span>
      <span id="wordsOut" style="display:flex;gap:.4rem;flex-wrap:wrap;"></span>
      <button class="mini" onclick="rollWords()" title="New words">🎲</button>
      <span class="strip-label" style="opacity:.7">style points if you use them</span>
    </div>
  </div>

  <div class="layout hide-on-big">

    <div>
      <div class="panel">
        <div class="panel-title">Your story · four beats</div>
        <div class="connectors" id="connectors"></div>
        <div id="beats"></div>
        <div class="btn-row">
          <button class="btn-sm" onclick="copyStory()" id="copyBtn">Copy story</button>
          <button class="btn-sm" onclick="printSheet()">Print a sheet</button>
          <button class="btn-sm" onclick="clearBeats()">Clear writing</button>
        </div>
      </div>

      <div class="panel">
        <button class="twist-btn" onclick="plotTwist()">🌀 Plot twist!</button>
        <div class="twist-card" id="twistCard"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Spark box <span class="mono" id="boxCount" style="opacity:.65"></span></div>
      <div class="sparkbox" id="sparkbox"></div>
      <div class="btn-row">
        <button class="btn-sm" onclick="clearBox()">Empty the box</button>
      </div>
    </div>

  </div>
</div>

<div id="printSheet"></div>

<script>
/* ===========================================================
   StorySpark 2.0 - data
   Grammar contract, so every combination reads correctly:
     who   = noun phrase starting "A / An ..."
     wants = "wants to " + bare infinitive
     but   = "but ..." (the character is always "they")
     twist = a complete sentence
   =========================================================== */

var GENRES = [
  { id: "all",      label: "Everything", icon: "🎲" },
  { id: "everyday", label: "Everyday",   icon: "🏠" },
  { id: "school",   label: "School",     icon: "🎒" },
  { id: "fantasy",  label: "Fantasy",    icon: "🐉" },
  { id: "mystery",  label: "Mystery",    icon: "🔍" },
  { id: "scifi",    label: "Sci-fi",     icon: "🛸" },
  { id: "spooky",   label: "Spooky",     icon: "👻" }
];

var LEVELS = ["A1", "A2", "B1", "B2"];

function e(t, g) { return { t: t, g: g }; }

var DATA = {};

/* ---- A1 -------------------------------------------------- */
DATA.A1 = {
  who: [
    e("A very hungry dragon", ["fantasy"]),
    e("A cat who hates water", ["everyday","fantasy"]),
    e("A robot who wants to be funny", ["scifi"]),
    e("A boy with very big shoes", ["everyday","school"]),
    e("A girl who is always late", ["school","everyday"]),
    e("A dog with a superpower", ["everyday","fantasy"]),
    e("A very sleepy ghost", ["spooky"]),
    e("A very small giant", ["fantasy"]),
    e("A pizza chef with no cheese", ["everyday"]),
    e("A parrot who says everything", ["everyday","mystery"]),
    e("An alien who loves cake", ["scifi"]),
    e("A teacher who is scared of the board", ["school"]),
    e("A footballer who cannot run fast", ["school","everyday"]),
    e("A witch with a broken hat", ["fantasy","spooky"]),
    e("A bus driver who is lost", ["everyday","mystery"]),
    e("A monster who is afraid of the dark", ["spooky"]),
    e("A singer with no voice today", ["school","everyday"]),
    e("A detective who loses everything", ["mystery"]),
    e("A snowman in a hot country", ["fantasy"]),
    e("A student with a very strange bag", ["school","mystery"]),
    e("A grandmother on a big motorbike", ["everyday"]),
    e("A vampire who only drinks orange juice", ["spooky"]),
    e("A pilot who is scared of clouds", ["everyday","scifi"]),
    e("A fish who wants to walk", ["fantasy"]),
    e("A phone that talks too much", ["scifi","everyday"]),
    e("A clown who is not funny", ["everyday"])
  ],
  wants: [
    e("wants to win a big prize", ["everyday","school"]),
    e("wants to find a lost friend", ["everyday","mystery"]),
    e("wants to make one new friend", ["everyday","school"]),
    e("wants to eat the biggest cake in town", ["everyday"]),
    e("wants to go to the moon", ["scifi"]),
    e("wants to open a secret door", ["mystery","fantasy"]),
    e("wants to sing in front of the class", ["school"]),
    e("wants to catch a very fast thief", ["mystery"]),
    e("wants to fly for one day", ["fantasy","scifi"]),
    e("wants to sleep for ten hours", ["everyday","spooky"]),
    e("wants to pass a difficult test", ["school"]),
    e("wants to get home before dark", ["everyday","spooky"]),
    e("wants to find treasure in the garden", ["fantasy","mystery"]),
    e("wants to build a giant machine", ["scifi"]),
    e("wants to win the school football game", ["school"]),
    e("wants to talk to a ghost", ["spooky"]),
    e("wants to learn one magic trick", ["fantasy","school"]),
    e("wants to save a very small animal", ["everyday","fantasy"]),
    e("wants to become famous on the internet", ["everyday","school"]),
    e("wants to escape from a dark room", ["spooky","mystery"]),
    e("wants to buy new shoes", ["everyday"]),
    e("wants to make everyone laugh", ["everyday","school"]),
    e("wants to visit a strange planet", ["scifi"]),
    e("wants to find out who took the cookies", ["mystery","school"]),
    e("wants to break a world record", ["everyday","school"]),
    e("wants to fix a broken robot", ["scifi"])
  ],
  but: [
    e("but the door is locked", ["mystery","everyday"]),
    e("but they have no money", ["everyday"]),
    e("but it is already very late", ["everyday","school"]),
    e("but they are afraid of the dark", ["spooky"]),
    e("but nobody believes them", ["mystery","school"]),
    e("but the map is wrong", ["mystery","fantasy"]),
    e("but it starts to rain", ["everyday"]),
    e("but they cannot stop laughing", ["everyday","school"]),
    e("but the bus never comes", ["everyday"]),
    e("but they forget everything", ["school","mystery"]),
    e("but their best friend says no", ["everyday","school"]),
    e("but the machine does not work", ["scifi"]),
    e("but there is a big hole in the road", ["everyday","fantasy"]),
    e("but they only have five minutes", ["school","everyday"]),
    e("but a dog eats the important paper", ["school","everyday"]),
    e("but all the lights go out", ["spooky","scifi"]),
    e("but they cannot swim", ["everyday","fantasy"]),
    e("but the magic word is a secret", ["fantasy"]),
    e("but everyone is watching them", ["school","everyday"]),
    e("but the phone has no battery", ["everyday","scifi"]),
    e("but the window is too small", ["mystery","spooky"]),
    e("but they lose one shoe", ["everyday"]),
    e("but the food is horrible", ["everyday"]),
    e("but a very big cat is in the way", ["fantasy","everyday"]),
    e("but they are allergic to flowers", ["everyday"]),
    e("but the key is at the bottom of a lake", ["fantasy","mystery"])
  ],
  twist: [
    e("Someone films the whole thing.", ["everyday","school"]),
    e("All the lights go out.", ["spooky"]),
    e("A big dog runs into the room.", ["everyday"]),
    e("It starts to snow in July.", ["fantasy"]),
    e("Their phone rings at the worst moment.", ["everyday"]),
    e("A door opens by itself.", ["spooky","mystery"]),
    e("Everybody starts singing.", ["school","everyday"]),
    e("A robot walks in and says hello.", ["scifi"]),
    e("They find a letter with their name on it.", ["mystery"]),
    e("The teacher is watching.", ["school"]),
    e("A window breaks.", ["mystery","spooky"]),
    e("They wake up in a different place.", ["scifi","fantasy"]),
    e("Their little brother knows the secret.", ["everyday","mystery"]),
    e("The floor is suddenly very wet.", ["everyday"]),
    e("A strange bird lands on their head.", ["fantasy","everyday"]),
    e("Every clock stops.", ["spooky","scifi"]),
    e("Somebody is already there.", ["mystery","spooky"]),
    e("The bag is completely empty.", ["mystery","everyday"]),
    e("They hear a very loud noise outside.", ["spooky","everyday"]),
    e("Everything turns green.", ["scifi","fantasy"])
  ],

  prefill: { start: "", problem: "", worst: "", ending: "" }
};

/* ---- Shared pools ---------------------------------------- */
var CURVEBALLS = [
  "Somebody starts crying, and it is not who you expect.",
  "The power goes out.",
  "A dog gets involved.",
  "Somebody's phone rings at the worst possible moment.",
  "It starts raining. Hard.",
  "Somebody tells a lie to protect another person.",
  "A stranger claims they know what happened.",
  "The door will not open.",
  "Somebody arrives who was not invited.",
  "Two characters swap sides.",
  "A very old photograph turns up.",
  "Everyone starts laughing at completely the wrong moment.",
  "Somebody faints.",
  "The plan works. Too well.",
  "A message arrives in the wrong language.",
  "Somebody's little brother has been listening at the door.",
  "The clock is wrong.",
  "Something breaks that cannot be replaced.",
  "Somebody apologises and nobody accepts it.",
  "A window opens by itself.",
  "The food is ruined.",
  "Somebody finds a key and has no idea what it opens.",
  "The lights come back on and something has moved.",
  "Somebody says the wrong name."
];

var TITLE_ADJ = ["Last","Secret","Silent","Impossible","Missing","Golden","Forgotten","Terrible","Curious","Unlucky","Strange","Perfect","Broken","Endless","Quiet","Furious","Borrowed","Wrong"];
var TITLE_NOUN = ["Letter","Promise","Key","Machine","Sunday","Neighbour","Mistake","Photograph","Door","Song","Bet","Detective","Storm","Guest","Recipe","Passenger","Rehearsal","Shortcut"];
var TITLE_PLACE = ["Room 12","Hollow Street","the Old Pier","Green Hill","the Night Bus","the Back Garden","Flat 4B","the Lighthouse","the School Roof","Winter","the Last Train","the Blue House","Platform 3","the Long Weekend"];

var BEATS = [
  { id: "start",   name: "Start",        q: "Where are we? Who is there? What is normal?" },
  { id: "problem", name: "Problem",      q: "What goes wrong first?" },
  { id: "worst",   name: "Worst moment", q: "When does it look hopeless?" },
  { id: "ending",  name: "Ending",       q: "How does it finish? Happy, sad or weird, your call." }
];

var SLOTS = [
  { id: "who",   tag: "WHO" },
  { id: "wants", tag: "WANTS" },
  { id: "but",   tag: "BUT" },
  { id: "twist", tag: "AND THEN" }
];

/* ===========================================================
   State
   =========================================================== */

var KEY = "storySpark.v2";

var state = {
  level: "A2",
  genre: "all",
  spark: { who: "", wants: "", but: "", twist: "" },
  locks: { who: false, wants: false, but: false, twist: false },
  title: "",
  words: [],
  beats: { start: "", problem: "", worst: "", ending: "" },
  box: [],
  big: false
};

var lastBeat = "start";

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (err) {}
}

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return false;
    var s = JSON.parse(raw);
    if (!s || !s.spark) return false;
    if (LEVELS.indexOf(s.level) === -1) s.level = "A2";
    state.level = s.level;
    state.genre = s.genre || "all";
    state.spark = s.spark;
    state.locks = s.locks || { who: false, wants: false, but: false, twist: false };
    state.title = s.title || "";
    state.words = s.words || [];
    state.beats = s.beats || { start: "", problem: "", worst: "", ending: "" };
    state.box = s.box || [];
    state.big = !!s.big;
    return !!state.spark.who;
  } catch (err) { return false; }
}

/* ===========================================================
   Picking
   =========================================================== */

function pool(slot) {
  var all = DATA[state.level][slot];
  if (state.genre === "all") return all;
  var filtered = all.filter(function (item) { return item.g.indexOf(state.genre) !== -1; });
  return filtered.length >= 3 ? filtered : all;
}

function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

function pickSlot(slot) {
  var list = pool(slot);
  var current = state.spark[slot];
  var choice = pick(list).t;
  var guard = 0;
  while (choice === current && list.length > 1 && guard < 12) { choice = pick(list).t; guard++; }
  return choice;
}

function wordPool() {
  var w = DATA[state.level].words;
  if (state.genre !== "all" && w[state.genre]) return w[state.genre].slice();
  var merged = [];
  for (var k in w) { if (w.hasOwnProperty(k)) merged = merged.concat(w[k]); }
  return merged;
}

/* ===========================================================
   Actions
   =========================================================== */

var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function spin(done) {
  var m = document.getElementById("machine");
  if (reduceMotion) { done(); return; }
  m.classList.add("rolling");
  setTimeout(function () { m.classList.remove("rolling"); done(); }, 190);
}

function rollAll() {
  spin(function () {
    SLOTS.forEach(function (s) {
      if (!state.locks[s.id]) state.spark[s.id] = pickSlot(s.id);
    });
    rollTitle(true);
    rollWords(true);
    addToBox();
    renderMachine();
    save();
  });
}

function rollSlot(slot) {
  state.locks[slot] = false;
  spin(function () {
    state.spark[slot] = pickSlot(slot);
    renderMachine();
    save();
  });
}

function toggleLock(slot) {
  state.locks[slot] = !state.locks[slot];
  renderMachine();
  save();
}

function rollTitle(quiet) {
  state.title = "The " + pick(TITLE_ADJ) + " " + pick(TITLE_NOUN) + " of " + pick(TITLE_PLACE);
  if (!quiet) { renderMachine(); save(); }
}

function rollWords(quiet) {
  var p = wordPool();
  var out = [];
  var guard = 0;
  while (out.length < 3 && guard < 90) {
    var w = pick(p);
    if (out.indexOf(w) === -1) out.push(w);
    guard++;
  }
  state.words = out;
  if (!quiet) { renderMachine(); save(); }
}

function setLevel(lv) {
  if (lv === state.level) return;
  var oldPre = DATA[state.level].prefill;
  var newPre = DATA[lv].prefill;
  state.level = lv;
  BEATS.forEach(function (b) {
    var v = state.beats[b.id];
    if (v === "" || v === oldPre[b.id]) state.beats[b.id] = newPre[b.id];
  });
  state.locks = { who: false, wants: false, but: false, twist: false };
  rollAll();
  renderControls();
  renderConnectors();
  renderBeats();
}

function setGenre(g) {
  state.genre = g;
  rollAll();
  renderControls();
}

function plotTwist() {
  var card = document.getElementById("twistCard");
  card.textContent = "🌀 " + pick(CURVEBALLS);
  card.classList.remove("show");
  void card.offsetWidth;
  card.classList.add("show");
}

function insertConnector(text) {
  var ta = document.getElementById("ta-" + lastBeat);
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var before = ta.value.slice(0, start);
  var after = ta.value.slice(end);
  var glue = (before.length && !/\s$/.test(before)) ? " " : "";
  var chunk = glue + text + " ";
  ta.value = before + chunk + after;
  ta.focus();
  ta.selectionStart = ta.selectionEnd = start + chunk.length;
  state.beats[lastBeat] = ta.value;
  save();
}

function clearBeats() {
  if (!confirm("Clear your writing? The spark stays.")) return;
  var pre = DATA[state.level].prefill;
  BEATS.forEach(function (b) { state.beats[b.id] = pre[b.id]; });
  renderBeats();
  save();
}

function sparkSentence() {
  var s = state.spark;
  return s.who + " " + s.wants + ", " + s.but + ". And then: " + s.twist;
}

function storyText() {
  var out = state.title + "\n\n" + sparkSentence() + "\n\n";
  BEATS.forEach(function (b) {
    var v = (state.beats[b.id] || "").trim();
    if (v) out += v + "\n\n";
  });
  return out.replace(/\s+$/, "");
}

function copyStory() {
  var btn = document.getElementById("copyBtn");
  navigator.clipboard.writeText(storyText()).then(function () {
    btn.textContent = "Copied";
    setTimeout(function () { btn.textContent = "Copy story"; }, 1400);
  }, function () {
    btn.textContent = "Copy failed";
    setTimeout(function () { btn.textContent = "Copy story"; }, 1400);
  });
}

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function printSheet() {
  var rules = "";
  for (var i = 0; i < 4; i++) { rules += '<div class="rule"></div>'; }
  var html = '<h2>' + esc(state.title) + '</h2>';
  html += '<div class="p-spark">' + esc(sparkSentence()) +
          '<br><b>Bonus words:</b> ' + esc(state.words.join("  ·  ")) + '</div>';
  BEATS.forEach(function (b) {
    html += '<div class="p-beat"><b>' + b.name + '</b> &nbsp;<span>' + esc(b.q) + '</span>' + rules + '</div>';
  });
  document.getElementById("printSheet").innerHTML = html;
  window.print();
}

/* ---- Spark box ------------------------------------------- */

function addToBox() {
  var entry = {
    level: state.level,
    text: sparkSentence(),
    spark: { who: state.spark.who, wants: state.spark.wants, but: state.spark.but, twist: state.spark.twist },
    title: state.title,
    fav: false
  };
  var kept = state.box.filter(function (b) { return b.text !== entry.text; });
  kept.unshift(entry);
  var favs = kept.filter(function (b) { return b.fav; });
  var rest = kept.filter(function (b) { return !b.fav; }).slice(0, 12);
  state.box = favs.concat(rest);
  renderBox();
}

function restoreSpark(i) {
  var b = state.box[i];
  if (!b) return;
  state.spark = { who: b.spark.who, wants: b.spark.wants, but: b.spark.but, twist: b.spark.twist };
  state.title = b.title;
  renderMachine();
  save();
  window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
}

function toggleFav(i, ev) {
  ev.stopPropagation();
  state.box[i].fav = !state.box[i].fav;
  renderBox();
  save();
}

function clearBox() {
  if (!confirm("Empty the spark box? Starred sparks go too.")) return;
  state.box = [];
  renderBox();
  save();
}

/* ===========================================================
   Rendering
   =========================================================== */

function renderControls() {
  document.getElementById("levelRow").innerHTML = LEVELS.map(function (lv) {
    return '<button class="chip lvl' + (lv === state.level ? " active" : "") +
           '" onclick="setLevel(\'' + lv + '\')">' + lv + '</button>';
  }).join("");

  document.getElementById("genreRow").innerHTML = GENRES.map(function (g) {
    return '<button class="chip' + (g.id === state.genre ? " active" : "") +
           '" onclick="setGenre(\'' + g.id + '\')">' + g.icon + " " + g.label + '</button>';
  }).join("");
}

function renderMachine() {
  document.getElementById("machine").innerHTML = SLOTS.map(function (s) {
    var locked = state.locks[s.id];
    return '<div class="reel' + (locked ? " locked" : "") + '" data-slot="' + s.id + '">' +
             '<div class="reel-tag">' + s.tag + '</div>' +
             '<div class="reel-text">' + esc(state.spark[s.id]) + '</div>' +
             '<div class="reel-ctl">' +
               '<button class="mini lock" onclick="toggleLock(\'' + s.id + '\')" title="Keep this line">' +
                 (locked ? "🔒" : "🔓") + '</button>' +
               '<button class="mini" onclick="rollSlot(\'' + s.id + '\')" title="Swap this line">🎲</button>' +
             '</div>' +
           '</div>';
  }).join("");

  document.getElementById("titleOut").textContent = state.title || "—";
  document.getElementById("wordsOut").innerHTML = state.words.map(function (w) {
    return '<span class="wordchip">' + esc(w) + '</span>';
  }).join("");
}

function renderConnectors() {
  document.getElementById("connectors").innerHTML = DATA[state.level].connectors.map(function (t, i) {
    return '<button class="conn" data-conn="' + i + '">' + esc(t) + '</button>';
  }).join("");
  var conns = DATA[state.level].connectors;
  Array.prototype.forEach.call(document.querySelectorAll("#connectors .conn"), function (btn) {
    btn.addEventListener("click", function () { insertConnector(conns[Number(btn.dataset.conn)]); });
  });
}

function renderBeats() {
  document.getElementById("beats").innerHTML = BEATS.map(function (b) {
    return '<div class="beat">' +
             '<div class="beat-head"><span class="beat-name">' + b.name + '</span>' +
             '<span class="beat-q">' + esc(b.q) + '</span></div>' +
             '<textarea id="ta-' + b.id + '" placeholder="' + esc(b.q) + '"></textarea>' +
           '</div>';
  }).join("");

  BEATS.forEach(function (b) {
    var ta = document.getElementById("ta-" + b.id);
    ta.value = state.beats[b.id] || "";
    ta.addEventListener("input", function () { state.beats[b.id] = ta.value; save(); });
    ta.addEventListener("focus", function () { lastBeat = b.id; });
  });
}

function renderBox() {
  var host = document.getElementById("sparkbox");
  document.getElementById("boxCount").textContent = state.box.length ? "(" + state.box.length + ")" : "";
  if (!state.box.length) {
    host.innerHTML = '<div class="empty-note">Every story you roll lands here. Click one to bring it back, star one to keep it.</div>';
    return;
  }
  host.innerHTML = state.box.map(function (b, i) {
    return '<div class="spark-item" onclick="restoreSpark(' + i + ')">' +
             '<div class="si-top"><span class="si-lvl">' + esc(b.level) + '</span>' +
             '<button class="star' + (b.fav ? " on" : "") + '" onclick="toggleFav(' + i + ', event)" title="Keep this one">★</button></div>' +
             esc(b.text) +
           '</div>';
  }).join("");
}

function renderAll() {
  renderControls();
  renderMachine();
  renderConnectors();
  renderBeats();
  renderBox();
}

/* ---- Chrome ---------------------------------------------- */

function toggleTheme() {
  var html = document.documentElement;
  var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
  html.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
}

function toggleBig() {
  state.big = !state.big;
  document.body.classList.toggle("bigscreen", state.big);
  document.getElementById("bigBtn").classList.toggle("on", state.big);
  save();
}

(function () {
  var saved = localStorage.getItem("theme");
  if (saved) { document.documentElement.setAttribute("data-theme", saved); }
})();

document.addEventListener("keydown", function (ev) {
  if (ev.target && (ev.target.tagName === "TEXTAREA" || ev.target.tagName === "INPUT")) return;
  if (ev.code === "Space") { ev.preventDefault(); rollAll(); }
  if (ev.key === "t" || ev.key === "T") { plotTwist(); }
});

/* ---- Boot: never a blank state --------------------------- */
(function init() {
  var restored = load();
  if (state.big) {
    document.body.classList.add("bigscreen");
    document.getElementById("bigBtn").classList.add("on");
  }
  if (!restored) {
    var pre = DATA[state.level].prefill;
    BEATS.forEach(function (b) { state.beats[b.id] = pre[b.id]; });
    SLOTS.forEach(function (s) { state.spark[s.id] = pickSlot(s.id); });
    rollTitle(true);
    rollWords(true);
    addToBoxInit();
  }
  renderAll();
  save();
})();

function addToBoxInit() {
  state.box.unshift({
    level: state.level,
    text: sparkSentence(),
    spark: { who: state.spark.who, wants: state.spark.wants, but: state.spark.but, twist: state.spark.twist },
    title: state.title,
    fav: false
  });
}
</script>
